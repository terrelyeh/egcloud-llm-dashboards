<style>
/* === theme/tokens.css === */
:root {
  /* Surfaces & background — warmer cream to align with marketing site */
  --bg: #fbf8f1;
  --bg-gradient: radial-gradient(at 0% 0%, #f3eee2 0%, #fbf8f1 50%);
  --surface: #ffffff;
  --surface-2: #fbf9f3;
  --hdr-bg: rgba(247, 247, 245, 0.85);   /* sticky frosted header */

  /* Borders */
  --border: rgba(60, 50, 35, 0.10);
  --border-strong: rgba(60, 50, 35, 0.20);

  /* Text */
  --text-1: #1a2332;
  --text-2: #4a5568;
  --text-3: #8b95a4;

  /* Brand — EnGenius Cloud blue, primary interaction color (matches demo pages) */
  --brand: #03A9F4;
  --brand-2: #0288D1;

  /* Severity */
  --critical: #b91c1c;
  --critical-bg: #fef2f2;
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --success: #047857;
  --success-bg: #ecfdf5;
  --info: #1d4ed8;
  --info-bg: #eff6ff;

  /* Effects — slightly more pronounced shadow + tighter radius */
  --shadow-sm: 0 1px 2px rgba(60,50,35,.05), 0 0 0 1px rgba(60,50,35,.05);
  --shadow-md: 0 6px 18px rgba(60,50,35,.08), 0 2px 4px rgba(60,50,35,.04);
  --radius: 12px;
  --radius-sm: 8px;

  /* Typography */
  --font-sans: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* === theme/base.css === */
/* Base reset + shell layout */

/* ── Type & spacing scale (Comfortable) · see design.md §Typography & Spacing ──
   Single source of truth. Widgets reference these tokens, not hardcoded px,
   so the scale stays consistent across all widgets + light/dark themes. */
:root {
  --fs-micro:  11px;  /* counts, axis ticks, footnotes */
  --fs-label:  12px;  /* UPPERCASE labels, table headers, meta, pills */
  --fs-sub:    13px;  /* secondary / caption / sub-line */
  --fs-body:   15px;  /* table cells, default body text */
  --fs-value:  16px;  /* emphasized values (key_value, etc.) */
  --fs-title:  18px;  /* card / section titles */
  --fs-num-sm: 22px;  /* small stat numbers */
  --fs-num:    28px;  /* KPI numbers */
  --fs-num-xl: 36px;  /* hero KPI numbers */

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 22px;    /* card padding */
  --space-6: 32px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Sticky header — outer container handles sticky + bg, inner constrains width */
.db-hdr {
  position: sticky; top: 0; z-index: 10;
  background: var(--hdr-bg);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.db-hdr-inner {
  max-width: 1320px; margin: 0 auto;
  padding: 18px 32px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px;
}
.db-hdr-left {
  display: flex; align-items: center; gap: 14px;
  min-width: 0;
}
.db-brand-logo {
  width: 57px; height: 57px;
  flex-shrink: 0;
  display: block;
}
.db-hdr-titles { min-width: 0; }
.db-hdr-titles h1 {
  margin: 0; font-size: var(--fs-num-sm); font-weight: 700; letter-spacing: -0.015em;
}
.db-hdr-titles .crumb {
  font-size: var(--fs-sub); color: var(--text-3); margin-top: 3px; font-weight: 500;
}
/* Hide the subtitle row entirely when spec didn't provide one — avoids an
   empty 16px-ish line under the title that makes some canvases look
   bottom-heavy vs others. compose.py always renders the div for layout
   stability; this CSS collapses it when empty. */
.db-hdr-titles .crumb:empty { display: none; }

/* Identity chips · soft-tinted pills in the right header column.
   Account = who (info / blue tint), Scope = what is in view (brand / orange).
   Background uses color-mix to blend the accent into surface — visible but
   not loud enough to compete with severity pills inside the dashboard body. */
.db-chips {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.db-chips[hidden] { display: none; }
.db-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.01em;
  color: var(--text-1); line-height: 1.2;
  white-space: nowrap; max-width: 380px;
  overflow: hidden; text-overflow: ellipsis;
  cursor: default;
}
.db-chip[hidden] { display: none; }
.db-chip .ic { font-size: var(--fs-label); line-height: 1; flex-shrink: 0; opacity: 0.85; }
/* `.lbl` is hidden by default — account chip just shows the email inline.
   Scope chip opts back in with a small uppercase tag (e.g., SCOPE Danny /
   SNAPSHOT 2026-05-19) because the value alone is too ambiguous (a bare
   "Danny" or "5 orgs" doesn't read as "this is the dashboard scope"). */
.db-chip .lbl { display: none; }
.db-chip-scope .lbl {
  display: inline; font-size: var(--fs-micro); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-3); margin-right: 4px;
}
.db-chip-account {
  background: color-mix(in srgb, var(--info) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--info) 22%, var(--border));
}
.db-chip-account .ic { color: var(--info); }
.db-chip-scope {
  background: color-mix(in srgb, var(--brand) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--border));
}
.db-chip-scope .ic { color: var(--brand); }
/* legacy selectors kept for old canvases that haven't been recomposed */
.db-hdr-left h1 { margin: 0; font-size: var(--fs-num-sm); font-weight: 700; letter-spacing: -0.015em; }
.db-hdr-left .crumb { font-size: var(--fs-sub); color: var(--text-3); margin-top: 3px; font-weight: 500; }
/* Right column stacks two rows so the column has visual weight matching
   the left title+subtitle: actions/status on top, identity chips below.
   Each row right-aligns so the visual edge stays clean. */
.db-hdr-right {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 10px; flex-shrink: 0;
}
.db-hdr-right-row {
  display: flex; align-items: center; gap: 14px;
}
.live-dot {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: var(--fs-sub); color: var(--text-2); font-weight: 500;
}
.live-dot::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 0 4px var(--success-bg);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.updated { font-size: var(--fs-sub); color: var(--text-3); font-family: var(--font-mono); }

/* Auto-refresh state · small pill next to Live tag.
   Two modes:
     .countdown — "next: 4:32" while auto is running (text-3 / surface tint)
     .paused    — "⚠ auto paused" after 3 consecutive errors (critical) */
.db-auto-state {
  font-family: var(--font-mono); font-size: var(--fs-label);
  padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.db-auto-state.countdown {
  color: var(--text-3);
  background: color-mix(in srgb, var(--text-3) 8%, var(--surface));
}
.db-auto-state.paused {
  color: var(--critical);
  background: color-mix(in srgb, var(--critical) 10%, var(--surface));
}
.db-auto-state .db-auto-state-close {
  background: transparent; border: 0; padding: 0; margin-left: 4px;
  cursor: pointer; color: inherit; font-size: var(--fs-label); opacity: 0.6;
}
.db-auto-state .db-auto-state-close:hover { opacity: 1; }

/* Refresh status banner — sits between Deploy and Live, showing live recipe
   state (pending ticker / success summary / error with close button). */
.db-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.01em;
  line-height: 1; white-space: nowrap;
  max-width: 360px; overflow: hidden; text-overflow: ellipsis;
}
.db-status[hidden] { display: none; }
.db-status .ic { font-size: var(--fs-sub); line-height: 1; }
.db-status-pending { background: var(--info-bg);     color: var(--info); }
.db-status-success { background: var(--success-bg);  color: var(--success); }
.db-status-error   { background: var(--critical-bg); color: var(--critical); }
.db-status-close {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  font-size: var(--fs-sub); line-height: 1; padding: 0 0 0 6px; opacity: 0.7;
}
.db-status-close:hover { opacity: 1; }

/* Main wrap */
.db-wrap { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--text-1); padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: var(--fs-label); font-weight: 600; cursor: pointer;
  transition: all .15s ease; font-family: inherit;
}
.btn:hover { background: var(--surface-2); border-color: var(--brand); color: var(--brand); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text-1); }
.btn.btn-primary {
  background: var(--brand); color: white; border-color: var(--brand);
}
.btn.btn-primary:hover { background: var(--brand); color: white; border-color: var(--brand); filter: brightness(1.08); }
.btn.btn-primary:disabled:hover { background: var(--brand); color: white; }
.btn.spinning .ic { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ic { display: inline-block; line-height: 1; }
.ic.spin { animation: spin 0.7s linear infinite; }
/* Icon-only button (no label) — gear / cog / similar single-glyph actions */
.btn.db-btn-icon { padding: 6px 9px; }
.btn.db-btn-icon .ic { font-size: var(--fs-body); }

/* Snapshot tag (replaces live-dot when canvas is a deployed snapshot) */
.snapshot-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.02em;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
}

/* Deploy modal */
.db-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 24px;
}
.db-modal-backdrop[hidden] { display: none; }
.db-modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  width: 100%; max-width: 560px; max-height: calc(100vh - 48px);
  overflow: hidden; display: flex; flex-direction: column;
}
.db-modal-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.db-modal-hdr h2 {
  margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.01em;
}
.db-modal-close {
  background: transparent; border: 0; font-size: var(--fs-num-sm); line-height: 1;
  color: var(--text-3); cursor: pointer; padding: 4px 8px; border-radius: 6px;
}

<script>
// Dashboard runtime: polls live-data, dispatches to widgets, exposes event bus.
// Widgets self-register via Dashboard.register('<name>', {init, render}).
//
// Each widget receives in init({el, config, bus, state}) and render(data, ctx).
// `data` is a map of alias → JSON. `ctx` exposes helpers (flash, scrollTo, etc).

window.Dashboard = (() => {
  const widgets = new Map(); // name → factory
  const mounted = [];         // [{name, el, config, state, instance}]
  const bus = new EventTarget();
  let currentSpec = null;     // the spec passed to Dashboard.init — used by modal i18n lookup
  let cachedAccount = null;   // /account response, cached after first fetch
  let cachedOrgs = null;      // /user-orgs response, cached after first fetch
  let liveData = {};          // alias → relative path
  let dataSnapshot = {};      // alias → parsed JSON
  let pollHandle = null;
  let snapshotMeta = null;    // truthy when canvas is a deployed (frozen) snapshot
  let liveMeta = null;        // truthy when canvas is a deployed Live copy (refresh via /api/refresh)

  // Auto-refresh state — opt-in via Settings modal, persisted per-canvas in
  // localStorage. setTimeout-based (not setInterval) so manual Refresh can
  // cleanly reset "next at" without doubled fires. See applyAutoRefresh().
  let autoRefreshSeconds = 0;     // 0 = off
  let autoRefreshTimer = null;    // setTimeout handle
  let countdownTimer = null;      // 1s setInterval for UI ticker
  let nextRefreshAt = 0;          // ms timestamp
  let autoRefreshFailCount = 0;
  let autoRefreshPaused = false;
  let runRefreshFn = null;        // bound in init() so Settings save can re-trigger

  function register(name, factory) {
    widgets.set(name, factory);
  }

  function dispatch(type, detail) {
    bus.dispatchEvent(new CustomEvent(type, { detail }));
  }

  function on(type, handler) {
    bus.addEventListener(type, handler);
  }

  // Helpers for widgets
  const ctx = {
    flash(el) {
      if (!el) return;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    },
    scrollToWidget(id, opts = {}) {
      const target = document.querySelector(`[data-widget-id="${id}"]`);
      if (target) {
        target.scrollIntoView({behavior:'smooth', block: opts.block || 'start'});
        setTimeout(() => ctx.flash(target), 300);
      }
    },
    fmtDate(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().split('T')[0];
    },
    fmtDateTime(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().replace('T',' ').slice(0,16);
    },
    daysSince(ms) {
      if (!ms) return Infinity;
      return Math.floor((Date.now() - ms) / 86400000);
    },
    getByPath(obj, path) {
      if (!path) return obj;
      // Support: foo.bar.baz, foo.bar.length, foo[0].bar, foo.bar[2]
      // Tokenize by . and [n] (where n is integer)
      const tokens = [];
      path.split('.').forEach(seg => {
        const m = seg.match(/^([^\[]*)((?:\[\d+\])*)$/);
        if (!m) return;
        if (m[1]) tokens.push(m[1]);
        const idxRe = /\[(\d+)\]/g;
        let im;
        while ((im = idxRe.exec(m[2])) !== null) tokens.push(parseInt(im[1], 10));
      });
      return tokens.reduce((o, k) => {
        if (o == null) return undefined;
        if (k === 'length' && Array.isArray(o)) return o.length;
        return o[k];
      }, obj);
    },
  };

  async function fetchAll() {
    const out = {};
    for (const [alias, path] of Object.entries(liveData)) {
      try {
        const r = await fetch(path, { cache: 'no-store' });
        out[alias] = await r.json();
      } catch (e) {
        console.warn('fetch fail', path, e);
        out[alias] = null;
      }
    }
    dataSnapshot = out;
    return out;
  }

  async function tick() {
    await fetchAll();
    for (const m of mounted) {
      try {
        m.instance.render(dataSnapshot, ctx);
      } catch (e) {
        console.error(`[widget ${m.name}] render error`, e);
      }
    }
    // Update header timestamp (skipped in snapshot mode — handled by applySnapshotMode)
    if (snapshotMeta) return;
    const t = new Date();
    const stamp = document.getElementById('db-updated');
    if (stamp) {
      stamp.textContent = `updated ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    }
  }

  // ---------- Snapshot mode ----------
  // A canvas deployed via /deploy ships a _snapshot.json marker. When present
  // we know we're rendering a frozen public copy (e.g. on Vercel) where the
  // /refresh and /deploy endpoints don't exist — hide those buttons and the
  // "Live" indicator and surface the deployed_at timestamp instead.
  async function detectSnapshotMode() {
    try {
      const r = await fetch('_snapshot.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  function applySnapshotMode(meta) {
    const refresh = document.getElementById('db-refresh');
    const deploy = document.getElementById('db-deploy');
    const liveDot = document.getElementById('db-live-dot');
    const updated = document.getElementById('db-updated');
    if (refresh) refresh.style.display = 'none';
    if (deploy) deploy.style.display = 'none';
    if (liveDot) {
      liveDot.classList.remove('live-dot');
      liveDot.classList.add('snapshot-tag');
      liveDot.textContent = meta.redacted ? 'Snapshot · redacted' : 'Snapshot';
    }
    if (updated) {
      const t = new Date(meta.deployed_at);
      updated.textContent = isNaN(t) ? meta.deployed_at : ctx.fmtDateTime(t.getTime());
    }
  }

  // ---------- Live mode ----------
  // A canvas deployed via /deploy mode=live ships a _live.json marker plus an
  // /api/refresh serverless function. Unlike a snapshot it CAN refresh — but
  // the deployed filesystem is read-only, so Refresh calls the function and
  // renders the returned data inline instead of POSTing to the local server.
  // Deploy + Settings are still hidden (a deployed copy can't redeploy or swap
  // keys) and polling is off (data changes only on an explicit Refresh).
  async function detectLiveMode() {
    try {
      const r = await fetch('_live.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  function applyLiveMode(meta) {
    const deploy = document.getElementById('db-deploy');
    const settings = document.getElementById('db-settings');
    const updated = document.getElementById('db-updated');
    if (deploy) deploy.style.display = 'none';
    if (settings) settings.style.display = 'none';
    // Refresh button stays (the whole point of Live mode). Header keeps the
    // green "Live" dot. Seed the timestamp from deploy time until first refresh.
    if (updated && meta.deployed_at) {
      const t = new Date(meta.deployed_at);
      updated.textContent = isNaN(t) ? meta.deployed_at : ctx.fmtDateTime(t.getTime());
    }
  }

  // ---------- Identity chips · Account + Scope ----------
  // serve.py proxies these to api-skills (cached server-side). Snapshot mode
  // can't reach the local endpoints, so it falls back to baked-in info from
  // _snapshot.json (TODO: bake account/scope into snapshot at deploy time).
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function fetchJson(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
    return r.json();
  }

  function fillAccountChip(account) {
    const el = document.getElementById('db-chip-account');
    if (!el || !account) return;
    // Email is the canonical identifier — display names can repeat or be
    // missing. Show email inline; full name lives in the hover tooltip for
    // anyone who wants to confirm who that mailbox belongs to.
    const email = account.email || '';
    if (!email) return;
    const name = [account.given_name, account.family_name]
      .filter(Boolean).join(' ').trim();
    el.innerHTML = `<span class="ic">👤</span>${escapeHtml(email)}`;
    el.hidden = false;
    el.title = name ? `${name} · ${email}` : email;
  }

  function fillScopeChip(refresh, orgsPayload) {
    const el = document.getElementById('db-chip-scope');
    if (!el) return;
    // Deployed copy (snapshot or live): no local API access. Prefer baked-in
    // scope.name persisted into the marker file at deploy time. Snapshot has a
    // dated "Snapshot" fallback; live always bakes scope so it shows the name.
    const dm = snapshotMeta || liveMeta;
    if (dm) {
      const baked = dm.scope;
      if (baked?.name) {
        el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(baked.name)}`;
        el.hidden = false;
        return;
      }
      if (snapshotMeta) {
        const date = (snapshotMeta.deployed_at || '').slice(0, 10);
        const tag = snapshotMeta.redacted ? `${date} · redacted` : date;
        el.innerHTML = `<span class="ic">📷</span><span class="lbl">Snapshot</span>${escapeHtml(tag)}`;
        el.hidden = false;
        return;
      }
      // live without a baked name: fall through to id-based rendering below.
    }
    if (!refresh || !refresh.scope) {
      // No refresh declared and no snapshot — nothing to show.
      return;
    }
    const orgs = orgsPayload?.org_candidates || [];
    const findOrg = (id) => orgs.find(o => o.org_id === id);
    let value = '';
    let tooltip = '';
    const ids = refresh.ids || {};
    if (refresh.scope === 'all') {
      const count = orgsPayload?.count ?? orgs.length;
      value = `${count} org${count === 1 ? '' : 's'}`;
      tooltip = orgs.map(o => o.name).filter(Boolean).join(', ');
    } else if (refresh.scope === 'org') {
      const o = findOrg(ids.org_id);
      value = o?.name || ids.org_id || '?';
      tooltip = ids.org_id || '';
    } else if (refresh.scope === 'hv') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  hv_id: ${ids.hv_id || '?'}`;
    } else if (refresh.scope === 'network') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  network_id: ${ids.network_id || '?'}`;
    } else {
      value = refresh.scope;
    }
    el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(value)}`;
    if (tooltip) el.title = tooltip;
    el.hidden = false;
  }

  async function renderIdentityChips(refresh) {
    const chipsHost = document.getElementById('db-chips');
    if (!chipsHost) return;
    // Always show the chip row container once we try; chips inside reveal as
    // their data arrives, so a 502 on /user-orgs still lets account chip show.
    chipsHost.hidden = false;
    const tasks = [];
    const dm = snapshotMeta || liveMeta;  // deployed copy → baked identity, no live endpoints
    if (!dm) {
      tasks.push(fetchJson('/account').then(d => { cachedAccount = d; fillAccountChip(d); }).catch(e => {
        console.warn('[chip] /account failed:', e);
      }));
      tasks.push(fetchJson('/user-orgs').then(d => { cachedOrgs = d; fillScopeChip(refresh, d); }).catch(e => {
        console.warn('[chip] /user-orgs failed:', e);
        fillScopeChip(refresh, null);  // still render scope from ids without name lookup
      }));
    } else {
      // Deployed canvas (snapshot or live): no local endpoints. Read baked
      // identity out of the marker — the server bakes account.email +
      // scope.{kind,name,ids} into _snapshot.json / _live.json at deploy time.
      if (dm.account) fillAccountChip(dm.account);
      fillScopeChip(refresh, null);  // fillScopeChip inspects snapshotMeta/liveMeta itself
    }
    await Promise.allSettled(tasks);
    // Hide the host if both chips remained hidden (e.g., snapshot with no scope).
    const accVisible = !document.getElementById('db-chip-account')?.hidden;
    const scpVisible = !document.getElementById('db-chip-scope')?.hidden;
    if (!accVisible && !scpVisible) chipsHost.hidden = true;
  }

  // ---------- Deploy modal ----------
  function deriveCanvasDir() {
    // Pattern: /dashboard-builder/canvases/<canvas-id>/{index.html,}
    // Returns repo-relative dashboard-builder/canvases/<id>, or null if canvas
    // isn't served from the expected path (legacy flat canvas / dev server).
    const path = window.location.pathname;
    const m = path.match(/^(.*\/canvases\/[^/]+)\/?(index\.html)?$/);
    if (!m) return null;
    return m[1].replace(/^\//, '');
  }

  // ---------- i18n · UI strings ----------
  // Source of truth lives in dashboard-builder/skill/locales/*.json.
  // compose.py loads the requested locale (with en fallback) and embeds the
  // resolved dict as spec.i18n. Runtime + widgets read from there.
  // Adding a new language = drop a new locales/<lang>.json + zero JS changes.
  //
  // EN_FALLBACK kicks in only for legacy canvases composed before i18n was
  // wired up — those canvases lack spec.i18n. Mirrors locales/en.json so old
  // canvases keep working until they're recomposed.
  const EN_FALLBACK = {"deploy":{"title":"Deploy & share this dashboard","close":"Close","target":"Deploy to","target_vercel":"Vercel","target_vercel_sub":"Public URL · 3–30s · needs vercel login","target_ghpages":"GitHub Pages","target_ghpages_sub":"Public URL · 1–2 min · needs gh login + your repo","eta":"Estimated time","eta_vercel":"3–30 seconds","eta_ghpages":"1–2 minutes","url_label":"URL","url_suffix":".vercel.app","url_help":"Type here → URL updates live. Lowercase letters, digits and -, max 100 chars.","url_invalid":"Only lowercase letters, digits and -","repo_label":"GitHub repo","repo_placeholder":"owner/repo","repo_help":"Pick one of your repos (listed via gh CLI), or type owner/repo manually.","repo_invalid":"Format: owner/repo","repo_loading":"Listing repos…","repo_no_gh":"gh CLI not installed / logged in. Try `brew install gh && gh auth login`.","path_label":"Path","path_placeholder":"canvas-my-dashboard","path_help":"Subdirectory on the gh-pages branch of that repo.","path_invalid":"Only letters / digits / . _ -","scan_title":"Privacy check","scan_pending":"Checking…","scan_clean":"✓ No personal or org identifiers found — safe to share.","scan_has":"This dashboard includes identifying data:","purpose_title":"What's this deploy for?","purpose_keep_label":"Just me or my team","purpose_keep_desc":"Keep real org_id / MAC / IP / email values. The URL is public, so only share it with people who already have access to the raw data.","purpose_share_label":"Sharing with others / external demo","purpose_share_desc":"Auto-replace org_id / MAC / IP / email with demo placeholders (org A → demo-org-1; same input → same placeholder, so charts keep working).","cancel":"Cancel","deploy":"Deploy","deploying":"Deploying to Vercel… usually 3–30 seconds.","deploy_failed":"Deploy failed","deployed":"Deployed ✓","copy":"Copy URL","copied":"Copied!","live_label":"🔄 Live mode — refreshable after deploy","live_desc":"Ships a small serverless function so the deployed page can   function tFmt(str, vars) {

  // Vercel project name rules: lowercase alphanumeric + dash, ≤ 100 chars.
  // We normalise as user types: dash-separate invalid chunks, collapse runs.
  // Crucially the edge-dash strip ONLY runs on submit — stripping while the
  // user is mid-edit eats the dash they just typed and prevents them from
  // continuing (e.g. typing "abc-" → field becomes "abc" → can't add "-d").
  const PROJECT_NAME_RE = /^[a-z0-9-]+$/;
  function sanitizeProjectName(raw, { trimEdges = false } = {}) {
    let s = String(raw || '')
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, '-')
      .replace(/-+/g, '-')
      .slice(0, 100);
    if (trimEdges) s = s.replace(/^-+|-+$/g, '');
    return s;
  }
  function deriveDefaultProjectName(canvasDir) {
    // canvasDir is dashboard-builder/canvases/<id>/. Use the trailing <id>.
    const m = String(canvasDir || '').match(/canvases\/([^/]+)\/?$/);
    return sanitizeProjectName(m ? m[1] : 'canvas-snapshot');

  // Build the identity payload to bake into _snapshot.json so the deployed
  // copy keeps Account + Scope chips populated even without live endpoints.
  // Reads from the in-memory caches populated by renderIdentityChips.
  function buildSnapshotMetaForDeploy(refresh) {
    const out = {};
    if (cachedAccount?.email) {
      out.account = { email: cachedAccount.email };
    }
    if (refresh?.scope) {
      const orgs = cachedOrgs?.org_candidates || [];
      const findOrg = (id) => orgs.find(o => o.org_id === id);
      const ids = refresh.ids || {};
      let name = '';
      if (refresh.scope === 'all') {
        const count = cachedOrgs?.count ?? orgs.length;
        name = `${count} org${count === 1 ? '' : 's'}`;
      } else if (refresh.scope === 'org') {
        name = findOrg(ids.org_id)?.name || ids.org_id || '?';
      } else if (refresh.scope === 'hv') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      } else if (refresh.scope === 'network') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      }
      if (name) out.scope = { kind: refresh.scope, name, ids };
    }
    return Object.keys(out).length ? out : null;
  }

      conditional.forEach(el => el.style.display = 'none');

  async function openSettingsModal() {
    const t = (currentSpec?.i18n?.settings) || EN_FALLBACK.settings;
    const host = ensureSettingsModal(t);
    host.hidden = false;
    host.querySelector('.db-modal-status').hidden = true;
    host.querySelector('#db-settings-key').value = '';
    host.querySelector('.db-modal-secret-row').classList.remove('invalid');

    // Show currently-active account (from the cached /account fetched on init)
    const currentEl = host.querySelector('#db-settings-current');
    currentEl.textContent = cachedAccount?.email || t.no_account;

    // Sync auto-refresh dropdown with current state (localStorage or in-memory)
    const autoSelect = host.querySelector('#db-settings-auto');
    if (autoSelect) autoSelect.value = String(autoRefreshSeconds || 0);

    // Wire Save (clone-replace to drop any prior handler from earlier open)
    const oldSave = host.querySelector('.db-settings-save');
    const save = oldSave.cloneNode(true);
    oldSave.parentNode.replaceChild(save, oldSave);

    const oldReset = host.querySelector('.db-settings-reset');
    const reset = oldReset.cloneNode(true);
    oldReset.parentNode.replaceChild(reset, oldReset);

    const input = host.querySelector('#db-settings-key');
    const row = host.querySelector('.db-modal-secret-row');
    const status = host.querySelector('.db-modal-status');

    save.addEventListener('click', async () => {
      const key = input.value.trim();
      // Always apply auto-refresh selection on Save (even when API key is empty,
      // user might just be toggling the auto dropdown).
      const autoSelectEl = host.querySelector('#db-settings-auto');
      const autoSeconds = autoSelectEl ? parseInt(autoSelectEl.value, 10) || 0 : 0;
      const autoChanged = autoSeconds !== autoRefreshSeconds;

      // If user didn't enter a key but only changed auto, accept that.
      if (!key) {
        if (autoChanged) {
          applyAutoRefresh(autoSeconds);
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-success';
          status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)}`;
          setTimeout(() => { host.hidden = true; }, 800);
        } else {
          // Nothing to do — close
          host.hidden = true;
        }
        return;
      }

      // Client-side shape check first to avoid noisy server round-trip
      if (!/^[A-Za-z0-9+/=_-]{8,200}$/.test(key)) {
        row.classList.add('invalid');
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = t.invalid;
        return;
      }
      row.classList.remove('invalid');
      save.disabled = true;
      save.classList.add('spinning');
      status.hidden = false;
      status.className = 'db-modal-status db-modal-status-info';
      status.innerHTML = `<span class="ic spin">↻</span> ${escapeHtml(t.saving)}`;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: key }),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = `${t.api_error}: ${payload.error || r.statusText}`;
          save.disabled = false;
          save.classList.remove('spinning');
          return;
        }
        status.className = 'db-modal-status db-modal-status-success';
        status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)} · ${escapeHtml(payload.email || '')}`;
        // Bust caches and reload chips so the header reflects the swap
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        // Also apply auto-refresh selection if it changed
        if (autoChanged) applyAutoRefresh(autoSeconds);
        save.classList.remove('spinning');
        setTimeout(() => { host.hidden = true; }, 1200);
      } catch (e) {
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = `${t.api_error}: ${e.message}`;
        save.disabled = false;
        save.classList.remove('spinning');
      }
    });

    reset.addEventListener('click', async () => {
      reset.disabled = true;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = err.error || r.statusText;
          reset.disabled = false;
          return;
        }
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-success';
        status.textContent = t.reset_done;
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        setTimeout(() => { host.hidden = true; reset.disabled = false; }, 1200);
      } catch (e) {
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = e.message;
        reset.disabled = false;
      }
    });
  }

      if (!PROJECT_NAME_RE.test(nameInput.value) || nameInput.value.length === 0) {
        nameInput.classList.add('invalid');
        if (help) help.textContent = t.url_invalid;
      } else {
        nameInput.classList.remove('invalid');
        if (help) help.textContent = t.url_help;
      }
    };

    // GH Pages fields — repo dropdown + path slug + URL preview. Repo list
    // is fetched lazily when the target radio first switches to gh-pages.
    const repoInput = host.querySelector('#db-modal-gh-repo');
    const pathInput = host.querySelector('#db-modal-gh-path');
    const repoHelpEl = host.querySelector('#db-modal-gh-repo-help');
    const ghPreview = {
      owner: host.querySelector('[data-bind="gh-owner"]'),
      name:  host.querySelector('[data-bind="gh-name"]'),
      path:  host.querySelector('[data-bind="gh-path"]'),
    };
    const updateGhPreview = () => {
      const repo = repoInput.value.trim();
      const [owner, name] = repo.split('/');
      ghPreview.owner.textContent = owner || 'owner';
      ghPreview.name.textContent = name || 'repo';
      ghPreview.path.textContent = (pathInput.value.trim() || 'path');
    };
    // Default path slug = same auto-derived value as Vercel
    pathInput.value = deriveDefaultProjectName(canvasDir);
    repoInput.value = '';  // user picks each time
    repoInput.oninput = updateGhPreview;
    pathInput.oninput = () => {
      // Sanitize path slug like vercel but allow dot + underscore too
      const cleaned = String(pathInput.value || '').replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 100);
      if (cleaned !== pathInput.value) pathInput.value = cleaned;
      updateGhPreview();
    };
    updateGhPreview();

    // Target radio · switches visible sections + ETA + button state
    const ghRepoListLoaded = { done: false };
    async function loadRepoListOnce() {
      if (ghRepoListLoaded.done) return;
      ghRepoListLoaded.done = true;
      repoHelpEl.textContent = t.repo_loading;
      try {
        const r = await fetch('/gh/repos');
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          repoHelpEl.textContent = `${t.repo_no_gh}: ${err.error || r.statusText}`;
          return;
        }
        const { repos = [] } = await r.json();
        const datalist = host.querySelector('#db-modal-gh-repos');
        datalist.innerHTML = repos
          .map(r => `<option value="${escapeHtml(r.nameWithOwner)}"></option>`)
          .join('');
        repoHelpEl.textContent = t.repo_help;
      } catch (e) {
        repoHelpEl.textContent = `${t.repo_no_gh}: ${e.message}`;
      }
    }
    const targetRadios = host.querySelectorAll('input[name="db-modal-target"]');
    const etaEl = host.querySelector('#db-modal-eta');
    function applyTarget(target) {
      host.querySelectorAll('[data-show-target]').forEach(el => {
        el.hidden = el.dataset.showTarget !== target;
      });
      etaEl.textContent = target === 'gh-pages' ? t.eta_ghpages : t.eta_vercel;
      if (target === 'gh-pages') loadRepoListOnce();
    }
    targetRadios.forEach(r => r.onchange = () => applyTarget(r.value));
    applyTarget('vercel');  // default

    // Live toggle: reset each open. Disable when the canvas has no refresh
    // scope (nothing for the function to re-fetch).
    const liveToggle = host.querySelector('#db-modal-live');
    if (liveToggle) {
      const canLive = !!currentSpec?.refresh?.scope;
      liveToggle.checked = false;
      liveToggle.disabled = !canLive;
      const liveSection = liveToggle.closest('.db-modal-live');
      if (liveSection) liveSection.style.opacity = canLive ? '' : '0.5';
    }

    // Clone-replace the Deploy button FIRST to drop any click handler from a
    // previous open. Order matters: setModalScan() binds `ack.onchange` to
    // toggle this button's `.disabled`, so the bound reference must be the
    // node that's currently in the DOM. Cloning AFTER setModalScan strands
    // the binding on a detached node and leaves the visible button frozen
    // as disabled. See PR #43 follow-up.
    const oldGo = host.querySelector('.db-modal-go');
    const go = oldGo.cloneNode(true);
    oldGo.parentNode.replaceChild(go, oldGo);

    // Fetch identifier scan
    try {
      const r = await fetch('/deploy/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ canvas_dir: canvasDir }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(err.error || r.statusText)}`, 'error');
        return;
      }
      const payload = await r.json();
      setModalScan(host, payload, t);
    } catch (e) {
      setModalStatus(host, t.network_err, 'error');
      return;
    }

    go.addEventListener('click', async () => {
      const target = host.querySelector('input[name="db-modal-target"]:checked')?.value || 'vercel';
      const liveOn = target === 'vercel' && !!host.querySelector('#db-modal-live')?.checked;
      const body = {
        canvas_dir: canvasDir,
        target,
        mode: liveOn ? 'live' : 'snapshot',
        snapshot_meta: buildSnapshotMetaForDeploy(currentSpec?.refresh),
      };
      if (liveOn) {
        // Live mode re-fetches real data on the deployed page; it never
        // redacts, and it needs the refresh scope/ids to know what to fetch.
        if (!currentSpec?.refresh?.scope) {
          setModalStatus(host, t.live_needs_scope || 'Live mode needs a refresh scope on this canvas.', 'error');
          return;
        }
        body.refresh = currentSpec.refresh;
        body.redact = false;
      } else {
        // Read purpose radio for redact decision. If no radio exists (no
        // identifiers found) → no redact needed.
        const purposeEl = host.querySelector('input[name="db-modal-purpose"]:checked');
        body.redact = purposeEl?.value === 'share';
      }

      if (target === 'vercel') {
        // Vercel: trim trailing dashes only at submit (mid-edit would block
        // the user from typing "abc-def").
        const finalName = sanitizeProjectName(nameInput.value, { trimEdges: true });
        nameInput.value = finalName;
        if (!PROJECT_NAME_RE.test(finalName)) {
          nameInput.classList.add('invalid');
          nameInput.focus();
          return;
        }
        body.project_name = finalName;
      } else {
        // gh-pages: validate repo (owner/name) + path slug
        const repo = repoInput.value.trim();
        const path = pathInput.value.trim();
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\/[A-Za-z0-9._-]{1,100}$/.test(repo)) {
          repoInput.classList.add('invalid');
          repoHelpEl.textContent = t.repo_invalid;
          repoInput.focus();
          return;
        }
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,98}$/.test(path)) {
          pathInput.classList.add('invalid');
          pathInput.focus();
          return;
        }
        repoInput.classList.remove('invalid');
        pathInput.classList.remove('invalid');
        body.github_repo = repo;
        body.github_path = path;
      }

      go.disabled = true;
      go.classList.add('spinning');
      setModalStatus(host, `<span class="ic spin">↻</span> ${escapeHtml(t.deploying)}`, 'info');
      try {
        const r = await fetch('/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(payload.error || r.statusText)}`, 'error');
          go.disabled = false;
          go.classList.remove('spinning');
          return;
        }
        setModalStatus(host, `
          <div class="db-modal-success">
            <strong>${escapeHtml(t.deployed)}</strong>
            <a href="${escapeHtml(payload.url)}" target="_blank" rel="noopener">${escapeHtml(payload.url)}</a>
            <button type="button" class="btn db-modal-copy" data-url="${escapeHtml(payload.url)}">${escapeHtml(t.copy)}</button>
          </div>
        `, 'success');
        const copyBtn = host.querySelector('.db-modal-copy');
        copyBtn?.addEventListener('click', () => {
          navigator.clipboard.writeText(payload.url).then(() => {
            copyBtn.textContent = t.copied;
            setTimeout(() => copyBtn.textContent = t.copy, 1500);
          });
        });
        go.classList.remove('spinning');
        // Leave Deploy button disabled — this canvas is now deployed.
      } catch (e) {
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(e.message)}`, 'error');
        go.disabled = false;
        go.classList.remove('spinning');
      }
    });
  }

  // ---------- Auto-refresh state machine ----------
  // Reads localStorage on init, dropdown in Settings modal writes back.
  // setTimeout-based scheduling so we can cleanly reset "next at" when manual
  // Refresh fires mid-cycle (vs setInterval which doesn't expose elapsed time).
  function autoRefreshStorageKey() {
    return `db-auto-refresh-${deriveCanvasDir() || 'unknown'}`;
  }
  function cancelAutoRefresh() {
    if (autoRefreshTimer) { clearTimeout(autoRefreshTimer); autoRefreshTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }
  function hideAutoStateEl() {
    const el = document.getElementById('db-auto-state');
    if (el) { el.hidden = true; el.className = 'db-auto-state'; el.textContent = ''; }
  }
  function showCountdownPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    if (document.hidden) return;  // don't render countdown while tab hidden
    const remaining = Math.max(0, nextRefreshAt - Date.now());
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    const time = `${m}:${String(s).padStart(2, '0')}`;
    const template = ((t().status || {}).next_in) || 'next: {time}';
    el.hidden = false;
    el.className = 'db-auto-state countdown';
    el.textContent = template.replace('{time}', time);
  }
  function showAutoPausedPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    const template = ((t().status || {}).auto_paused) || '⚠ auto paused ({n} errors)';
    el.hidden = false;
    el.className = 'db-auto-state paused';
    el.innerHTML =
      `${template.replace('{n}', autoRefreshFailCount).replace(/</g,'&lt;')}` +
      ` <button class="db-auto-state-close" type="button" aria-label="dismiss">✕</button>`;
    el.querySelector('.db-auto-state-close')?.addEventListener('click', hideAutoStateEl);
  }
  function scheduleNextAutoRefresh() {
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    const delay = Math.max(0, nextRefreshAt - Date.now());
    autoRefreshTimer = setTimeout(async () => {
      // Skip if tab hidden — visibilitychange will reschedule on resume.
      if (document.hidden) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      if (!runRefreshFn) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      try {
        const ok = await runRefreshFn();
        if (ok) {
          autoRefreshFailCount = 0;
        } else {
          autoRefreshFailCount++;
        }
      } catch (e) {
        console.warn('Auto-refresh error', e);
        autoRefreshFailCount++;
      }
      if (autoRefreshFailCount >= 3) {
        autoRefreshPaused = true;
        cancelAutoRefresh();
        showAutoPausedPill();
        return;
      }
      nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
      scheduleNextAutoRefresh();
    }, delay);
  }
  function applyAutoRefresh(seconds) {
    cancelAutoRefresh();
    autoRefreshSeconds = seconds | 0;
    autoRefreshFailCount = 0;
    autoRefreshPaused = false;
    try { localStorage.setItem(autoRefreshStorageKey(), String(autoRefreshSeconds)); } catch {}
    if (!autoRefreshSeconds || snapshotMeta) {
      hideAutoStateEl();
      return;
    }
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    countdownTimer = setInterval(showCountdownPill, 1000);
    scheduleNextAutoRefresh();
  }
  function resetAutoRefreshTimer() {
    // Called when manual Refresh fires — pushes next auto-refresh from now.
    if (!autoRefreshSeconds || autoRefreshPaused) return;
    autoRefreshFailCount = 0;
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    scheduleNextAutoRefresh();
  }
  function loadAutoRefreshSetting() {
    try {
      const v = parseInt(localStorage.getItem(autoRefreshStorageKey()) || '0', 10);
      if ([300, 600, 900].includes(v)) return v;
    } catch {}
    return 0;
  }

  async function init(spec) {
    currentSpec = spec;  // captured for i18n lookup (Deploy / Settings / status / widgets)
    ctx.i18n = (spec && spec.i18n) || {};  // expose to widgets via ctx.i18n.<namespace>.<key>
    // Guard: Chrome's file:// security policy blocks fetch() of live-data/*.json.
    // Show friendly instructions instead of an empty 0-filled dashboard.
    if (window.location.protocol === 'file:') {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;inset:0;background:#fef3c7;color:#92400e;padding:40px;font:14px/1.6 system-ui,sans-serif;z-index:99999;overflow:auto;';
      banner.innerHTML = '<h1 style="margin:0 0 16px 0;font-size:20px;">⚠️ Dashboard needs to be served over HTTP</h1>' +
        '<p style="margin:0 0 12px 0;">You opened this file with <code>file://</code> protocol. Chrome blocks <code>fetch()</code> for security, so the dashboard cannot load <code>live-data/*.json</code> and all values appear as 0.</p>' +
        '<p style="margin:0 0 8px 0;font-weight:600;">Fix · run a local HTTP server from the repo root:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0 0 16px 0;font:13px ui-monospace,Menlo,monospace;">bash scripts/serve.sh</pre>' +
        '<p style="margin:0 0 8px 0;">Then open this canvas via:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0;font:13px ui-monospace,Menlo,monospace;">http://localhost:8765/' + window.location.pathname.split('/').slice(-2).join('/') + '</pre>';
      document.body.prepend(banner);
      return;
    }

    // Deployment mode detection. A deployed canvas is either a frozen Snapshot
    // or a refreshable Live copy (mutually exclusive). Prefer the inline marker
    // (window.__DB_DEPLOY_META, baked into the HTML at deploy time) — it's
    // synchronous and survives auth proxies / path quirks that can break a
    // _live.json/_snapshot.json sub-resource fetch. Fall back to the fetch for
    // older deployed copies that predate the inline marker.
    const inlineMeta = (() => { try { return window.__DB_DEPLOY_META || null; } catch (_) { return null; } })();
    if (inlineMeta && inlineMeta.mode === 'live') {
      liveMeta = inlineMeta;
    } else if (inlineMeta && inlineMeta.mode === 'snapshot') {
      snapshotMeta = inlineMeta;
    } else {
      liveMeta = await detectLiveMode();
      if (!liveMeta) snapshotMeta = await detectSnapshotMode();
    }
    if (liveMeta) applyLiveMode(liveMeta);
    else if (snapshotMeta) applySnapshotMode(snapshotMeta);

    // Identity chips · Account (who's the API_KEY?) + Scope (what is in view).
    // Fire-and-forget; failure leaves chips hidden. Fetches in parallel.
    renderIdentityChips(spec.refresh).catch(e => console.warn('identity chips:', e));

    liveData = spec.live_data || {};
    // Wire each section
    for (const section of spec.sections) {
      // raw_html sections are static; no widget lifecycle needed.
      if (section.raw_html !== undefined) continue;
      const factory = widgets.get(section.widget);
      if (!factory) {
        console.error('Unknown widget:', section.widget);
        continue;
      }
      const el = document.querySelector(`[data-widget-id="${section.id || section.widget}"]`);
      if (!el) {
        console.error('Mount point missing for', section.widget, section.id);
        continue;
      }
      const state = {};
      const instance = factory({ el, config: section, bus: { dispatch, on }, state, ctx });
      mounted.push({ name: section.widget, el, config: section, state, instance });
    }

    // ---------- Refresh status banner ----------
    // Visible signal of what /refresh actually did. Three states:
    //   pending  — "↻ refreshing · scope=org · 12s"   (live ticker)
    //   success  — "✓ refreshed · 4 files · 28s"      (auto-fade 10s)
    //   error    — "✗ refresh failed: <msg>"          (sticky · close button)
    // Replaces the old console.error + missing-ctx.toast no-op.
    const statusEl = document.getElementById('db-status');
    let statusTicker = null;
    // setStatus owns transitions BETWEEN states. The pending ticker writes the
    // DOM directly (not via setStatus) so it doesn't keep clearing itself —
    // earlier bug: ticker called setStatus('pending', …) every 1s, which ran
    // clearInterval(statusTicker) and killed the ticker after the first tick.
    function setStatus(kind, html, opts = {}) {
      if (!statusEl) return;
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      statusEl.hidden = false;
      statusEl.className = `db-status db-status-${kind}`;
      statusEl.innerHTML = html;
      if (opts.autoHideMs) {
        setTimeout(() => {
          if (statusEl.classList.contains(`db-status-${kind}`)) statusEl.hidden = true;
        }, opts.autoHideMs);
      }
    }
    function clearStatus() {
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      if (statusEl) statusEl.hidden = true;
    }
    function startStatusTicker(scopeLabel, t0) {
      // Direct DOM mutation each second — bypasses setStatus to avoid
      // self-clearing the interval.
      const ts = (t().status) || {};
      const renderPending = () => {
        if (!statusEl) return;
        const elapsed = Math.floor((Date.now() - t0) / 1000);
        statusEl.hidden = false;
        statusEl.className = 'db-status db-status-pending';
        statusEl.innerHTML = `<span class="ic spin">↻</span> ${ts.refreshing || 'refreshing'} · ${scopeLabel} · ${elapsed}s`;
      };
      renderPending();
      statusTicker = setInterval(renderPending, 1000);
    }

    // Refresh button (skipped in snapshot mode)
    // If spec.refresh is defined, POST /refresh first (server runs the
    // recipe to re-fetch fresh API data into the canvas's live-data folder),
    // then tick() re-loads those JSON files.
    // If spec.refresh is absent, fall back to the old behavior: just re-read
    // existing JSON files (keeps backward compat for canvases that don't
    // declare a refresh scope).
    const refreshConfig = spec.refresh;
    const btn = document.getElementById('db-refresh');

    // The actual refresh routine — used by both manual click and auto-refresh
    // timer. Returns true on success (so auto-refresh fail counter can track).
    // Live mode refresh: POST {scope, ids} to the same-origin serverless
    // function, then render the returned files inline. Returns true on success.
    async function runLiveRefresh(t0) {
      const ts = (t().status) || {};
      const scope = liveMeta.refresh?.scope;
      const scopeLabel = ts[`scope_${scope}`] || `scope=${scope}`;
      startStatusTicker(scopeLabel, t0);
      const r = await fetch('api/refresh', {  // relative → deployed function
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope, ids: liveMeta.refresh?.ids || {} }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const msg = err.error || r.statusText;
        console.error('Live refresh failed:', r.status, msg);
        setStatus('error', `<span class="ic">✗</span> ${(ts.refresh_failed) || 'refresh failed'} · ${String(msg).replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
        statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
        return false;
      }
      const payload = await r.json().catch(() => ({}));
      const files = payload.files || {};
      // Map returned filenames onto the spec's alias→path table, keeping any
      // alias the function didn't return (e.g. a 402-skipped file).
      const next = {};
      for (const [alias, path] of Object.entries(liveData)) {
        const base = String(path).split('/').pop();
        next[alias] = Object.prototype.hasOwnProperty.call(files, base) ? files[base] : dataSnapshot[alias];
      }
      dataSnapshot = next;
      for (const m of mounted) {
        try { m.instance.render(dataSnapshot, ctx); }
        catch (e) { console.error(`[widget ${m.name}] render error`, e); }
      }
      const seconds = Math.max(1, Math.round((Date.now() - t0) / 1000));
      const fileCount = Object.keys(files).length;
      const fileLabel = fileCount === 1 ? (ts.files_one || 'file') : (ts.files_many || 'files');
      setStatus('success',
        `<span class="ic">✓</span> ${ts.refreshed || 'refreshed'} · ${fileCount} ${fileLabel} · ${seconds}s`,
        { autoHideMs: 10000 });
      const stamp = document.getElementById('db-updated');
      if (stamp) {
        const now = new Date();
        stamp.textContent = `updated ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      }
      return true;
    }

    async function runRefresh() {
      let ok = true;
      btn?.classList.add('spinning');
      if (btn) btn.disabled = true;
      const t0 = Date.now();
      try {
        if (liveMeta) {
          // Deployed Live copy: call the serverless function and render the
          // returned data inline (the static *.json can't be rewritten).
          ok = await runLiveRefresh(t0);
          return ok;
        }
        if (refreshConfig?.scope) {
          const baseDir = deriveCanvasDir();
          if (!baseDir) {
            console.warn('Cannot derive canvas output_dir from URL; skipping POST', window.location.pathname);
          } else {
            const ts = (t().status) || {};
            const scopeLabel = ts[`scope_${refreshConfig.scope}`] || `scope=${refreshConfig.scope}`;
            startStatusTicker(scopeLabel, t0);
            const body = {
              scope: refreshConfig.scope,
              ids: refreshConfig.ids || {},
              output_dir: `${baseDir}/live-data`,
            };
            const r = await fetch('/refresh', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              const msg = err.error || r.statusText;
              console.error('Refresh recipe failed:', r.status, msg);
              setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_failed) || 'refresh failed'} · ${msg.replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
              statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
              ok = false;
              return ok;
            }
            const payload = await r.json().catch(() => ({}));
            const seconds = Math.max(1, Math.round((payload.elapsed_ms || 0) / 1000));
            const fileCount = (payload.files_written || []).length;
            const ts2 = (t().status) || {};
            const fileLabel = fileCount === 1 ? (ts2.files_one || 'file') : (ts2.files_many || 'files');
            setStatus('success',
              `<span class="ic">✓</span> ${ts2.refreshed || 'refreshed'} · ${fileCount} ${fileLabel} · ${seconds}s`,
              { autoHideMs: 10000 });
          }
        }
        await tick();
      } catch (e) {
        console.error('Refresh failed (network/other):', e);
        setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_error) || 'refresh error'} · ${String(e.message || e).replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
        statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
        ok = false;
      } finally {
        if (btn) btn.disabled = false;
        setTimeout(() => btn?.classList.remove('spinning'), 400);
      }
      return ok;
    }

    // Expose so auto-refresh state machine + Settings modal can call it.
    runRefreshFn = runRefresh;

    if (btn && !snapshotMeta) btn.addEventListener('click', async () => {
      await runRefresh();
      resetAutoRefreshTimer();  // manual click pushes next auto-fire from now
    });

    // Deploy button (hidden on any deployed copy — can't redeploy from cloud)
    const deployBtn = document.getElementById('db-deploy');
    if (deployBtn && !snapshotMeta && !liveMeta) {
      deployBtn.addEventListener('click', openDeployModal);
    }

    // Settings button (hidden on any deployed copy — can't swap key in cloud)
    const settingsBtn = document.getElementById('db-settings');
    if (settingsBtn) {
      if (snapshotMeta || liveMeta) {
        settingsBtn.style.display = 'none';
      } else {
        settingsBtn.addEventListener('click', openSettingsModal);
      }
    }

    // First tick + poll loop. No polling on a deployed copy: a snapshot is
    // frozen, and a Live copy updates only on explicit Refresh (polling would
    // just re-fetch the static deploy-time files).
    await tick();
    if (!snapshotMeta && !liveMeta) pollHandle = setInterval(tick, 5000);

    // Auto-refresh: read saved preference (off by default), apply if set.
    if (!snapshotMeta && !liveMeta) {
      const savedAuto = loadAutoRefreshSetting();
      if (savedAuto > 0) applyAutoRefresh(savedAuto);
    }

    // Pause / resume countdown + scheduler on tab visibility change.
    document.addEventListener('visibilitychange', () => {
      if (!autoRefreshSeconds || autoRefreshPaused) return;
      if (document.visibilityState === 'visible') {
        // Tab returned to foreground. If we missed the scheduled time, push it
        // out by full interval (don't fire backlog of missed refreshes).
        if (Date.now() >= nextRefreshAt) {
          nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        }
        showCountdownPill();  // resume display immediately
      }
    });
  }

  return { register, init, dispatch, on, ctx };
})();

</script>

<script>
/* === widget alert === */

Dashboard.register('alert', ({ el, config, ctx }) => {
  const tpl = document.getElementById('tpl-alert').content.cloneNode(true);
  const root = tpl.querySelector('.w-alert');
  root.classList.add(`severity-${config.severity || 'info'}`);
  if (config.icon) root.querySelector('.w-alert-icon span').textContent = config.icon;
  root.querySelector('[data-bind="title"]').textContent = config.title || '';
  el.appendChild(tpl);
  const bodyEl = el.querySelector('[data-bind="body"]');

  return {
    render(data) {
      // body text can be:
      //  - static `body`
      //  - dynamic via `body_compute` (named compute function in compute_fns map)
      if (config.body_compute && computeFns[config.body_compute]) {
        bodyEl.textContent = computeFns[config.body_compute](data, config);
      } else if (config.body) {
        bodyEl.textContent = config.body;
      }
    }
  };
});

// Pluggable compute functions. Caller can extend by inlining additional entries
// in the generated HTML BEFORE the runtime init call.
const computeFns = window.computeFns || (window.computeFns = {});
computeFns.license_summary = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const lic = data.licenses?.license_candidates || [];
  const exp = inv.filter(d => d.license_status === 'expired').length;
  const need = Math.max(0, exp - lic.length);
  return `${inv.length} 台設備中有 ${exp} 台 license 已過期；org 內 license pool 還有 ${lic.length} 張可分配。建議:採購 ${need} 張新 license。`;
};

/* === widget checklist === */

Dashboard.register('checklist', ({ el, config, ctx }) => {
  el.classList.add('card');

  const PRI = {
    p1:       { cls: 'p1',       pill: 'crit',  label: '優先 1 · 最高風險' },
    p2:       { cls: 'p2',       pill: 'warn',  label: '優先 2' },
    p3:       { cls: 'p3',       pill: 'warn',  label: '優先 3' },
    optional: { cls: 'optional', pill: 'muted', label: '選配' },
  };
  const PRI_ORDER = { p1: 0, p2: 1, p3: 2, optional: 3 };
  const persistKey = 'checklist:' + (config.persist_key || config.id || 'default');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function loadState() {
    try { return JSON.parse(localStorage.getItem(persistKey)) || {}; } catch (e) { return {}; }
  }
  function saveState(s) {
    try { localStorage.setItem(persistKey, JSON.stringify(s)); } catch (e) {}
  }

  function itemHtml(it) {
    const pri = PRI[it.priority] || PRI.optional;
    const badges = [`<span class="w-cl-pill ${pri.pill}">${esc(pri.label)}</span>`];
    if (it.risk_tier) badges.push(`<span class="w-cl-pill warn">風險分級 ${esc(it.risk_tier)}</span>`);
    if (it.status_label) badges.push(`<span class="w-cl-pill muted">${esc(it.status_label)}</span>`);

    let body = '';
    if (it.path) body += `<div class="w-cl-path">${esc(it.path)}</div>`;
    if (Array.isArray(it.changes) && it.changes.length) {
      const rows = it.changes.map(c =>
        `<tr><td class="item">${esc(c.item)}</td><td>${esc(c.current)}</td><td class="rec">${esc(c.recommended)}</td></tr>`
      ).join('');
      body += `<table class="w-cl-changes"><tr><th>項目</th><th>現況</th><th>建議改成</th></tr>${rows}</table>`;
    }
    if (it.note) {
      const sev = (it.note_severity === 'success' || it.note_severity === 'info') ? it.note_severity : 'warning';
      body += `<div class="w-cl-note ${sev}">${esc(it.note)}</div>`;
    }
    return `
      <div class="w-cl-item ${pri.cls}" data-id="${esc(it.id)}">
        <div class="w-cl-hd">
          <input type="checkbox" class="w-cl-chk" aria-label="完成">
          <h3 class="w-cl-title">${esc(it.title)}</h3>
        </div>
        <div class="w-cl-badges">${badges.join('')}</div>
        ${body ? `<div class="w-cl-body">${body}</div>` : ''}
      </div>`;
  }

  el.innerHTML = `
    <div class="card-hdr"><h2>${esc(config.title || '')}</h2>
      <span class="meta">${esc(config.meta || '')}</span></div>
    <div data-role="body"></div>`;
  const body = el.querySelector('[data-role="body"]');

  function update() {
    const items = [...body.querySelectorAll('.w-cl-item')];
    const done = items.filter(it => it.querySelector('.w-cl-chk').checked).length;
    const total = items.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const ptxt = body.querySelector('[data-role="ptxt"]');
    const ring = body.querySelector('.w-cl-ring');
    const rnum = body.querySelector('[data-role="rnum"]');
    if (ptxt) ptxt.textContent = `${done} / ${total} 項已完成`;
    if (rnum) rnum.textContent = pct + '%';
    if (ring) ring.style.setProperty('--p', pct);
  }

  return {
    render(data) {
      let items;
      if (config.compute && window.computeFns?.[config.compute]) {
        items = window.computeFns[config.compute](data, config);
      } else {
        items = ctx.getByPath(data, config.data_source);
      }
      if (!Array.isArray(items) || !items.length) {
        body.innerHTML = `<div class="empty-state">${esc(config.empty_text || '目前沒有建議項目')}</div>`;
        return;
      }
      items = items.slice().sort((a, b) =>
        (PRI_ORDER[a.priority] ?? 3) - (PRI_ORDER[b.priority] ?? 3));

      const showProgress = config.progress !== false;
      const printable = config.printable !== false;
      const progress = showProgress ? `
        <div class="w-cl-progress">
          <div class="w-cl-ring"><i data-role="rnum">0%</i></div>
          <div class="w-cl-ptxt"><b data-role="ptxt">0 / ${items.length} 項已完成</b>
            ${config.intro ? `<p>${esc(config.intro)}</p>` : ''}</div>
          ${printable ? `<button class="w-cl-print" data-role="print">列印 / 存 PDF</button>` : ''}
        </div>` : '';

      const evidence = config.evidence ? `
        <div class="w-cl-evidence">
          判讀依據：<span class="mono">${esc((config.evidence.ops || []).join(' · '))}</span><br>
          本清單為一次性快照，不會自動更新；修復後請重新讀取設定確認缺口已關閉。
        </div>` : '';

      body.innerHTML = progress + items.map(itemHtml).join('') + evidence;

      // restore + wire interactivity
      const state = loadState();
      body.querySelectorAll('.w-cl-item').forEach(itEl => {
        const id = itEl.dataset.id;
        const chk = itEl.querySelector('.w-cl-chk');
        chk.checked = !!state[id];
        itEl.classList.toggle('done', chk.checked);
        chk.addEventListener('change', () => {
          itEl.classList.toggle('done', chk.checked);
          const s = loadState(); s[id] = chk.checked; saveState(s);
          update();
        });
      });
      const printBtn = body.querySelector('[data-role="print"]');
      if (printBtn) printBtn.addEventListener('click', () => window.print());
      update();
    }
  };
});

</script>

   dashboards don't include any widget that bootstraps it). */
window.computeFns = window.computeFns || {};
