<style>
/* === theme/tokens.css === */
:root {
  /* Surfaces & background — warmer cream to align with marketing site */
  --bg: #fbf8f1;
  --bg-gradient: radial-gradient(at 0% 0%, #f3eee2 0%, #fbf8f1 50%);
  --surface: #ffffff;
  --surface-2: #fbf9f3;
  --hdr-bg: rgba(247, 247, 245, 0.85);   /* sticky frosted header */

  /* Borders */
  --border: rgba(60, 50, 35, 0.10);
  --border-strong: rgba(60, 50, 35, 0.20);

  /* Text */
  --text-1: #1a2332;
  --text-2: #4a5568;
  --text-3: #8b95a4;

  /* Brand — accent orange becomes primary interaction color (EG-aligned) */
  --brand: #ff6b35;
  --brand-2: #c2410c;

  /* Severity */
  --critical: #b91c1c;
  --critical-bg: #fef2f2;
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --success: #047857;
  --success-bg: #ecfdf5;
  --info: #1d4ed8;
  --info-bg: #eff6ff;

  /* Effects — slightly more pronounced shadow + tighter radius */
  --shadow-sm: 0 1px 2px rgba(60,50,35,.05), 0 0 0 1px rgba(60,50,35,.05);
  --shadow-md: 0 6px 18px rgba(60,50,35,.08), 0 2px 4px rgba(60,50,35,.04);
  --radius: 12px;
  --radius-sm: 8px;

  /* Typography */
  --font-sans: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* === theme/base.css === */
/* Base reset + shell layout */

/* ── Type & spacing scale (Comfortable) · see design.md §Typography & Spacing ──
   Single source of truth. Widgets reference these tokens, not hardcoded px,
   so the scale stays consistent across all widgets + light/dark themes. */
:root {
  --fs-micro:  11px;  /* counts, axis ticks, footnotes */
  --fs-label:  12px;  /* UPPERCASE labels, table headers, meta, pills */
  --fs-sub:    13px;  /* secondary / caption / sub-line */
  --fs-body:   15px;  /* table cells, default body text */
  --fs-value:  16px;  /* emphasized values (key_value, etc.) */
  --fs-title:  18px;  /* card / section titles */
  --fs-num-sm: 22px;  /* small stat numbers */
  --fs-num:    28px;  /* KPI numbers */
  --fs-num-xl: 36px;  /* hero KPI numbers */

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 22px;    /* card padding */
  --space-6: 32px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Sticky header — outer container handles sticky + bg, inner constrains width */
.db-hdr {
  position: sticky; top: 0; z-index: 10;
  background: var(--hdr-bg);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.db-hdr-inner {
  max-width: 1320px; margin: 0 auto;
  padding: 18px 32px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px;
}
.db-hdr-left {
  display: flex; align-items: center; gap: 14px;
  min-width: 0;
}
.db-brand-logo {
  width: 57px; height: 57px;
  flex-shrink: 0;
  display: block;
}
.db-hdr-titles { min-width: 0; }
.db-hdr-titles h1 {
  margin: 0; font-size: var(--fs-num-sm); font-weight: 700; letter-spacing: -0.015em;
}
.db-hdr-titles .crumb {
  font-size: var(--fs-sub); color: var(--text-3); margin-top: 3px; font-weight: 500;
}
/* Hide the subtitle row entirely when spec didn't provide one — avoids an
   empty 16px-ish line under the title that makes some canvases look
   bottom-heavy vs others. compose.py always renders the div for layout
   stability; this CSS collapses it when empty. */
.db-hdr-titles .crumb:empty { display: none; }

/* Identity chips · soft-tinted pills in the right header column.
   Account = who (info / blue tint), Scope = what is in view (brand / orange).
   Background uses color-mix to blend the accent into surface — visible but
   not loud enough to compete with severity pills inside the dashboard body. */
.db-chips {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.db-chips[hidden] { display: none; }
.db-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.01em;
  color: var(--text-1); line-height: 1.2;
  white-space: nowrap; max-width: 380px;
  overflow: hidden; text-overflow: ellipsis;
  cursor: default;
}
.db-chip[hidden] { display: none; }
.db-chip .ic { font-size: var(--fs-label); line-height: 1; flex-shrink: 0; opacity: 0.85; }
/* `.lbl` is hidden by default — account chip just shows the email inline.
   Scope chip opts back in with a small uppercase tag (e.g., SCOPE Danny /
   SNAPSHOT 2026-05-19) because the value alone is too ambiguous (a bare
   "Danny" or "5 orgs" doesn't read as "this is the dashboard scope"). */
.db-chip .lbl { display: none; }
.db-chip-scope .lbl {
  display: inline; font-size: var(--fs-micro); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-3); margin-right: 4px;
}
.db-chip-account {
  background: color-mix(in srgb, var(--info) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--info) 22%, var(--border));
}
.db-chip-account .ic { color: var(--info); }
.db-chip-scope {
  background: color-mix(in srgb, var(--brand) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--border));
}
.db-chip-scope .ic { color: var(--brand); }
/* legacy selectors kept for old canvases that haven't been recomposed */
.db-hdr-left h1 { margin: 0; font-size: var(--fs-num-sm); font-weight: 700; letter-spacing: -0.015em; }
.db-hdr-left .crumb { font-size: var(--fs-sub); color: var(--text-3); margin-top: 3px; font-weight: 500; }
/* Right column stacks two rows so the column has visual weight matching
   the left title+subtitle: actions/status on top, identity chips below.
   Each row right-aligns so the visual edge stays clean. */
.db-hdr-right {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 10px; flex-shrink: 0;
}
.db-hdr-right-row {
  display: flex; align-items: center; gap: 14px;
}
.live-dot {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: var(--fs-sub); color: var(--text-2); font-weight: 500;
}
.live-dot::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 0 4px var(--success-bg);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.updated { font-size: var(--fs-sub); color: var(--text-3); font-family: var(--font-mono); }

/* Auto-refresh state · small pill next to Live tag.
   Two modes:
     .countdown — "next: 4:32" while auto is running (text-3 / surface tint)
     .paused    — "⚠ auto paused" after 3 consecutive errors (critical) */
.db-auto-state {
  font-family: var(--font-mono); font-size: var(--fs-label);
  padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.db-auto-state.countdown {
  color: var(--text-3);
  background: color-mix(in srgb, var(--text-3) 8%, var(--surface));
}
.db-auto-state.paused {
  color: var(--critical);
  background: color-mix(in srgb, var(--critical) 10%, var(--surface));
}
.db-auto-state .db-auto-state-close {
  background: transparent; border: 0; padding: 0; margin-left: 4px;
  cursor: pointer; color: inherit; font-size: var(--fs-label); opacity: 0.6;
}
.db-auto-state .db-auto-state-close:hover { opacity: 1; }

/* Refresh status banner — sits between Deploy and Live, showing live recipe
   state (pending ticker / success summary / error with close button). */
.db-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.01em;
  line-height: 1; white-space: nowrap;
  max-width: 360px; overflow: hidden; text-overflow: ellipsis;
}
.db-status[hidden] { display: none; }
.db-status .ic { font-size: var(--fs-sub); line-height: 1; }
.db-status-pending { background: var(--info-bg);     color: var(--info); }
.db-status-success { background: var(--success-bg);  color: var(--success); }
.db-status-error   { background: var(--critical-bg); color: var(--critical); }
.db-status-close {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  font-size: var(--fs-sub); line-height: 1; padding: 0 0 0 6px; opacity: 0.7;
}
.db-status-close:hover { opacity: 1; }

/* Main wrap */
.db-wrap { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--text-1); padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: var(--fs-label); font-weight: 600; cursor: pointer;
  transition: all .15s ease; font-family: inherit;
}
.btn:hover { background: var(--surface-2); border-color: var(--brand); color: var(--brand); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text-1); }
.btn.btn-primary {
  background: var(--brand); color: white; border-color: var(--brand);
}
.btn.btn-primary:hover { background: var(--brand); color: white; border-color: var(--brand); filter: brightness(1.08); }
.btn.btn-primary:disabled:hover { background: var(--brand); color: white; }
.btn.spinning .ic { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ic { display: inline-block; line-height: 1; }
.ic.spin { animation: spin 0.7s linear infinite; }
/* Icon-only button (no label) — gear / cog / similar single-glyph actions */
.btn.db-btn-icon { padding: 6px 9px; }
.btn.db-btn-icon .ic { font-size: var(--fs-body); }

/* Snapshot tag (replaces live-dot when canvas is a deployed snapshot) */
.snapshot-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.02em;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
}

/* Deploy modal */
.db-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 24px;
}
.db-modal-backdrop[hidden] { display: none; }
.db-modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  width: 100%; max-width: 560px; max-height: calc(100vh - 48px);
  overflow: hidden; display: flex; flex-direction: column;
}
.db-modal-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.db-modal-hdr h2 {
  margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.01em;
}
.db-modal-close {
  background: transparent; border: 0; font-size: var(--fs-num-sm); line-height: 1;
  color: var(--text-3); cursor: pointer; padding: 4px 8px; border-radius: 6px;
}
.db-modal-close:hover { color: var(--text-1); background: var(--surface-2); }
.db-modal-body { padding: 18px 22px; overflow-y: auto; font-size: var(--fs-body); }
.db-modal-foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 22px 18px; border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.db-modal-meta {
  display: grid; grid-template-columns: 140px 1fr;
  gap: 6px 12px; margin: 0 0 18px;
  font-size: var(--fs-sub);
}
.db-modal-meta dt { color: var(--text-3); font-weight: 600; }
.db-modal-meta dd { margin: 0; color: var(--text-1); }
.db-modal-pill {
  display: inline-block; margin-left: 6px;
  font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.02em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--info-bg); color: var(--info);
}
.db-modal-section h3 {
  margin: 0 0 8px; font-size: var(--fs-sub); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3);
}

/* Target chooser — Vercel vs GitHub Pages cards at the top of Deploy modal */
.db-modal-targets {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 0 0 18px;
}
.db-modal-target-pick {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.db-modal-target-pick:hover { background: var(--surface-2); }
.db-modal-target-pick:has(input:checked) {
  background: color-mix(in srgb, var(--brand) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--brand) 38%, var(--border));
}
.db-modal-target-pick input[type="radio"] {
  margin-top: 3px; flex-shrink: 0; accent-color: var(--brand);
}
/* Vercel / GitHub brand logos as inline SVG, currentColor so they go orange
   when the card is the active target and stay text-1 otherwise. */
.db-modal-target-logo {
  width: 22px; height: 22px; flex-shrink: 0;
  color: var(--text-1);
  margin-top: 1px;
}
.db-modal-target-pick:has(input:checked) .db-modal-target-logo {
  color: var(--brand);
}
.db-modal-target-body {
  display: flex; flex-direction: column; gap: 3px;
  font-size: var(--fs-sub); line-height: 1.4;
}
.db-modal-target-body strong { color: var(--text-1); font-weight: 600; }
.db-modal-target-sub { color: var(--text-3); font-size: var(--fs-label); }

/* GH Pages live URL preview line — monospace, shows owner/repo/path */
.db-modal-gh-preview {
  font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: var(--fs-label);
  margin-top: 4px;
  color: var(--text-2);
}
.db-modal-gh-preview span[data-bind] {
  color: var(--brand); font-weight: 600;
}

/* Hidden sections (toggled by target radio) */
[data-show-target][hidden] { display: none !important; }

/* Custom URL input: prefix + input + suffix on a single rounded line. The
   input fills the middle, prefix/suffix are inline pseudo-buttons. */
.db-modal-url { margin: 0 0 18px; }
.db-modal-url-label {
  display: block; font-size: var(--fs-sub); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-3); margin-bottom: 8px;
}
.db-modal-url-input {
  display: flex; align-items: stretch;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: var(--fs-sub);
  transition: border-color .15s ease;
}
.db-modal-url-input:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.db-modal-url-input:has(.invalid) { border-color: var(--critical); }
.db-modal-url-prefix,
.db-modal-url-suffix {
  padding: 8px 10px; color: var(--text-3); user-select: none;
  background: var(--surface-2); flex-shrink: 0;
}
.db-modal-url-name {
  flex: 1; min-width: 0;
  border: 0; outline: none;
  background: var(--surface); color: var(--text-1);
  padding: 8px 6px;
  font: inherit;
}
.db-modal-url-name.invalid { background: color-mix(in srgb, var(--critical) 6%, var(--surface)); }
.db-modal-url-help {
  font-size: var(--fs-label); color: var(--text-3); margin-top: 6px; line-height: 1.5;
}

/* Secret input (Settings modal) — masked password-style field with an eye
   icon to toggle reveal. Reuses .db-modal-url-input structure so the visual
   shape matches the deploy URL row right above it in the family. */
.db-modal-secret { margin: 0 0 18px; }
.db-modal-secret-label {
  display: block; font-size: var(--fs-sub); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-3); margin-bottom: 8px;
}
.db-modal-secret-row {
  display: flex; align-items: stretch;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: border-color .15s ease;
}
.db-modal-secret-row:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.db-modal-secret-row.invalid { border-color: var(--critical); }
.db-modal-secret-input {
  flex: 1; min-width: 0;
  border: 0; outline: none;
  background: transparent; color: var(--text-1);
  padding: 9px 12px;
  font: inherit; font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: var(--fs-sub);
  letter-spacing: 0.02em;
}
.db-modal-secret-toggle {
  background: var(--surface-2); border: 0; border-left: 1px solid var(--border);
  padding: 0 14px; cursor: pointer; color: var(--text-2);
  font-size: var(--fs-body); line-height: 1;
}
.db-modal-secret-toggle:hover { color: var(--text-1); background: var(--surface); }
.db-modal-secret-help {
  font-size: var(--fs-label); color: var(--text-3); margin-top: 6px; line-height: 1.5;
}

/* Auto-refresh dropdown · same visual family as .db-modal-secret. */
.db-modal-auto { margin: 0 0 18px; }
.db-modal-auto-select {
  width: 100%; padding: 9px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font: inherit; font-size: var(--fs-sub);
  color: var(--text-1); cursor: pointer;
  transition: border-color .15s ease;
}
.db-modal-auto-select:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}

/* "Currently using: <email>" line inside Settings modal */
.db-modal-current {
  margin: 0 0 14px; padding: 10px 12px;
  background: color-mix(in srgb, var(--info) 6%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--info) 20%, var(--border));
  border-radius: 8px;
  font-size: var(--fs-sub); line-height: 1.5;
  display: flex; align-items: center; gap: 8px;
}
.db-modal-current .ic { font-size: var(--fs-body); color: var(--info); }
.db-modal-current strong { font-weight: 600; }

.db-modal-scan { font-size: var(--fs-sub); line-height: 1.55; }
.db-modal-scan p { margin: 0 0 6px; }
.db-modal-ok { color: var(--success); font-weight: 600; }
.db-modal-scan-list {
  list-style: none; padding: 0; margin: 8px 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px 12px;
}
.db-modal-scan-list li {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 6px 10px; background: var(--surface-2); border-radius: 6px;
  font-size: var(--fs-label);
}
.db-modal-scan-list li strong {
  font-variant-numeric: tabular-nums; color: var(--text-1); font-size: var(--fs-body);
}
.db-modal-hint {
  font-size: var(--fs-label); color: var(--text-3); margin: 8px 0 0 !important;
}
.db-modal-check {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 14px 0 0; font-size: var(--fs-sub); line-height: 1.5;
  padding: 10px 12px; border-radius: 8px; background: var(--surface-2);
  cursor: pointer;
}
.db-modal-check input { margin-top: 3px; flex-shrink: 0; }

/* Purpose radio — two options stacked. The selected one gets a brand tint
   so the user clearly sees which case applies before pressing Deploy. */
.db-modal-radio {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 8px 0 0; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.db-modal-radio:hover { background: var(--surface-2); }
.db-modal-radio:has(input:checked) {
  background: color-mix(in srgb, var(--brand) 5%, var(--surface));
  border-color: color-mix(in srgb, var(--brand) 35%, var(--border));
}
.db-modal-radio input[type="radio"] { margin-top: 3px; flex-shrink: 0; accent-color: var(--brand); }
.db-modal-radio-body {
  display: flex; flex-direction: column; gap: 4px;
  font-size: var(--fs-sub); line-height: 1.5;
}
.db-modal-radio-body strong { color: var(--text-1); font-weight: 600; }
.db-modal-radio-desc { color: var(--text-3); font-size: var(--fs-label); line-height: 1.55; }
.db-modal-status {
  margin-top: 14px; padding: 10px 12px; border-radius: 8px;
  font-size: var(--fs-sub); line-height: 1.5;
}
.db-modal-status[hidden] { display: none; }
.db-modal-status-info { background: var(--info-bg); color: var(--info); }
.db-modal-status-error { background: var(--critical-bg); color: var(--critical); }
.db-modal-status-success { background: var(--success-bg); color: var(--success); }
.db-modal-success { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.db-modal-success a {
  color: inherit; font-family: var(--font-mono); font-size: var(--fs-label);
  text-decoration: underline;
}
.db-modal-success .btn { padding: 4px 10px; font-size: var(--fs-label); }

/* Card surface (shared) */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--space-5) var(--space-6); box-shadow: var(--shadow-sm);
}
.card-hdr {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--space-3); margin-bottom: var(--space-4);
}
.card-hdr h2 {
  margin: 0; font-size: var(--fs-title); font-weight: 700;
  letter-spacing: -0.01em; white-space: nowrap;
}
.card-hdr .meta {
  font-size: var(--fs-label); color: var(--text-3); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.04em; text-align: right;
}

/* Pills (severity) */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-label); font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  line-height: 1; letter-spacing: 0.02em;
}
.pill-crit { background: var(--critical-bg); color: var(--critical); }
.pill-warn { background: var(--warning-bg); color: var(--warning); }
.pill-ok { background: var(--success-bg); color: var(--success); }
.pill-info { background: var(--info-bg); color: var(--info); }
.pill-muted { background: rgba(15,23,42,0.05); color: var(--text-2); }

/* Chip filters */
.chips {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
}
.chip {
  font-size: var(--fs-label); font-weight: 600; padding: 5px 11px;
  border-radius: 999px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); transition: all .15s ease;
  font-family: inherit; letter-spacing: 0.02em;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.active { background: var(--brand); color: white; border-color: var(--brand); }
.chip .count { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: 0.7; font-size: var(--fs-micro); }

/* Flash highlight (for cross-widget navigation) */
.flash {
  animation: flash-glow 1.2s ease-out 2;
  --flash-color: var(--brand);
}
@keyframes flash-glow {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 40%, transparent); }
  50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--brand) 10%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 0%, transparent); }
}

/* Empty state */
.empty-state { text-align: center; padding: 36px 16px; color: var(--text-3); font-size: var(--fs-body); }

/* Footer */
.db-footnote {
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
  font-size: var(--fs-label); color: var(--text-3);
  display: flex; justify-content: space-between; gap: 16px;
}
.db-footnote .skills { font-family: var(--font-mono); }


/* === widget alert === */

.w-alert {
  border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  border: 1px solid; display: flex; align-items: flex-start; gap: 12px;
}
.w-alert.severity-critical { background: var(--critical-bg); border-color: rgba(185,28,28,0.25); color: var(--critical); }
.w-alert.severity-warning { background: var(--warning-bg); border-color: rgba(180,83,9,0.25); color: var(--warning); }
.w-alert.severity-info { background: var(--info-bg); border-color: rgba(29,78,216,0.25); color: var(--info); }
.w-alert.severity-success { background: var(--success-bg); border-color: rgba(4,120,87,0.25); color: var(--success); }
.w-alert-icon {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
  font-weight: 700; display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-body); margin-top: 1px; color: #fff;
}
.w-alert.severity-critical .w-alert-icon { background: var(--critical); }
.w-alert.severity-warning .w-alert-icon { background: var(--warning); }
.w-alert.severity-info .w-alert-icon { background: var(--info); }
.w-alert.severity-success .w-alert-icon { background: var(--success); }
.w-alert-body { flex: 1; }
.w-alert-body strong { font-weight: 700; }
.w-alert-body p { margin: 4px 0 0; font-size: var(--fs-body); color: var(--text-2); }

/* === widget kpi_grid === */

.w-kpi-grid {
  display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 16px;
  margin-bottom: 24px;
}
.w-kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.w-kpi .lbl {
  font-size: var(--fs-label); font-weight: 600; text-transform: uppercase;
  color: var(--text-3); letter-spacing: 0.05em;
}
.w-kpi .val {
  font-size: var(--fs-num-xl); font-weight: 700; margin: 4px 0 0;
  letter-spacing: -0.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.w-kpi .sub { font-size: var(--fs-sub); color: var(--text-2); margin-top: 2px; }
.w-kpi.severity-critical { border-color: rgba(185,28,28,0.2); background: linear-gradient(180deg, var(--critical-bg) 0%, var(--surface) 30%); }
.w-kpi.severity-critical .val { color: var(--critical); }
.w-kpi.severity-warning { border-color: rgba(180,83,9,0.2); }
.w-kpi.severity-warning .val { color: var(--warning); }
.w-kpi.clickable { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.w-kpi.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.w-kpi.clickable::after {
  content: '↗'; position: absolute; top: 12px; right: 14px;
  color: var(--text-3); font-size: var(--fs-body); opacity: 0;
  transition: opacity .15s ease;
}
.w-kpi.clickable:hover::after { opacity: 1; }

/* === widget bar_list === */

.w-barlist { font-size: var(--fs-body); }
.w-barlist .bar-row { display: flex; align-items: center; gap: 14px; margin-bottom: 11px; padding: 4px 10px; margin-left: -10px; border-radius: 6px; max-width: 600px; }
.w-barlist .bar-row.clickable { cursor: pointer; transition: background .15s ease; }
.w-barlist .bar-row.clickable:hover { background: var(--surface-2); }
.w-barlist .bar-row.clickable:hover .bar-fill { filter: brightness(1.08); }
.w-barlist .bar-label { width: 148px; color: var(--text-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-barlist .bar-track { flex: 1; height: 8px; background: rgba(15,23,42,0.05); border-radius: 4px; overflow: hidden; }
.w-barlist .bar-fill { height: 100%; border-radius: 4px; background: color-mix(in srgb, var(--brand) 60%, white); transition: width 0.6s ease, filter .15s ease; }
.w-barlist .bar-fill.crit { background: var(--critical); }
.w-barlist .bar-fill.warn { background: var(--warning); }
.w-barlist .bar-fill.ok { background: var(--success); }
.w-barlist .bar-val { width: 54px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--fs-body); }
.w-barlist .group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }

/* === widget table === */

.w-table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
/* Pack columns left: the last column absorbs slack so the others shrink to
   content. Without this a 2-3 column table spreads columns evenly → content
   clusters in the middle with big empty gutters. */
.w-table th:last-child, .w-table td:last-child { width: 100%; }
/* even_columns: opt-out of pack-left for many-column tables (5+). Undo the
   last-column-absorbs-slack so width:100% auto-layout spreads all columns to
   fill the container instead of leaving one over-wide trailing column. */
.w-table.even-cols th:last-child, .w-table.even-cols td:last-child { width: auto; }
/* headers + non-last cells stay single-line (short labels/values); only the
   greedy last column wraps. Stops "5 GHz · UNII-1" wrapping per word. */
.w-table th, .w-table td:not(:last-child) { white-space: nowrap; }
.w-table th {
  text-align: left; font-weight: 600; color: var(--text-3);
  font-size: var(--fs-label); text-transform: uppercase; letter-spacing: 0.05em;
  padding: 8px 10px 10px; border-bottom: 1px solid var(--border);
}
/* First/last cells flush with the card's content box, so table rows line up
   with the card title and with other widgets (e.g. key_value) — no extra indent. */
.w-table th:first-child, .w-table td:first-child { padding-left: 0; }
.w-table th:last-child, .w-table td:last-child { padding-right: 0; }
.w-table td {
  padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.w-table tr:last-child td { border-bottom: 0; }
.w-table tbody tr:hover td { background: var(--surface-2); }
.w-table td.num, .w-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.w-table tr.expandable { cursor: pointer; }
.w-table tr.expandable td:first-child::before {
  content: '▸'; display: inline-block; margin-right: 6px;
  color: var(--text-3); font-size: var(--fs-micro); transition: transform .15s ease;
}
.w-table tr.expandable.open td:first-child::before { transform: rotate(90deg); }
.w-table tr.detail { display: none; background: var(--surface-2); }
.w-table tr.detail.open { display: table-row; }
.w-table tr.row-muted td { opacity: 0.45; }
.w-table tr.detail td { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.w-table .detail-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 24px;
}
.w-table .detail-item .k {
  font-size: var(--fs-label); color: var(--text-3); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 2px; font-weight: 600;
}
.w-table .detail-item .v {
  font-size: var(--fs-body); color: var(--text-1); font-family: var(--font-mono); word-break: break-all;
}
.w-table .detail-item .v.large { font-family: var(--font-sans); font-weight: 500; }
.w-table .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.w-table .type-chip {
  display: inline-flex; gap: 6px; align-items: center;
  font-size: var(--fs-label); font-weight: 600; text-transform: uppercase;
  color: var(--text-2); letter-spacing: 0.04em;
}
.w-table .type-chip .dot { width: 8px; height: 8px; border-radius: 2px; }
.w-table .type-ap .dot { background: var(--info); }
.w-table .type-switch .dot { background: var(--warning); }
.w-table .type-gateway .dot { background: var(--success); }

.w-table-search { margin-bottom: 12px; }
.w-table-search input {
  width: 100%; max-width: 360px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-family: inherit; font-size: var(--fs-sub);
  color: var(--text-1);
}
.w-table-search input::placeholder { color: var(--text-3); }
.w-table-search input:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
}

.w-table-page {
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  margin-top: 14px;
  font-size: var(--fs-sub);
  color: var(--text-2);
}
.w-table-page button {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-family: inherit; font-size: var(--fs-label); font-weight: 500;
  cursor: pointer;
  transition: all .15s ease;
}
.w-table-page button:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--brand);
  color: var(--brand);
}

<script>
// Dashboard runtime: polls live-data, dispatches to widgets, exposes event bus.
// Widgets self-register via Dashboard.register('<name>', {init, render}).
//
// Each widget receives in init({el, config, bus, state}) and render(data, ctx).
// `data` is a map of alias → JSON. `ctx` exposes helpers (flash, scrollTo, etc).

window.Dashboard = (() => {
  const widgets = new Map(); // name → factory
  const mounted = [];         // [{name, el, config, state, instance}]
  const bus = new EventTarget();
  let currentSpec = null;     // the spec passed to Dashboard.init — used by modal i18n lookup
  let cachedAccount = null;   // /account response, cached after first fetch
  let cachedOrgs = null;      // /user-orgs response, cached after first fetch
  let liveData = {};          // alias → relative path
  let dataSnapshot = {};      // alias → parsed JSON
  let pollHandle = null;
  let snapshotMeta = null;    // truthy when canvas is a deployed (frozen) snapshot
  let liveMeta = null;        // truthy when canvas is a deployed Live copy (refresh via /api/refresh)

  // Auto-refresh state — opt-in via Settings modal, persisted per-canvas in
  // localStorage. setTimeout-based (not setInterval) so manual Refresh can
  // cleanly reset "next at" without doubled fires. See applyAutoRefresh().
  let autoRefreshSeconds = 0;     // 0 = off
  let autoRefreshTimer = null;    // setTimeout handle
  let countdownTimer = null;      // 1s setInterval for UI ticker
  let nextRefreshAt = 0;          // ms timestamp
  let autoRefreshFailCount = 0;
  let autoRefreshPaused = false;
  let runRefreshFn = null;        // bound in init() so Settings save can re-trigger

  function register(name, factory) {
    widgets.set(name, factory);
  }

  function dispatch(type, detail) {
    bus.dispatchEvent(new CustomEvent(type, { detail }));
  }

  function on(type, handler) {
    bus.addEventListener(type, handler);
  }

  // Helpers for widgets
  const ctx = {
    flash(el) {
      if (!el) return;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    },
    scrollToWidget(id, opts = {}) {
      const target = document.querySelector(`[data-widget-id="${id}"]`);
      if (target) {
        target.scrollIntoView({behavior:'smooth', block: opts.block || 'start'});
        setTimeout(() => ctx.flash(target), 300);
      }
    },
    fmtDate(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().split('T')[0];
    },
    fmtDateTime(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().replace('T',' ').slice(0,16);
    },
    daysSince(ms) {
      if (!ms) return Infinity;
      return Math.floor((Date.now() - ms) / 86400000);
    },
    getByPath(obj, path) {
      if (!path) return obj;
      // Support: foo.bar.baz, foo.bar.length, foo[0].bar, foo.bar[2]
      // Tokenize by . and [n] (where n is integer)
      const tokens = [];
      path.split('.').forEach(seg => {
        const m = seg.match(/^([^\[]*)((?:\[\d+\])*)$/);
        if (!m) return;
        if (m[1]) tokens.push(m[1]);
        const idxRe = /\[(\d+)\]/g;
        let im;
        while ((im = idxRe.exec(m[2])) !== null) tokens.push(parseInt(im[1], 10));
      });
      return tokens.reduce((o, k) => {
        if (o == null) return undefined;
        if (k === 'length' && Array.isArray(o)) return o.length;
        return o[k];
      }, obj);
    },
  };

  async function fetchAll() {
    const out = {};
    for (const [alias, path] of Object.entries(liveData)) {
      try {
        const r = await fetch(path, { cache: 'no-store' });
        out[alias] = await r.json();
      } catch (e) {
        console.warn('fetch fail', path, e);
        out[alias] = null;
      }
    }
    dataSnapshot = out;
    return out;
  }

  async function tick() {
    await fetchAll();
    for (const m of mounted) {
      try {
        m.instance.render(dataSnapshot, ctx);
      } catch (e) {
        console.error(`[widget ${m.name}] render error`, e);
      }
    }
    // Update header timestamp (skipped in snapshot mode — handled by applySnapshotMode)
    if (snapshotMeta) return;
    const t = new Date();
    const stamp = document.getElementById('db-updated');
    if (stamp) {
      stamp.textContent = `updated ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    }
  }

  // ---------- Snapshot mode ----------
  // A canvas deployed via /deploy ships a _snapshot.json marker. When present
  // we know we're rendering a frozen public copy (e.g. on Vercel) where the
  // /refresh and /deploy endpoints don't exist — hide those buttons and the
  // "Live" indicator and surface the deployed_at timestamp instead.
  async function detectSnapshotMode() {
    try {
      const r = await fetch('_snapshot.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  function applySnapshotMode(meta) {
    const refresh = document.getElementById('db-refresh');
    const deploy = document.getElementById('db-deploy');
    const liveDot = document.getElementById('db-live-dot');
    const updated = document.getElementById('db-updated');
    if (refresh) refresh.style.display = 'none';
    if (deploy) deploy.style.display = 'none';
    if (liveDot) {
      liveDot.classList.remove('live-dot');
      liveDot.classList.add('snapshot-tag');
      liveDot.textContent = meta.redacted ? 'Snapshot · redacted' : 'Snapshot';
    }
    if (updated) {
      const t = new Date(meta.deployed_at);
      updated.textContent = isNaN(t) ? meta.deployed_at : ctx.fmtDateTime(t.getTime());
    }
  }

  // ---------- Live mode ----------
  // A canvas deployed via /deploy mode=live ships a _live.json marker plus an
  // /api/refresh serverless function. Unlike a snapshot it CAN refresh — but
  // the deployed filesystem is read-only, so Refresh calls the function and
  // renders the returned data inline instead of POSTing to the local server.
  // Deploy + Settings are still hidden (a deployed copy can't redeploy or swap
  // keys) and polling is off (data changes only on an explicit Refresh).
  async function detectLiveMode() {
    try {
      const r = await fetch('_live.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  function applyLiveMode(meta) {
    const deploy = document.getElementById('db-deploy');
    const settings = document.getElementById('db-settings');
    const updated = document.getElementById('db-updated');
    if (deploy) deploy.style.display = 'none';
    if (settings) settings.style.display = 'none';
    // Refresh button stays (the whole point of Live mode). Header keeps the
    // green "Live" dot. Seed the timestamp from deploy time until first refresh.
    if (updated && meta.deployed_at) {
      const t = new Date(meta.deployed_at);
      updated.textContent = isNaN(t) ? meta.deployed_at : ctx.fmtDateTime(t.getTime());
    }
  }

  // ---------- Identity chips · Account + Scope ----------
  // serve.py proxies these to api-skills (cached server-side). Snapshot mode
  // can't reach the local endpoints, so it falls back to baked-in info from
  // _snapshot.json (TODO: bake account/scope into snapshot at deploy time).
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function fetchJson(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
    return r.json();
  }

  function fillAccountChip(account) {
    const el = document.getElementById('db-chip-account');
    if (!el || !account) return;
    // Email is the canonical identifier — display names can repeat or be
    // missing. Show email inline; full name lives in the hover tooltip for
    // anyone who wants to confirm who that mailbox belongs to.
    const email = account.email || '';
    if (!email) return;
    const name = [account.given_name, account.family_name]
      .filter(Boolean).join(' ').trim();
    el.innerHTML = `<span class="ic">👤</span>${escapeHtml(email)}`;
    el.hidden = false;
    el.title = name ? `${name} · ${email}` : email;
  }

  function fillScopeChip(refresh, orgsPayload) {
    const el = document.getElementById('db-chip-scope');
    if (!el) return;
    // Deployed copy (snapshot or live): no local API access. Prefer baked-in
    // scope.name persisted into the marker file at deploy time. Snapshot has a
    // dated "Snapshot" fallback; live always bakes scope so it shows the name.
    const dm = snapshotMeta || liveMeta;
    if (dm) {
      const baked = dm.scope;
      if (baked?.name) {
        el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(baked.name)}`;
        el.hidden = false;
        return;
      }
      if (snapshotMeta) {
        const date = (snapshotMeta.deployed_at || '').slice(0, 10);
        const tag = snapshotMeta.redacted ? `${date} · redacted` : date;
        el.innerHTML = `<span class="ic">📷</span><span class="lbl">Snapshot</span>${escapeHtml(tag)}`;
        el.hidden = false;
        return;
      }
      // live without a baked name: fall through to id-based rendering below.
    }
    if (!refresh || !refresh.scope) {
      // No refresh declared and no snapshot — nothing to show.
      return;
    }
    const orgs = orgsPayload?.org_candidates || [];
    const findOrg = (id) => orgs.find(o => o.org_id === id);
    let value = '';
    let tooltip = '';
    const ids = refresh.ids || {};
    if (refresh.scope === 'all') {
      const count = orgsPayload?.count ?? orgs.length;
      value = `${count} org${count === 1 ? '' : 's'}`;
      tooltip = orgs.map(o => o.name).filter(Boolean).join(', ');
    } else if (refresh.scope === 'org') {
      const o = findOrg(ids.org_id);
      value = o?.name || ids.org_id || '?';
      tooltip = ids.org_id || '';
    } else if (refresh.scope === 'hv') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  hv_id: ${ids.hv_id || '?'}`;
    } else if (refresh.scope === 'network') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  network_id: ${ids.network_id || '?'}`;
    } else {
      value = refresh.scope;
    }
    el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(value)}`;
    if (tooltip) el.title = tooltip;
    el.hidden = false;
  }

  async function renderIdentityChips(refresh) {
    const chipsHost = document.getElementById('db-chips');
    if (!chipsHost) return;
    // Always show the chip row container once we try; chips inside reveal as
    // their data arrives, so a 502 on /user-orgs still lets account chip show.
    chipsHost.hidden = false;
    const tasks = [];
    const dm = snapshotMeta || liveMeta;  // deployed copy → baked identity, no live endpoints
    if (!dm) {

  // Vercel project name rules: lowercase alphanumeric + dash, ≤ 100 chars.
  // We normalise as user types: dash-separate invalid chunks, collapse runs.
  // Crucially the edge-dash strip ONLY runs on submit — stripping while the
  // user is mid-edit eats the dash they just typed and prevents them from
  // continuing (e.g. typing "abc-" → field becomes "abc" → can't add "-d").
  const PROJECT_NAME_RE = /^[a-z0-9-]+$/;
  function sanitizeProjectName(raw, { trimEdges = false } = {}) {
    let s = String(raw || '')
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, '-')
      .replace(/-+/g, '-')
      .slice(0, 100);
    if (trimEdges) s = s.replace(/^-+|-+$/g, '');
    return s;

    // canvasDir is dashboard-builder/canvases/<id>/. Use the trailing <id>.

  // Build the identity payload to bake into _snapshot.json so the deployed
  // copy keeps Account + Scope chips populated even without live endpoints.
  // Reads from the in-memory caches populated by renderIdentityChips.
  function buildSnapshotMetaForDeploy(refresh) {
    const out = {};
    if (cachedAccount?.email) {
      out.account = { email: cachedAccount.email };
    }
    if (refresh?.scope) {
      const orgs = cachedOrgs?.org_candidates || [];
      const findOrg = (id) => orgs.find(o => o.org_id === id);
      const ids = refresh.ids || {};
      let name = '';
      if (refresh.scope === 'all') {
        const count = cachedOrgs?.count ?? orgs.length;
        name = `${count} org${count === 1 ? '' : 's'}`;
      } else if (refresh.scope === 'org') {
        name = findOrg(ids.org_id)?.name || ids.org_id || '?';
      } else if (refresh.scope === 'hv') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      } else if (refresh.scope === 'network') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      }
      if (name) out.scope = { kind: refresh.scope, name, ids };
    }
    return Object.keys(out).length ? out : null;
  }
