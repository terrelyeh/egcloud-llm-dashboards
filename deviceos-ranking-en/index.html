  async function openSettingsModal() {
    const t = (currentSpec?.i18n?.settings) || EN_FALLBACK.settings;
    const host = ensureSettingsModal(t);
    host.hidden = false;
    host.querySelector('.db-modal-status').hidden = true;
    host.querySelector('#db-settings-key').value = '';
    host.querySelector('.db-modal-secret-row').classList.remove('invalid');

    // Show currently-active account (from the cached /account fetched on init)
    const currentEl = host.querySelector('#db-settings-current');
    currentEl.textContent = cachedAccount?.email || t.no_account;

    // Sync auto-refresh dropdown with current state (localStorage or in-memory)
    const autoSelect = host.querySelector('#db-settings-auto');
    if (autoSelect) autoSelect.value = String(autoRefreshSeconds || 0);

    // Wire Save (clone-replace to drop any prior handler from earlier open)
    const oldSave = host.querySelector('.db-settings-save');
    const save = oldSave.cloneNode(true);
    oldSave.parentNode.replaceChild(save, oldSave);

    const oldReset = host.querySelector('.db-settings-reset');
    const reset = oldReset.cloneNode(true);
    oldReset.parentNode.replaceChild(reset, oldReset);

    const input = host.querySelector('#db-settings-key');
    const row = host.querySelector('.db-modal-secret-row');
    const status = host.querySelector('.db-modal-status');

    save.addEventListener('click', async () => {
      const key = input.value.trim();
      // Always apply auto-refresh selection on Save (even when API key is empty,
      // user might just be toggling the auto dropdown).
      const autoSelectEl = host.querySelector('#db-settings-auto');
      const autoSeconds = autoSelectEl ? parseInt(autoSelectEl.value, 10) || 0 : 0;
      const autoChanged = autoSeconds !== autoRefreshSeconds;

      // If user didn't enter a key but only changed auto, accept that.
      if (!key) {
        if (autoChanged) {
          applyAutoRefresh(autoSeconds);
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-success';
          status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)}`;
          setTimeout(() => { host.hidden = true; }, 800);
        } else {
          // Nothing to do — close
          host.hidden = true;
        }
        return;
      }

      // Client-side shape check first to avoid noisy server round-trip
      if (!/^[A-Za-z0-9+/=_-]{8,200}$/.test(key)) {
        row.classList.add('invalid');
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = t.invalid;
        return;
      }
      row.classList.remove('invalid');
      save.disabled = true;
      save.classList.add('spinning');
      status.hidden = false;
      status.className = 'db-modal-status db-modal-status-info';
      status.innerHTML = `<span class="ic spin">↻</span> ${escapeHtml(t.saving)}`;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: key }),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = `${t.api_error}: ${payload.error || r.statusText}`;
          save.disabled = false;
          save.classList.remove('spinning');
          return;
        }
        status.className = 'db-modal-status db-modal-status-success';
        status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)} · ${escapeHtml(payload.email || '')}`;
        // Bust caches and reload chips so the header reflects the swap
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        // Also apply auto-refresh selection if it changed
        if (autoChanged) applyAutoRefresh(autoSeconds);
        save.classList.remove('spinning');
        setTimeout(() => { host.hidden = true; }, 1200);
      } catch (e) {
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = `${t.api_error}: ${e.message}`;
        save.disabled = false;
        save.classList.remove('spinning');
      }
    });

    reset.addEventListener('click', async () => {
      reset.disabled = true;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = err.error || r.statusText;
          reset.disabled = false;
          return;
        }
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-success';
        status.textContent = t.reset_done;
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        setTimeout(() => { host.hidden = true; reset.disabled = false; }, 1200);
      } catch (e) {
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = e.message;
        reset.disabled = false;
      }
    });
  }

  async function openDeployModal() {
    const t = (currentSpec?.i18n?.deploy) || EN_FALLBACK.deploy;
    const canvasDir = deriveCanvasDir();
    if (!canvasDir) {
      alert(t.not_a_canvas);
      return;
    }
    const host = ensureModal(t);
    host.hidden = false;
    host.querySelector('.db-modal-status').hidden = true;

    // Reset Vercel URL input each open: clear any previous edit, seed from
    // canvas folder name. User can override before pressing Deploy.
    const nameInput = host.querySelector('#db-modal-name');
    nameInput.value = deriveDefaultProjectName(canvasDir);
    nameInput.classList.remove('invalid');
    nameInput.oninput = () => {
      const cleaned = sanitizeProjectName(nameInput.value);
      if (cleaned !== nameInput.value) nameInput.value = cleaned;
      const help = nameInput.closest('.db-modal-url')?.querySelector('.db-modal-url-help');
      if (!PROJECT_NAME_RE.test(nameInput.value) || nameInput.value.length === 0) {
        nameInput.classList.add('invalid');
        if (help) help.textContent = t.url_invalid;
      } else {
        nameInput.classList.remove('invalid');
        if (help) help.textContent = t.url_help;
      }
    };

    // GH Pages fields — repo dropdown + path slug + URL preview. Repo list
    // is fetched lazily when the target radio first switches to gh-pages.
    const repoInput = host.querySelector('#db-modal-gh-repo');
    const pathInput = host.querySelector('#db-modal-gh-path');
    const repoHelpEl = host.querySelector('#db-modal-gh-repo-help');
    const ghPreview = {
      owner: host.querySelector('[data-bind="gh-owner"]'),
      name:  host.querySelector('[data-bind="gh-name"]'),
      path:  host.querySelector('[data-bind="gh-path"]'),
    };
    const updateGhPreview = () => {
      const repo = repoInput.value.trim();
      const [owner, name] = repo.split('/');
      ghPreview.owner.textContent = owner || 'owner';
      ghPreview.name.textContent = name || 'repo';
      ghPreview.path.textContent = (pathInput.value.trim() || 'path');
    };
    // Default path slug = same auto-derived value as Vercel
    pathInput.value = deriveDefaultProjectName(canvasDir);
    repoInput.value = '';  // user picks each time
    repoInput.oninput = updateGhPreview;
    pathInput.oninput = () => {
      // Sanitize path slug like vercel but allow dot + underscore too
      const cleaned = String(pathInput.value || '').replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 100);
      if (cleaned !== pathInput.value) pathInput.value = cleaned;
      updateGhPreview();
    };
    updateGhPreview();

    // Target radio · switches visible sections + ETA + button state
    const ghRepoListLoaded = { done: false };
    async function loadRepoListOnce() {
      if (ghRepoListLoaded.done) return;
      ghRepoListLoaded.done = true;
      repoHelpEl.textContent = t.repo_loading;
      try {
        const r = await fetch('/gh/repos');
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          repoHelpEl.textContent = `${t.repo_no_gh}: ${err.error || r.statusText}`;
          return;
        }
        const { repos = [] } = await r.json();
        const datalist = host.querySelector('#db-modal-gh-repos');
        datalist.innerHTML = repos
          .map(r => `<option value="${escapeHtml(r.nameWithOwner)}"></option>`)
          .join('');
        repoHelpEl.textContent = t.repo_help;
      } catch (e) {
        repoHelpEl.textContent = `${t.repo_no_gh}: ${e.message}`;
      }
    }
    const targetRadios = host.querySelectorAll('input[name="db-modal-target"]');
    const etaEl = host.querySelector('#db-modal-eta');
    function applyTarget(target) {
      host.querySelectorAll('[data-show-target]').forEach(el => {
        el.hidden = el.dataset.showTarget !== target;
      });
      etaEl.textContent = target === 'gh-pages' ? t.eta_ghpages : t.eta_vercel;
      if (target === 'gh-pages') loadRepoListOnce();
    }
    targetRadios.forEach(r => r.onchange = () => applyTarget(r.value));
    applyTarget('vercel');  // default

    // Live toggle: reset each open. Disable when the canvas has no refresh
    // scope (nothing for the function to re-fetch).
    const liveToggle = host.querySelector('#db-modal-live');
    if (liveToggle) {
      const canLive = !!currentSpec?.refresh?.scope;
      liveToggle.checked = false;
      liveToggle.disabled = !canLive;
      const liveSection = liveToggle.closest('.db-modal-live');
      if (liveSection) liveSection.style.opacity = canLive ? '' : '0.5';
    }

    // Clone-replace the Deploy button FIRST to drop any click handler from a
    // previous open. Order matters: setModalScan() binds `ack.onchange` to
    // toggle this button's `.disabled`, so the bound reference must be the
    // node that's currently in the DOM. Cloning AFTER setModalScan strands
    // the binding on a detached node and leaves the visible button frozen
    // as disabled. See PR #43 follow-up.
    const oldGo = host.querySelector('.db-modal-go');
    const go = oldGo.cloneNode(true);
    oldGo.parentNode.replaceChild(go, oldGo);

    // Fetch identifier scan
    try {
      const r = await fetch('/deploy/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ canvas_dir: canvasDir }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(err.error || r.statusText)}`, 'error');
        return;
      }
      const payload = await r.json();
      setModalScan(host, payload, t);
    } catch (e) {
      setModalStatus(host, t.network_err, 'error');
      return;
    }

    go.addEventListener('click', async () => {
      const target = host.querySelector('input[name="db-modal-target"]:checked')?.value || 'vercel';
      const liveOn = target === 'vercel' && !!host.querySelector('#db-modal-live')?.checked;
      const body = {
        canvas_dir: canvasDir,
        target,
        mode: liveOn ? 'live' : 'snapshot',
        snapshot_meta: buildSnapshotMetaForDeploy(currentSpec?.refresh),
      };
      if (liveOn) {
        // Live mode re-fetches real data on the deployed page; it never
        // redacts, and it needs the refresh scope/ids to know what to fetch.
        if (!currentSpec?.refresh?.scope) {
          setModalStatus(host, t.live_needs_scope || 'Live mode needs a refresh scope on this canvas.', 'error');
          return;
        }
        body.refresh = currentSpec.refresh;
        body.redact = false;
      } else {
        // Read purpose radio for redact decision. If no radio exists (no
        // identifiers found) → no redact needed.
        const purposeEl = host.querySelector('input[name="db-modal-purpose"]:checked');
        body.redact = purposeEl?.value === 'share';
      }

      if (target === 'vercel') {
        // Vercel: trim trailing dashes only at submit (mid-edit would block
        // the user from typing "abc-def").
        const finalName = sanitizeProjectName(nameInput.value, { trimEdges: true });
        nameInput.value = finalName;
        if (!PROJECT_NAME_RE.test(finalName)) {
          nameInput.classList.add('invalid');
          nameInput.focus();
          return;
        }
        body.project_name = finalName;
      } else {
        // gh-pages: validate repo (owner/name) + path slug
        const repo = repoInput.value.trim();
        const path = pathInput.value.trim();
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\/[A-Za-z0-9._-]{1,100}$/.test(repo)) {
          repoInput.classList.add('invalid');
          repoHelpEl.textContent = t.repo_invalid;
          repoInput.focus();
          return;
        }
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,98}$/.test(path)) {
          pathInput.classList.add('invalid');
          pathInput.focus();
          return;
        }
        repoInput.classList.remove('invalid');
        pathInput.classList.remove('invalid');
        body.github_repo = repo;
        body.github_path = path;
      }

      go.disabled = true;
      go.classList.add('spinning');
      setModalStatus(host, `<span class="ic spin">↻</span> ${escapeHtml(t.deploying)}`, 'info');
      try {
        const r = await fetch('/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(payload.error || r.statusText)}`, 'error');
          go.disabled = false;
          go.classList.remove('spinning');
          return;
        }
        setModalStatus(host, `
          <div class="db-modal-success">
            <strong>${escapeHtml(t.deployed)}</strong>
            <a href="${escapeHtml(payload.url)}" target="_blank" rel="noopener">${escapeHtml(payload.url)}</a>
            <button type="button" class="btn db-modal-copy" data-url="${escapeHtml(payload.url)}">${escapeHtml(t.copy)}</button>
          </div>
        `, 'success');
        const copyBtn = host.querySelector('.db-modal-copy');
        copyBtn?.addEventListener('click', () => {
          navigator.clipboard.writeText(payload.url).then(() => {
            copyBtn.textContent = t.copied;
            setTimeout(() => copyBtn.textContent = t.copy, 1500);
          });
        });
        go.classList.remove('spinning');
        // Leave Deploy button disabled — this canvas is now deployed.
      } catch (e) {
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(e.message)}`, 'error');
        go.disabled = false;
        go.classList.remove('spinning');
      }
    });
  }

  // ---------- Auto-refresh state machine ----------
  // Reads localStorage on init, dropdown in Settings modal writes back.
  // setTimeout-based scheduling so we can cleanly reset "next at" when manual
  // Refresh fires mid-cycle (vs setInterval which doesn't expose elapsed time).
  function autoRefreshStorageKey() {
    return `db-auto-refresh-${deriveCanvasDir() || 'unknown'}`;
  }
  function cancelAutoRefresh() {
    if (autoRefreshTimer) { clearTimeout(autoRefreshTimer); autoRefreshTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }
  function hideAutoStateEl() {
    const el = document.getElementById('db-auto-state');
    if (el) { el.hidden = true; el.className = 'db-auto-state'; el.textContent = ''; }
  }
  function showCountdownPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    if (document.hidden) return;  // don't render countdown while tab hidden
    const remaining = Math.max(0, nextRefreshAt - Date.now());
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    const time = `${m}:${String(s).padStart(2, '0')}`;
    const template = ((t().status || {}).next_in) || 'next: {time}';
    el.hidden = false;
    el.className = 'db-auto-state countdown';
    el.textContent = template.replace('{time}', time);
  }
  function showAutoPausedPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    const template = ((t().status || {}).auto_paused) || '⚠ auto paused ({n} errors)';
    el.hidden = false;
    el.className = 'db-auto-state paused';
    el.innerHTML =
      `${template.replace('{n}', autoRefreshFailCount).replace(/</g,'&lt;')}` +
      ` <button class="db-auto-state-close" type="button" aria-label="dismiss">✕</button>`;
    el.querySelector('.db-auto-state-close')?.addEventListener('click', hideAutoStateEl);
  }
  function scheduleNextAutoRefresh() {
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    const delay = Math.max(0, nextRefreshAt - Date.now());
    autoRefreshTimer = setTimeout(async () => {
      // Skip if tab hidden — visibilitychange will reschedule on resume.
      if (document.hidden) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      if (!runRefreshFn) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      try {
        const ok = await runRefreshFn();
        if (ok) {
          autoRefreshFailCount = 0;
        } else {
          autoRefreshFailCount++;
        }
      } catch (e) {
        console.warn('Auto-refresh error', e);
        autoRefreshFailCount++;
      }
      if (autoRefreshFailCount >= 3) {
        autoRefreshPaused = true;
        cancelAutoRefresh();
        showAutoPausedPill();
        return;
      }
      nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
      scheduleNextAutoRefresh();
    }, delay);
  }
  function applyAutoRefresh(seconds) {
    cancelAutoRefresh();
    autoRefreshSeconds = seconds | 0;
    autoRefreshFailCount = 0;
    autoRefreshPaused = false;
    try { localStorage.setItem(autoRefreshStorageKey(), String(autoRefreshSeconds)); } catch {}
    if (!autoRefreshSeconds || snapshotMeta) {
      hideAutoStateEl();
      return;
    }
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    countdownTimer = setInterval(showCountdownPill, 1000);
    scheduleNextAutoRefresh();
  }
  function resetAutoRefreshTimer() {
    // Called when manual Refresh fires — pushes next auto-refresh from now.
    if (!autoRefreshSeconds || autoRefreshPaused) return;
    autoRefreshFailCount = 0;
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    scheduleNextAutoRefresh();
  }
  function loadAutoRefreshSetting() {
    try {
      const v = parseInt(localStorage.getItem(autoRefreshStorageKey()) || '0', 10);
      if ([300, 600, 900].includes(v)) return v;
    } catch {}
    return 0;
  }

  async function init(spec) {
    currentSpec = spec;  // captured for i18n lookup (Deploy / Settings / status / widgets)
    ctx.i18n = (spec && spec.i18n) || {};  // expose to widgets via ctx.i18n.<namespace>.<key>
    // Guard: Chrome's file:// security policy blocks fetch() of live-data/*.json.
    // Show friendly instructions instead of an empty 0-filled dashboard.
    if (window.location.protocol === 'file:') {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;inset:0;background:#fef3c7;color:#92400e;padding:40px;font:14px/1.6 system-ui,sans-serif;z-index:99999;overflow:auto;';
      banner.innerHTML = '<h1 style="margin:0 0 16px 0;font-size:20px;">⚠️ Dashboard needs to be served over HTTP</h1>' +
        '<p style="margin:0 0 12px 0;">You opened this file with <code>file://</code> protocol. Chrome blocks <code>fetch()</code> for security, so the dashboard cannot load <code>live-data/*.json</code> and all values appear as 0.</p>' +
        '<p style="margin:0 0 8px 0;font-weight:600;">Fix · run a local HTTP server from the repo root:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0 0 16px 0;font:13px ui-monospace,Menlo,monospace;">bash scripts/serve.sh</pre>' +
        '<p style="margin:0 0 8px 0;">Then open this canvas via:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0;font:13px ui-monospace,Menlo,monospace;">http://localhost:8765/' + window.location.pathname.split('/').slice(-2).join('/') + '</pre>';
      document.body.prepend(banner);
      return;
    }

    // Deployment mode detection. A deployed canvas is either a frozen Snapshot
    // or a refreshable Live copy (mutually exclusive). Prefer the inline marker
    // (window.__DB_DEPLOY_META, baked into the HTML at deploy time) — it's
    // synchronous and survives auth proxies / path quirks that can break a
    // _live.json/_snapshot.json sub-resource fetch. Fall back to the fetch for
    // older deployed copies that predate the inline marker.
    const inlineMeta = (() => { try { return window.__DB_DEPLOY_META || null; } catch (_) { return null; } })();
    if (inlineMeta && inlineMeta.mode === 'live') {
      liveMeta = inlineMeta;
    } else if (inlineMeta && inlineMeta.mode === 'snapshot') {
      snapshotMeta = inlineMeta;
    } else {
      liveMeta = await detectLiveMode();
      if (!liveMeta) snapshotMeta = await detectSnapshotMode();
    }
    if (liveMeta) applyLiveMode(liveMeta);
    else if (snapshotMeta) applySnapshotMode(snapshotMeta);

    // Identity chips · Account (who's the API_KEY?) + Scope (what is in view).
    // Fire-and-forget; failure leaves chips hidden. Fetches in parallel.
    renderIdentityChips(spec.refresh).catch(e => console.warn('identity chips:', e));

    liveData = spec.live_data || {};
    // Wire each section
    for (const section of spec.sections) {
      // raw_html sections are static; no widget lifecycle needed.
      if (section.raw_html !== undefined) continue;
      const factory = widgets.get(section.widget);
      if (!factory) {
        console.error('Unknown widget:', section.widget);
        continue;
      }
      const el = document.querySelector(`[data-widget-id="${section.id || section.widget}"]`);
      if (!el) {
        console.error('Mount point missing for', section.widget, section.id);
        continue;
      }
      const state = {};
      const instance = factory({ el, config: section, bus: { dispatch, on }, state, ctx });
      mounted.push({ name: section.widget, el, config: section, state, instance });
    }

    // ---------- Refresh status banner ----------
    // Visible signal of what /refresh actually did. Three states:
    //   pending  — "↻ refreshing · scope=org · 12s"   (live ticker)
    //   success  — "✓ refreshed · 4 files · 28s"      (auto-fade 10s)
    //   error    — "✗ refresh failed: <msg>"          (sticky · close button)
    // Replaces the old console.error + missing-ctx.toast no-op.
    const statusEl = document.getElementById('db-status');
    let statusTicker = null;
    // setStatus owns transitions BETWEEN states. The pending ticker writes the
    // DOM directly (not via setStatus) so it doesn't keep clearing itself —
    // earlier bug: ticker called setStatus('pending', …) every 1s, which ran
    // clearInterval(statusTicker) and killed the ticker after the first tick.
    function setStatus(kind, html, opts = {}) {
      if (!statusEl) return;
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      statusEl.hidden = false;
      statusEl.className = `db-status db-status-${kind}`;
      statusEl.innerHTML = html;
      if (opts.autoHideMs) {
        setTimeout(() => {
          if (statusEl.classList.contains(`db-status-${kind}`)) statusEl.hidden = true;
        }, opts.autoHideMs);
      }
    }
    function clearStatus() {
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      if (statusEl) statusEl.hidden = true;
    }
    function startStatusTicker(scopeLabel, t0) {
      // Direct DOM mutation each second — bypasses setStatus to avoid
      // self-clearing the interval.
      const ts = (t().status) || {};
      const renderPending = () => {
        if (!statusEl) return;
        const elapsed = Math.floor((Date.now() - t0) / 1000);
        statusEl.hidden = false;
        statusEl.className = 'db-status db-status-pending';
        statusEl.innerHTML = `<span class="ic spin">↻</span> ${ts.refreshing || 'refreshing'} · ${scopeLabel} · ${elapsed}s`;
      };
      renderPending();
      statusTicker = setInterval(renderPending, 1000);
    }

    // Refresh button (skipped in snapshot mode)
    // If spec.refresh is defined, POST /refresh first (server runs the
    // recipe to re-fetch fresh API data into the canvas's live-data folder),
    // then tick() re-loads those JSON files.
    // If spec.refresh is absent, fall back to the old behavior: just re-read
    // existing JSON files (keeps backward compat for canvases that don't
    // declare a refresh scope).
    const refreshConfig = spec.refresh;
    const btn = document.getElementById('db-refresh');

    // The actual refresh routine — used by both manual click and auto-refresh
    // timer. Returns true on success (so auto-refresh fail counter can track).
    // Live mode refresh: POST {scope, ids} to the same-origin serverless
    // function, then render the returned files inline. Returns true on success.
    async function runLiveRefresh(t0) {
      const ts = (t().status) || {};
      const scope = liveMeta.refresh?.scope;
      const scopeLabel = ts[`scope_${scope}`] || `scope=${scope}`;
      startStatusTicker(scopeLabel, t0);
      const r = await fetch('api/refresh', {  // relative → deployed function
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope, ids: liveMeta.refresh?.ids || {} }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const msg = err.error || r.statusText;
        console.error('Live refresh failed:', r.status, msg);
        setStatus('error', `<span class="ic">✗</span> ${(ts.refresh_failed) || 'refresh failed'} · ${String(msg).replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
        statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
        return false;
      }
      const payload = await r.json().catch(() => ({}));
      const files = payload.files || {};
      // Map returned filenames onto the spec's alias→path table, keeping any
      // alias the function didn't return (e.g. a 402-skipped file).
      const next = {};
      for (const [alias, path] of Object.entries(liveData)) {
        const base = String(path).split('/').pop();
        next[alias] = Object.prototype.hasOwnProperty.call(files, base) ? files[base] : dataSnapshot[alias];
      }
      dataSnapshot = next;
      for (const m of mounted) {
        try { m.instance.render(dataSnapshot, ctx); }
        catch (e) { console.error(`[widget ${m.name}] render error`, e); }
      }
      const seconds = Math.max(1, Math.round((Date.now() - t0) / 1000));
      const fileCount = Object.keys(files).length;
      const fileLabel = fileCount === 1 ? (ts.files_one || 'file') : (ts.files_many || 'files');
      setStatus('success',
        `<span class="ic">✓</span> ${ts.refreshed || 'refreshed'} · ${fileCount} ${fileLabel} · ${seconds}s`,
        { autoHideMs: 10000 });
      const stamp = document.getElementById('db-updated');
      if (stamp) {
        const now = new Date();
        stamp.textContent = `updated ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      }
      return true;
    }

    async function runRefresh() {
      let ok = true;
      btn?.classList.add('spinning');
      if (btn) btn.disabled = true;
      const t0 = Date.now();
      try {
        if (liveMeta) {
          // Deployed Live copy: call the serverless function and render the
          // returned data inline (the static *.json can't be rewritten).
          ok = await runLiveRefresh(t0);
          return ok;
        }
        if (refreshConfig?.scope) {
          const baseDir = deriveCanvasDir();
          if (!baseDir) {
            console.warn('Cannot derive canvas output_dir from URL; skipping POST', window.location.pathname);
          } else {
            const ts = (t().status) || {};
            const scopeLabel = ts[`scope_${refreshConfig.scope}`] || `scope=${refreshConfig.scope}`;
            startStatusTicker(scopeLabel, t0);
            const body = {
              scope: refreshConfig.scope,
              ids: refreshConfig.ids || {},
              output_dir: `${baseDir}/live-data`,
            };
            const r = await fetch('/refresh', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              const msg = err.error || r.statusText;
              console.error('Refresh recipe failed:', r.status, msg);
              setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_failed) || 'refresh failed'} · ${msg.replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
              statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
              ok = false;
              return ok;
            }
            const payload = await r.json().catch(() => ({}));
            const seconds = Math.max(1, Math.round((payload.elapsed_ms || 0) / 1000));
            const fileCount = (payload.files_written || []).length;
            const ts2 = (t().status) || {};
            const fileLabel = fileCount === 1 ? (ts2.files_one || 'file') : (ts2.files_many || 'files');
            setStatus('success',
              `<span class="ic">✓</span> ${ts2.refreshed || 'refreshed'} · ${fileCount} ${fileLabel} · ${seconds}s`,
              { autoHideMs: 10000 });
          }
        }
        await tick();
      } catch (e) {
        console.error('Refresh failed (network/other):', e);
        setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_error) || 'refresh error'} · ${String(e.message || e).replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
        statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
        ok = false;
      } finally {
        if (btn) btn.disabled = false;
        setTimeout(() => btn?.classList.remove('spinning'), 400);
      }
      return ok;
    }

    // Expose so auto-refresh state machine + Settings modal can call it.
    runRefreshFn = runRefresh;

    if (btn && !snapshotMeta) btn.addEventListener('click', async () => {
      await runRefresh();
      resetAutoRefreshTimer();  // manual click pushes next auto-fire from now
    });

    // Deploy button (hidden on any deployed copy — can't redeploy from cloud)
    const deployBtn = document.getElementById('db-deploy');
    if (deployBtn && !snapshotMeta && !liveMeta) {
      deployBtn.addEventListener('click', openDeployModal);
    }

    // Settings button (hidden on any deployed copy — can't swap key in cloud)
    const settingsBtn = document.getElementById('db-settings');
    if (settingsBtn) {
      if (snapshotMeta || liveMeta) {
        settingsBtn.style.display = 'none';
      } else {
        settingsBtn.addEventListener('click', openSettingsModal);
      }
    }

    // First tick + poll loop. No polling on a deployed copy: a snapshot is
    // frozen, and a Live copy updates only on explicit Refresh (polling would
    // just re-fetch the static deploy-time files).
    await tick();
    if (!snapshotMeta && !liveMeta) pollHandle = setInterval(tick, 5000);

    // Auto-refresh: read saved preference (off by default), apply if set.
    if (!snapshotMeta && !liveMeta) {
      const savedAuto = loadAutoRefreshSetting();
      if (savedAuto > 0) applyAutoRefresh(savedAuto);
    }

    // Pause / resume countdown + scheduler on tab visibility change.
    document.addEventListener('visibilitychange', () => {
      if (!autoRefreshSeconds || autoRefreshPaused) return;
      if (document.visibilityState === 'visible') {
        // Tab returned to foreground. If we missed the scheduled time, push it
        // out by full interval (don't fire backlog of missed refreshes).
        if (Date.now() >= nextRefreshAt) {
          nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        }
        showCountdownPill();  // resume display immediately
      }
    });
  }

  return { register, init, dispatch, on, ctx };
})();

</script>

<script>
/* === widget alert === */

Dashboard.register('alert', ({ el, config, ctx }) => {
  const tpl = document.getElementById('tpl-alert').content.cloneNode(true);
  const root = tpl.querySelector('.w-alert');
  root.classList.add(`severity-${config.severity || 'info'}`);
  if (config.icon) root.querySelector('.w-alert-icon span').textContent = config.icon;
  root.querySelector('[data-bind="title"]').textContent = config.title || '';
  el.appendChild(tpl);
  const bodyEl = el.querySelector('[data-bind="body"]');

  return {
    render(data) {
      // body text can be:
      //  - static `body`
      //  - dynamic via `body_compute` (named compute function in compute_fns map)
      if (config.body_compute && computeFns[config.body_compute]) {
        bodyEl.textContent = computeFns[config.body_compute](data, config);
      } else if (config.body) {
        bodyEl.textContent = config.body;
      }
    }
  };
});

// Pluggable compute functions. Caller can extend by inlining additional entries
// in the generated HTML BEFORE the runtime init call.
const computeFns = window.computeFns || (window.computeFns = {});
computeFns.license_summary = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const lic = data.licenses?.license_candidates || [];
  const exp = inv.filter(d => d.license_status === 'expired').length;
  const need = Math.max(0, exp - lic.length);
  return `${inv.length} 台設備中有 ${exp} 台 license 已過期；org 內 license pool 還有 ${lic.length} 張可分配。建議:採購 ${need} 張新 license。`;
};

/* === widget kpi_grid === */

Dashboard.register('kpi_grid', ({ el, config, bus, ctx }) => {
  const items = config.items || [];
  el.classList.add('w-kpi-grid');
  el.style.setProperty('--cols', items.length);

  // build cards
  const cards = items.map((item, idx) => {
    const card = document.createElement('div');
    card.className = 'w-kpi';
    if (item.severity) card.classList.add(`severity-${item.severity}`);
    if (item.clickable) card.classList.add('clickable');
    card.innerHTML = `
      <div class="lbl">${item.label}</div>
      <div class="val num" data-bind="val">—</div>
      <div class="sub" data-bind="sub">—</div>
    `;
    if (item.clickable) {
      card.addEventListener('click', () => {
        bus.dispatch('kpi-click', { item, target: item.clickable.target, action: item.clickable.action });
        if (item.clickable.target) ctx.scrollToWidget(item.clickable.target);
      });
    }
    el.appendChild(card);
    return card;
  });

  return {
    render(data) {
      items.forEach((item, idx) => {
        const card = cards[idx];
        const valEl = card.querySelector('[data-bind="val"]');
        const subEl = card.querySelector('[data-bind="sub"]');
        let val = '—';
        if (item.value_path) {
          const v = ctx.getByPath(data, item.value_path);
          val = v == null ? '—' : v;
        } else if (item.value_compute && computeFns[item.value_compute]) {
          val = computeFns[item.value_compute](data, item);
        }
        valEl.textContent = val;
        let sub = '';
        if (item.sub_compute && computeFns[item.sub_compute]) {
          sub = computeFns[item.sub_compute](data, item);
        } else if (item.sub) {
          sub = item.sub;
        }
        subEl.textContent = sub;
      });
    }
  };
});

// Compute functions for KPIs
const computeFns2 = window.computeFns || (window.computeFns = {});
computeFns2.expired_count = (data) => {
  const inv = data.inventory?.device_candidates || [];
  return inv.filter(d => d.license_status === 'expired').length;
};
computeFns2.active_networks_ratio = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const hv = data.hierarchy?.network_candidates || [];
  const activeIds = new Set(inv.map(d => d.network_id));
  return `${activeIds.size}/${hv.length}`;
};
computeFns2.device_type_breakdown = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const types = inv.reduce((m,d)=>{m[d.type]=(m[d.type]||0)+1;return m;},{});
  return Object.entries(types).map(([t,c]) => `${c} ${t}`).join(' · ');
};
computeFns2.expired_subtext = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const exp = inv.filter(d => d.license_status === 'expired').length;
  if (inv.length === exp && exp > 0) return '全部過期';
  return `${exp}/${inv.length} 過期`;
};
computeFns2.empty_networks_subtext = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const hv = data.hierarchy?.network_candidates || [];
  const activeIds = new Set(inv.map(d => d.network_id));
  return `${hv.length - activeIds.size} 個空的 network`;
};
computeFns2.stale_members_subtext = (data) => {
  const mem = data.memberships?.org_member_candidates || [];
  const stale = mem.filter(m => Dashboard.ctx.daysSince(m.last_login_time) > 365).length;
  return `${stale} 人 1+ 年未登入`;
};

/* === widget bar_list === */

Dashboard.register('bar_list', ({ el, config, bus, ctx }) => {
  el.classList.add('card');
  el.innerHTML = `
    <div class="card-hdr"><h2>${config.title||''}</h2><span class="meta">${config.meta||''}</span></div>
    <div class="w-barlist" data-role="body"></div>
  `;
  const body = el.querySelector('[data-role="body"]');

  // Click handler — for groups configured with click_action
  body.addEventListener('click', (e) => {
    const row = e.target.closest('.bar-row.clickable');
    if (!row) return;
    const target = row.dataset.target;
    const field = row.dataset.filterField;
    const value = row.dataset.label;
    if (!target || !field) return;
    bus.dispatch('bar-list-click', {
      target,
      filter: `${field}:${value}`,
      scroll: row.dataset.scrollToTarget !== 'false'
    });
  });

  return {
    render(data) {
      const groups = config.groups || [];
      body.innerHTML = groups.map((g, gi) => {
        const items = (g.compute && computeFns[g.compute])
          ? computeFns[g.compute](data, g)
          : (g.items || []);
        const total = g.total_compute && computeFns[g.total_compute]
          ? computeFns[g.total_compute](data, g)
          : items.reduce((s,i) => s + (i.value||0), 0);
        const click = g.click_action;
        const clickCls = click ? 'clickable' : '';
        const clickAttrs = click
          ? `data-target="${click.target}" data-filter-field="${click.filter_field}" data-scroll-to-target="${click.scroll_to_target !== false}"`
          : '';
        return `<div class="${gi>0?'group':''}">${items.map(i => {
          const pctNum = total ? (i.value/total*100).toFixed(0) : 0;
          const safeLabel = String(i.label).replace(/"/g,'&quot;');
          const tip = `${safeLabel}: ${i.value}${total ? ` (${pctNum}%)` : ''}`;
          return `<div class="bar-row ${clickCls}" ${clickAttrs} data-label="${safeLabel}" title="${tip}">
            <div class="bar-label">${i.label}</div>
            <div class="bar-track"><div class="bar-fill ${i.color||''}" style="width:${pctNum}%"></div></div>
            <div class="bar-val">${i.value}</div>
          </div>`;
        }).join('')}</div>`;
      }).join('');
    }
  };
});

const computeFns3 = window.computeFns || (window.computeFns = {});
computeFns3.device_type_bars = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const types = inv.reduce((m,d)=>{m[d.type]=(m[d.type]||0)+1;return m;},{});
  const colorMap = { ap: '', switch: 'warn', gateway: 'ok' };
  return Object.entries(types).map(([t,c]) => ({ label: t.toUpperCase(), value: c, color: colorMap[t] }));
};
computeFns3.license_status_bars = (data) => {
  const inv = data.inventory?.device_candidates || [];
  const exp = inv.filter(d => d.license_status === 'expired').length;
  return [
    { label: 'Expired', value: exp, color: 'crit' },
    { label: 'Active', value: inv.length - exp, color: 'ok' },
  ];
};
computeFns3.device_total = (data) => (data.inventory?.device_candidates || []).length;

/* === widget table === */

Dashboard.register('table', ({ el, config, bus, ctx }) => {
  const state = { filter: (config.filters?.[0]?.filter) || 'all', expanded: new Set(), searchQuery: '', page: 1 };
  const pageSize = config.pagination?.page_size || 50;
  const paginationEnabled = !!config.pagination?.enabled;
  // i18n strings from ctx.i18n.table (set up by runtime). Falls back to English literals.
  const ti = (ctx && ctx.i18n && ctx.i18n.table) || {};
  // build skeleton
  el.classList.add('card');
  el.innerHTML = `
    <div class="card-hdr">
      <h2>${config.title || ''}</h2>
      <span class="meta" data-bind="meta">—</span>
    </div>
    ${config.search?.enabled ? `<div class="w-table-search"><input type="search" placeholder="${(config.search.placeholder || ti.search_placeholder || 'Search...').replace(/"/g,'&quot;')}" data-role="search" autocomplete="off"></div>` : ''}
    ${config.filters ? `<div class="chips" data-role="filters">${
      config.filters.map((f,i) => `<span class="chip ${i===0?'active':''}" data-filter="${f.filter}">${f.label} <span class="count" data-count="${f.filter}">0</span></span>`).join('')
    }</div>` : ''}
    <table class="w-table${config.even_columns ? ' even-cols' : ''}">
      <thead><tr>${(config.columns||[]).map(c => `<th class="${c.align==='right'?'num':''}">${c.label}</th>`).join('')}</tr></thead>
      <tbody data-role="body"></tbody>
    </table>
    ${paginationEnabled ? `
    <div class="w-table-page" data-role="pagination" style="display:none">
      <button data-role="first" title="${ti.title_first || 'First page'}">${ti.page_first || '« First'}</button>
      <button data-role="prev" title="${ti.title_prev || 'Previous page'}">${ti.page_prev || '← Prev'}</button>
      <span class="indicator" data-role="page-indicator">—</span>
      <button data-role="next" title="${ti.title_next || 'Next page'}">${ti.page_next || 'Next →'}</button>
      <button data-role="last" title="${ti.title_last || 'Last page'}">${ti.page_last || 'Last »'}</button>
    </div>` : ''}
  `;

  const meta = el.querySelector('[data-bind="meta"]');
  const tbody = el.querySelector('[data-role="body"]');

  // Filter chip events
  el.querySelector('[data-role="filters"]')?.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.filter = chip.dataset.filter;
    state.page = 1;  // reset to first page when filter changes
    el.querySelectorAll('[data-role="filters"] .chip').forEach(c =>
      c.classList.toggle('active', c === chip));
    rerender();
  });

  // Free-text search input
  el.querySelector('[data-role="search"]')?.addEventListener('input', (e) => {
    state.searchQuery = e.target.value.trim().toLowerCase();
    state.page = 1;  // reset to first page when search changes
    rerender();
  });

  // Pagination controls
  el.querySelector('[data-role="first"]')?.addEventListener('click', () => { state.page = 1; rerender(); });
  el.querySelector('[data-role="prev"]')?.addEventListener('click', () => { if (state.page > 1) { state.page--; rerender(); } });
  el.querySelector('[data-role="next"]')?.addEventListener('click', () => { state.page++; rerender(); });
  el.querySelector('[data-role="last"]')?.addEventListener('click', () => { state.page = Number(el.querySelector('[data-role="last"]').dataset.total) || 1; rerender(); });

  // Cross-widget event: bar_list row click → apply filter + scroll/flash
  bus.on('bar-list-click', (e) => {
    if (e.detail.target !== config.id) return;
    state.filter = e.detail.filter;
    state.page = 1;  // reset on cross-widget filter
    // Update chip active state if any chip matches
    el.querySelectorAll('[data-role="filters"] .chip').forEach(c =>
      c.classList.toggle('active', c.dataset.filter === state.filter));
    rerender();
    if (e.detail.scroll) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        ctx.flash(el);
      }, 50);
    }
  });

  // Row expand
  tbody.addEventListener('click', (e) => {
    const row = e.target.closest('tr.expandable');
    if (!row) return;
    const id = row.dataset.rowId;
    if (state.expanded.has(id)) state.expanded.delete(id);
    else state.expanded.add(id);
    rerender();
  });

  // Cross-widget event: expand a specific row + scroll/flash
  bus.on('table-expand-row', (e) => {
    if (e.detail.tableId !== config.id) return;
    state.expanded.add(e.detail.rowId);
    // reset filter to 'all' so the row is visible
    state.filter = (config.filters?.[0]?.filter) || 'all';
    el.querySelectorAll('[data-role="filters"] .chip').forEach(c =>
      c.classList.toggle('active', c.dataset.filter === state.filter));
    rerender();
    setTimeout(() => {
      const targetRow = tbody.querySelector(`tr.expandable[data-row-id="${e.detail.rowId}"]`);
      if (targetRow) {
        targetRow.scrollIntoView({behavior:'smooth', block:'center'});
        ctx.flash(targetRow);
      }
    }, 50);
  });

  let lastData = null;

  function passesFilter(row, filter) {
    if (filter === 'all') return true;
    if (filter.includes(':')) {
      const [k, v] = filter.split(':');
      return String(row[k] ?? '') === v;
    }
    if (filter === 'stale') return ctx.daysSince(row.last_login_time) > 365;
    return false;
  }

  function passesSearch(row, query) {
    if (!query) return true;
    const fields = config.search?.fields || [];
    return fields.some(f => {
      const v = ctx.getByPath(row, f);
      return v != null && String(v).toLowerCase().includes(query);
    });
  }

  function rowId(row) {
    return row[config.row_id_field || 'device_id'] || row.mac || row.user_id || row.email || JSON.stringify(row).slice(0,40);
  }

  function rerender() {
    if (!lastData) return;
    render(lastData);
  }

  function cellHtml(row, col) {
    const v = ctx.getByPath(row, col.field);
    if (col.render === 'license_pill') {
      if (v === 'expired') return `<span class="pill pill-crit">expired</span>`;
      if (v === 'active') return `<span class="pill pill-ok">${row.license_type||'active'}</span>`;
      return `<span class="pill pill-muted">${v||'—'}</span>`;
    }
    if (col.render === 'type_chip') {
      return `<span class="type-chip type-${v}"><span class="dot"></span>${v}</span>`;
    }
    if (col.render === 'role_pill') {
      const role = v || (row.networks?.[0]?.role) || '—';
      const cls = role === 'admin' ? 'pill-info' : role === 'viewer' ? 'pill-muted' : 'pill-warn';
      return `<span class="pill ${cls}">${role}</span>`;
    }
    if (col.render === 'risk_pill') {
      const d = ctx.daysSince(row.last_login_time);
      let label, cls;
      if (d === Infinity) { label = '從未登入'; cls = 'pill-crit'; }
      else if (d > 730) { label = `${(d/365).toFixed(1)}y stale`; cls = 'pill-crit'; }
      else if (d > 365) { label = `${(d/365).toFixed(1)}y stale`; cls = 'pill-warn'; }
      else if (d > 90) { label = `${d}d quiet`; cls = 'pill-info'; }
      else { label = 'active'; cls = 'pill-ok'; }
      return `<span class="pill ${cls}">${label}</span>`;
    }
    if (col.render === 'policy_pill') {
      const p = String(v || '').toLowerCase();
      if (p === 'allow' || p === 'permit' || p === 'accept') return `<span class="pill pill-ok">${v}</span>`;
      if (p === 'deny' || p === 'block' || p === 'drop' || p === 'reject') return `<span class="pill pill-crit">${v}</span>`;
      return `<span class="pill pill-muted">${v || '—'}</span>`;
    }
    if (col.render === 'bool_check') {
      const on = (v === true || v === 'true' || v === 1);
      return on ? `<span style="color:var(--success);font-weight:700">✓</span>`
                : `<span style="color:var(--text-3)">✗</span>`;
    }
    if (col.render === 'date') return `<span class="mono" style="font-size: var(--fs-sub)">${ctx.fmtDate(v)}</span>`;
    if (col.render === 'name_with_sub') {
      const sub = ctx.getByPath(row, col.sub_field);
      return `<strong>${v||'—'}</strong><div style="font-size: var(--fs-label);color:var(--text-3)" class="mono">${sub||''}</div>`;
    }
    if (col.render === 'network_or_unassigned') {
      return v ? v : '<span class="pill pill-muted">unassigned</span>';
    }
    if (col.render === 'mono_ellipsis') {
      return `<span class="ell mono" style="font-size: var(--fs-sub);color:var(--text-2)">${v||'—'}</span>`;
    }
    if (col.render === 'count') return `<span class="num">${(v||[]).length||v||0}</span>`;
    if (col.cls === 'mono') return `<span class="mono">${v||'—'}</span>`;
    return v == null ? '—' : String(v);
  }

  function detailHtml(row) {
    if (!config.detail_fields) return '';
    return `<div class="detail-grid">${config.detail_fields.map(f => {
      const v = ctx.getByPath(row, f.field);
      let display = v;
      if (f.render === 'datetime') display = ctx.fmtDateTime(v);
      if (f.render === 'date') display = ctx.fmtDate(v);
      if (f.render === 'network_list') {
        const nets = v || [];
        if (nets.length === 0) display = '<span style="color:var(--text-3); font-size: var(--fs-sub);">無 network-level 權限</span>';
        else display = nets.map(n => `<span class="pill pill-muted" style="margin-right:6px; margin-bottom:4px;">${n.name} · ${n.role}</span>`).join('');
      }
      return `<div class="detail-item" ${f.full_width?'style="grid-column: 1/-1"':''}>
        <div class="k">${f.label}</div>
        <div class="v ${f.large?'large':''}">${display==null?'—':display}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function render(data) {
    lastData = data;
    // Support both `compute` (function name) and `data_source` (JSON path).
    // Other widgets (bar_list / donut / pivot_table) accept `compute`, so
    // table accepts it too for API consistency. AI shouldn't have to remember
    // which widgets take which.
    let rows;
    if (config.compute && window.computeFns?.[config.compute]) {
      rows = window.computeFns[config.compute](data, config) || [];
    } else if (config.data_source) {
      rows = ctx.getByPath(data, config.data_source) || [];
    } else {
      console.warn(`[table#${config.id}] No data source: provide either "compute" (compute fn name) or "data_source" (JSON path).`);
      rows = [];
    }
    if (config.sort_by) {
      const sb = config.sort_by;
      const dir = (sb.dir === 'asc') ? 1 : -1;
      rows = [...rows].sort((a,b) => {
        const av = ctx.getByPath(a, sb.field) || 0;
        const bv = ctx.getByPath(b, sb.field) || 0;
        return (av < bv ? -1 : av > bv ? 1 : 0) * dir;
      });
    }
    if (sb_asc(config)) rows = [...rows].reverse();

    // chip counts
    config.filters?.forEach(f => {
      const cnt = f.filter === 'all'
        ? rows.length
        : rows.filter(r => passesFilter(r, f.filter)).length;
      const ce = el.querySelector(`[data-count="${f.filter}"]`);
      if (ce) ce.textContent = cnt;
    });

    // apply filter + search
    const filtered = rows
      .filter(r => passesFilter(r, state.filter))
      .filter(r => passesSearch(r, state.searchQuery));

    // Pagination: only kicks in if enabled AND filtered exceeds page size
    const usePagination = paginationEnabled && filtered.length > pageSize;
    const totalPages = usePagination ? Math.ceil(filtered.length / pageSize) : 1;
    if (state.page > totalPages) state.page = 1;  // clamp after filter shrinks
    const pageStart = usePagination ? (state.page - 1) * pageSize : 0;
    const visible = usePagination ? filtered.slice(pageStart, pageStart + pageSize) : filtered;

    // meta
    const hasSearch = !!state.searchQuery;
    const hasNonAllFilter = state.filter !== 'all' && config.filters;
    if (!hasNonAllFilter && !hasSearch && !usePagination) {
      meta.textContent = config.meta_template
        ? config.meta_template.replace('${count}', rows.length)
        : `${rows.length} items`;
    } else {
      const parts = [];
      if (hasNonAllFilter) parts.push(`filter: ${state.filter}`);
      if (hasSearch) parts.push(`search: "${state.searchQuery}"`);
      if (usePagination) parts.push((ti.page_indicator || 'Page {n} of {total}').replace('{n}', state.page).replace('{total}', totalPages).toLowerCase());
      if (usePagination) {
        meta.textContent = `${visible.length} of ${filtered.length} (${parts.join(' · ')})`;
      } else {
        meta.textContent = `${filtered.length} of ${rows.length} (${parts.join(' · ')})`;
      }
    }

    // Update pagination controls visibility + state
    const pageBar = el.querySelector('[data-role="pagination"]');
    if (pageBar) {
      if (usePagination) {
        pageBar.style.display = 'flex';
        pageBar.querySelector('[data-role="page-indicator"]').textContent = (ti.page_indicator || 'Page {n} of {total}').replace('{n}', state.page).replace('{total}', totalPages);
        pageBar.querySelector('[data-role="first"]').disabled = state.page <= 1;
        pageBar.querySelector('[data-role="prev"]').disabled = state.page <= 1;
        pageBar.querySelector('[data-role="next"]').disabled = state.page >= totalPages;
        const lastBtn = pageBar.querySelector('[data-role="last"]');
        lastBtn.disabled = state.page >= totalPages;
        lastBtn.dataset.total = totalPages;
      } else {
        pageBar.style.display = 'none';
      }
    }

    // body
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${(config.columns||[]).length}"><div class="empty-state">${ti.empty_state || 'No rows match this filter'}</div></td></tr>`;
      return;
    }
    tbody.innerHTML = visible.map(row => {
      const id = rowId(row);
      const isOpen = state.expanded.has(id);
      const expandable = !!config.expandable_rows;
      const dim = (config.row_dim_field && !ctx.getByPath(row, config.row_dim_field)) ? 'row-muted' : '';
      const cls = `${expandable ? `expandable ${isOpen?'open':''}` : ''} ${dim}`.trim();
      const mainTr = `<tr class="${cls}" data-row-id="${id}">${
        (config.columns||[]).map(c => `<td class="${c.align==='right'?'num':''}">${cellHtml(row, c)}</td>`).join('')
      }</tr>`;
      const detailTr = expandable
        ? `<tr class="detail ${isOpen?'open':''}" data-detail-row-id="${id}"><td colspan="${(config.columns||[]).length}">${detailHtml(row)}</td></tr>`
        : '';
      return mainTr + detailTr;
    }).join('');
  }

  function sb_asc(c) { return c.sort_by?.dir === 'asc' && false; }  // noop kept for symmetry

  return { render };
});

</script>
