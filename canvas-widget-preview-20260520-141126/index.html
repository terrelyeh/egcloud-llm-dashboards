    // Reveal/hide toggle
    const input = host.querySelector('#db-settings-key');
    const toggle = host.querySelector('[data-toggle="reveal"]');
    toggle.addEventListener('click', () => {
      const masked = input.type === 'password';
      input.type = masked ? 'text' : 'password';
      toggle.setAttribute('aria-label', masked ? t.hide : t.reveal);
    });
    return host;
  }

  async function openSettingsModal() {
    const t = (currentSpec?.i18n?.settings) || EN_FALLBACK.settings;
    const host = ensureSettingsModal(t);
    host.hidden = false;
    host.querySelector('.db-modal-status').hidden = true;
    host.querySelector('#db-settings-key').value = '';
    host.querySelector('.db-modal-secret-row').classList.remove('invalid');

    // Show currently-active account (from the cached /account fetched on init)
    const currentEl = host.querySelector('#db-settings-current');
    currentEl.textContent = cachedAccount?.email || t.no_account;

    // Sync auto-refresh dropdown with current state (localStorage or in-memory)
    const autoSelect = host.querySelector('#db-settings-auto');
    if (autoSelect) autoSelect.value = String(autoRefreshSeconds || 0);

    // Wire Save (clone-replace to drop any prior handler from earlier open)
    const oldSave = host.querySelector('.db-settings-save');
    const save = oldSave.cloneNode(true);
    oldSave.parentNode.replaceChild(save, oldSave);

    const oldReset = host.querySelector('.db-settings-reset');
    const reset = oldReset.cloneNode(true);
    oldReset.parentNode.replaceChild(reset, oldReset);

    const input = host.querySelector('#db-settings-key');
    const row = host.querySelector('.db-modal-secret-row');
    const status = host.querySelector('.db-modal-status');

    save.addEventListener('click', async () => {
      const key = input.value.trim();
      // Always apply auto-refresh selection on Save (even when API key is empty,
      // user might just be toggling the auto dropdown).
      const autoSelectEl = host.querySelector('#db-settings-auto');
      const autoSeconds = autoSelectEl ? parseInt(autoSelectEl.value, 10) || 0 : 0;
      const autoChanged = autoSeconds !== autoRefreshSeconds;

      // If user didn't enter a key but only changed auto, accept that.
      if (!key) {
        if (autoChanged) {
          applyAutoRefresh(autoSeconds);
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-success';
          status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)}`;
          setTimeout(() => { host.hidden = true; }, 800);
        } else {
          // Nothing to do — close
          host.hidden = true;
        }
        return;
      }

      // Client-side shape check first to avoid noisy server round-trip
      if (!/^[A-Za-z0-9+/=_-]{8,200}$/.test(key)) {
        row.classList.add('invalid');
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = t.invalid;
        return;
      }
      row.classList.remove('invalid');
      save.disabled = true;
      save.classList.add('spinning');
      status.hidden = false;
      status.className = 'db-modal-status db-modal-status-info';
      status.innerHTML = `<span class="ic spin">↻</span> ${escapeHtml(t.saving)}`;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: key }),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = `${t.api_error}: ${payload.error || r.statusText}`;
          save.disabled = false;
          save.classList.remove('spinning');
          return;
        }
        status.className = 'db-modal-status db-modal-status-success';
        status.innerHTML = `<span class="ic">✓</span> ${escapeHtml(t.saved)} · ${escapeHtml(payload.email || '')}`;
        // Bust caches and reload chips so the header reflects the swap
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        // Also apply auto-refresh selection if it changed
        if (autoChanged) applyAutoRefresh(autoSeconds);
        save.classList.remove('spinning');
        setTimeout(() => { host.hidden = true; }, 1200);
      } catch (e) {
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = `${t.api_error}: ${e.message}`;
        save.disabled = false;
        save.classList.remove('spinning');
      }
    });

    reset.addEventListener('click', async () => {
      reset.disabled = true;
      try {
        const r = await fetch('/settings/api-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          status.hidden = false;
          status.className = 'db-modal-status db-modal-status-error';
          status.textContent = err.error || r.statusText;
          reset.disabled = false;
          return;
        }
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-success';
        status.textContent = t.reset_done;
        cachedAccount = null;
        cachedOrgs = null;
        renderIdentityChips(currentSpec?.refresh).catch(() => {});
        setTimeout(() => { host.hidden = true; reset.disabled = false; }, 1200);
      } catch (e) {
        status.hidden = false;
        status.className = 'db-modal-status db-modal-status-error';
        status.textContent = e.message;
        reset.disabled = false;
      }
    });
  }

  async function openDeployModal() {
    const t = (currentSpec?.i18n?.deploy) || EN_FALLBACK.deploy;
    const canvasDir = deriveCanvasDir();
    if (!canvasDir) {
      alert(t.not_a_canvas);
      return;
    }
    const host = ensureModal(t);
    host.hidden = false;
    host.querySelector('.db-modal-status').hidden = true;

    // Reset Vercel URL input each open: clear any previous edit, seed from
    // canvas folder name. User can override before pressing Deploy.
    const nameInput = host.querySelector('#db-modal-name');
    nameInput.value = deriveDefaultProjectName(canvasDir);
    nameInput.classList.remove('invalid');
    nameInput.oninput = () => {
      const cleaned = sanitizeProjectName(nameInput.value);
      if (cleaned !== nameInput.value) nameInput.value = cleaned;
      const help = nameInput.closest('.db-modal-url')?.querySelector('.db-modal-url-help');
      if (!PROJECT_NAME_RE.test(nameInput.value) || nameInput.value.length === 0) {
        nameInput.classList.add('invalid');
        if (help) help.textContent = t.url_invalid;
      } else {
        nameInput.classList.remove('invalid');
        if (help) help.textContent = t.url_help;
      }
    };

    // GH Pages fields — repo dropdown + path slug + URL preview. Repo list
    // is fetched lazily when the target radio first switches to gh-pages.
    const repoInput = host.querySelector('#db-modal-gh-repo');
    const pathInput = host.querySelector('#db-modal-gh-path');
    const repoHelpEl = host.querySelector('#db-modal-gh-repo-help');
    const ghPreview = {
      owner: host.querySelector('[data-bind="gh-owner"]'),
      name:  host.querySelector('[data-bind="gh-name"]'),
      path:  host.querySelector('[data-bind="gh-path"]'),
    };
    const updateGhPreview = () => {
      const repo = repoInput.value.trim();
      const [owner, name] = repo.split('/');
      ghPreview.owner.textContent = owner || 'owner';
      ghPreview.name.textContent = name || 'repo';
      ghPreview.path.textContent = (pathInput.value.trim() || 'path');
    };
    // Default path slug = same auto-derived value as Vercel
    pathInput.value = deriveDefaultProjectName(canvasDir);
    repoInput.value = '';  // user picks each time
    repoInput.oninput = updateGhPreview;
    pathInput.oninput = () => {
      // Sanitize path slug like vercel but allow dot + underscore too
      const cleaned = String(pathInput.value || '').replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 100);
      if (cleaned !== pathInput.value) pathInput.value = cleaned;
      updateGhPreview();
    };
    updateGhPreview();

    // Target radio · switches visible sections + ETA + button state
    const ghRepoListLoaded = { done: false };
    async function loadRepoListOnce() {
      if (ghRepoListLoaded.done) return;
      ghRepoListLoaded.done = true;
      repoHelpEl.textContent = t.repo_loading;
      try {
        const r = await fetch('/gh/repos');
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          repoHelpEl.textContent = `${t.repo_no_gh}: ${err.error || r.statusText}`;
          return;
        }
        const { repos = [] } = await r.json();
        const datalist = host.querySelector('#db-modal-gh-repos');
        datalist.innerHTML = repos
          .map(r => `<option value="${escapeHtml(r.nameWithOwner)}"></option>`)
          .join('');
        repoHelpEl.textContent = t.repo_help;
      } catch (e) {
        repoHelpEl.textContent = `${t.repo_no_gh}: ${e.message}`;
      }
    }
    const targetRadios = host.querySelectorAll('input[name="db-modal-target"]');
    const etaEl = host.querySelector('#db-modal-eta');
    function applyTarget(target) {
      host.querySelectorAll('[data-show-target]').forEach(el => {
        el.hidden = el.dataset.showTarget !== target;
      });
      etaEl.textContent = target === 'gh-pages' ? t.eta_ghpages : t.eta_vercel;
      if (target === 'gh-pages') loadRepoListOnce();
    }
    targetRadios.forEach(r => r.onchange = () => applyTarget(r.value));
    applyTarget('vercel');  // default

    // Clone-replace the Deploy button FIRST to drop any click handler from a
    // previous open. Order matters: setModalScan() binds `ack.onchange` to
    // toggle this button's `.disabled`, so the bound reference must be the
    // node that's currently in the DOM. Cloning AFTER setModalScan strands
    // the binding on a detached node and leaves the visible button frozen
    // as disabled. See PR #43 follow-up.
    const oldGo = host.querySelector('.db-modal-go');
    const go = oldGo.cloneNode(true);
    oldGo.parentNode.replaceChild(go, oldGo);

    // Fetch identifier scan
    try {
      const r = await fetch('/deploy/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ canvas_dir: canvasDir }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(err.error || r.statusText)}`, 'error');
        return;
      }
      const payload = await r.json();
      setModalScan(host, payload, t);
    } catch (e) {
      setModalStatus(host, t.network_err, 'error');
      return;
    }

    go.addEventListener('click', async () => {
      const target = host.querySelector('input[name="db-modal-target"]:checked')?.value || 'vercel';
      const body = {
        canvas_dir: canvasDir,
        target,
        mode: 'snapshot',
        snapshot_meta: buildSnapshotMetaForDeploy(currentSpec?.refresh),
      };
      // Read purpose radio for redact decision. If no radio exists (no
      // identifiers found) → no redact needed.
      const purposeEl = host.querySelector('input[name="db-modal-purpose"]:checked');
      body.redact = purposeEl?.value === 'share';

      if (target === 'vercel') {
        // Vercel: trim trailing dashes only at submit (mid-edit would block
        // the user from typing "abc-def").
        const finalName = sanitizeProjectName(nameInput.value, { trimEdges: true });
        nameInput.value = finalName;
        if (!PROJECT_NAME_RE.test(finalName)) {
          nameInput.classList.add('invalid');
          nameInput.focus();
          return;
        }
        body.project_name = finalName;
      } else {
        // gh-pages: validate repo (owner/name) + path slug
        const repo = repoInput.value.trim();
        const path = pathInput.value.trim();
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\/[A-Za-z0-9._-]{1,100}$/.test(repo)) {
          repoInput.classList.add('invalid');
          repoHelpEl.textContent = t.repo_invalid;
          repoInput.focus();
          return;
        }
        if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,98}$/.test(path)) {
          pathInput.classList.add('invalid');
          pathInput.focus();
          return;
        }
        repoInput.classList.remove('invalid');
        pathInput.classList.remove('invalid');
        body.github_repo = repo;
        body.github_path = path;
      }

      go.disabled = true;
      go.classList.add('spinning');
      setModalStatus(host, `<span class="ic spin">↻</span> ${escapeHtml(t.deploying)}`, 'info');
      try {
        const r = await fetch('/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) {
          setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(payload.error || r.statusText)}`, 'error');
          go.disabled = false;
          go.classList.remove('spinning');
          return;
        }
        setModalStatus(host, `
          <div class="db-modal-success">
            <strong>${escapeHtml(t.deployed)}</strong>
            <a href="${escapeHtml(payload.url)}" target="_blank" rel="noopener">${escapeHtml(payload.url)}</a>
            <button type="button" class="btn db-modal-copy" data-url="${escapeHtml(payload.url)}">${escapeHtml(t.copy)}</button>
          </div>
        `, 'success');
        const copyBtn = host.querySelector('.db-modal-copy');
        copyBtn?.addEventListener('click', () => {
          navigator.clipboard.writeText(payload.url).then(() => {
            copyBtn.textContent = t.copied;
            setTimeout(() => copyBtn.textContent = t.copy, 1500);
          });
        });
        go.classList.remove('spinning');
        // Leave Deploy button disabled — this canvas is now deployed.
      } catch (e) {
        setModalStatus(host, `${t.deploy_failed}: ${escapeHtml(e.message)}`, 'error');
        go.disabled = false;
        go.classList.remove('spinning');
      }
    });
  }

  // ---------- Auto-refresh state machine ----------
  // Reads localStorage on init, dropdown in Settings modal writes back.
  // setTimeout-based scheduling so we can cleanly reset "next at" when manual
  // Refresh fires mid-cycle (vs setInterval which doesn't expose elapsed time).
  function autoRefreshStorageKey() {
    return `db-auto-refresh-${deriveCanvasDir() || 'unknown'}`;
  }
  function cancelAutoRefresh() {
    if (autoRefreshTimer) { clearTimeout(autoRefreshTimer); autoRefreshTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }
  function hideAutoStateEl() {
    const el = document.getElementById('db-auto-state');
    if (el) { el.hidden = true; el.className = 'db-auto-state'; el.textContent = ''; }
  }
  function showCountdownPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    if (document.hidden) return;  // don't render countdown while tab hidden
    const remaining = Math.max(0, nextRefreshAt - Date.now());
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    const time = `${m}:${String(s).padStart(2, '0')}`;
    const template = ((t().status || {}).next_in) || 'next: {time}';
    el.hidden = false;
    el.className = 'db-auto-state countdown';
    el.textContent = template.replace('{time}', time);
  }
  function showAutoPausedPill() {
    const el = document.getElementById('db-auto-state');
    if (!el) return;
    const template = ((t().status || {}).auto_paused) || '⚠ auto paused ({n} errors)';
    el.hidden = false;
    el.className = 'db-auto-state paused';
    el.innerHTML =
      `${template.replace('{n}', autoRefreshFailCount).replace(/</g,'&lt;')}` +
      ` <button class="db-auto-state-close" type="button" aria-label="dismiss">✕</button>`;
    el.querySelector('.db-auto-state-close')?.addEventListener('click', hideAutoStateEl);
  }
  function scheduleNextAutoRefresh() {
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    const delay = Math.max(0, nextRefreshAt - Date.now());
    autoRefreshTimer = setTimeout(async () => {
      // Skip if tab hidden — visibilitychange will reschedule on resume.
      if (document.hidden) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      if (!runRefreshFn) {
        nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        scheduleNextAutoRefresh();
        return;
      }
      try {
        const ok = await runRefreshFn();
        if (ok) {
          autoRefreshFailCount = 0;
        } else {
          autoRefreshFailCount++;
        }
      } catch (e) {
        console.warn('Auto-refresh error', e);
        autoRefreshFailCount++;
      }
      if (autoRefreshFailCount >= 3) {
        autoRefreshPaused = true;
        cancelAutoRefresh();
        showAutoPausedPill();
        return;
      }
      nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
      scheduleNextAutoRefresh();
    }, delay);
  }
  function applyAutoRefresh(seconds) {
    cancelAutoRefresh();
    autoRefreshSeconds = seconds | 0;
    autoRefreshFailCount = 0;
    autoRefreshPaused = false;
    try { localStorage.setItem(autoRefreshStorageKey(), String(autoRefreshSeconds)); } catch {}
    if (!autoRefreshSeconds || snapshotMeta) {
      hideAutoStateEl();
      return;
    }
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    countdownTimer = setInterval(showCountdownPill, 1000);
    scheduleNextAutoRefresh();
  }
  function resetAutoRefreshTimer() {
    // Called when manual Refresh fires — pushes next auto-refresh from now.
    if (!autoRefreshSeconds || autoRefreshPaused) return;
    autoRefreshFailCount = 0;
    nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
    showCountdownPill();
    scheduleNextAutoRefresh();
  }
  function loadAutoRefreshSetting() {
    try {
      const v = parseInt(localStorage.getItem(autoRefreshStorageKey()) || '0', 10);
      if ([300, 600, 900].includes(v)) return v;
    } catch {}
    return 0;
  }

  async function init(spec) {
    currentSpec = spec;  // captured for i18n lookup (Deploy / Settings / status / widgets)
    ctx.i18n = (spec && spec.i18n) || {};  // expose to widgets via ctx.i18n.<namespace>.<key>
    // Guard: Chrome's file:// security policy blocks fetch() of live-data/*.json.
    // Show friendly instructions instead of an empty 0-filled dashboard.
    if (window.location.protocol === 'file:') {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;inset:0;background:#fef3c7;color:#92400e;padding:40px;font:14px/1.6 system-ui,sans-serif;z-index:99999;overflow:auto;';
      banner.innerHTML = '<h1 style="margin:0 0 16px 0;font-size:20px;">⚠️ Dashboard needs to be served over HTTP</h1>' +
        '<p style="margin:0 0 12px 0;">You opened this file with <code>file://</code> protocol. Chrome blocks <code>fetch()</code> for security, so the dashboard cannot load <code>live-data/*.json</code> and all values appear as 0.</p>' +
        '<p style="margin:0 0 8px 0;font-weight:600;">Fix · run a local HTTP server from the repo root:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0 0 16px 0;font:13px ui-monospace,Menlo,monospace;">bash scripts/serve.sh</pre>' +
        '<p style="margin:0 0 8px 0;">Then open this canvas via:</p>' +
        '<pre style="background:#fde68a;padding:12px;border-radius:6px;margin:0;font:13px ui-monospace,Menlo,monospace;">http://localhost:8765/' + window.location.pathname.split('/').slice(-2).join('/') + '</pre>';
      document.body.prepend(banner);
      return;
    }

    // Snapshot mode detection (fetched once, before widgets render — switches
    // off polling and hides Refresh/Deploy if this canvas was deployed).
    snapshotMeta = await detectSnapshotMode();
    if (snapshotMeta) applySnapshotMode(snapshotMeta);

    // Identity chips · Account (who's the API_KEY?) + Scope (what is in view).
    // Fire-and-forget; failure leaves chips hidden. Fetches in parallel.
    renderIdentityChips(spec.refresh).catch(e => console.warn('identity chips:', e));

    liveData = spec.live_data || {};
    // Wire each section
    for (const section of spec.sections) {
      // raw_html sections are static; no widget lifecycle needed.
      if (section.raw_html !== undefined) continue;
      const factory = widgets.get(section.widget);
      if (!factory) {
        console.error('Unknown widget:', section.widget);
        continue;
      }
      const el = document.querySelector(`[data-widget-id="${section.id || section.widget}"]`);
      if (!el) {
        console.error('Mount point missing for', section.widget, section.id);
        continue;
      }
      const state = {};
      const instance = factory({ el, config: section, bus: { dispatch, on }, state, ctx });
      mounted.push({ name: section.widget, el, config: section, state, instance });
    }

    // ---------- Refresh status banner ----------
    // Visible signal of what /refresh actually did. Three states:
    //   pending  — "↻ refreshing · scope=org · 12s"   (live ticker)
    //   success  — "✓ refreshed · 4 files · 28s"      (auto-fade 10s)
    //   error    — "✗ refresh failed: <msg>"          (sticky · close button)
    // Replaces the old console.error + missing-ctx.toast no-op.
    const statusEl = document.getElementById('db-status');
    let statusTicker = null;
    // setStatus owns transitions BETWEEN states. The pending ticker writes the
    // DOM directly (not via setStatus) so it doesn't keep clearing itself —
    // earlier bug: ticker called setStatus('pending', …) every 1s, which ran
    // clearInterval(statusTicker) and killed the ticker after the first tick.
    function setStatus(kind, html, opts = {}) {
      if (!statusEl) return;
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      statusEl.hidden = false;
      statusEl.className = `db-status db-status-${kind}`;
      statusEl.innerHTML = html;
      if (opts.autoHideMs) {
        setTimeout(() => {
          if (statusEl.classList.contains(`db-status-${kind}`)) statusEl.hidden = true;
        }, opts.autoHideMs);
      }
    }
    function clearStatus() {
      if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
      if (statusEl) statusEl.hidden = true;
    }
    function startStatusTicker(scopeLabel, t0) {
      // Direct DOM mutation each second — bypasses setStatus to avoid
      // self-clearing the interval.
      const ts = (t().status) || {};
      const renderPending = () => {
        if (!statusEl) return;
        const elapsed = Math.floor((Date.now() - t0) / 1000);
        statusEl.hidden = false;
        statusEl.className = 'db-status db-status-pending';
        statusEl.innerHTML = `<span class="ic spin">↻</span> ${ts.refreshing || 'refreshing'} · ${scopeLabel} · ${elapsed}s`;
      };
      renderPending();
      statusTicker = setInterval(renderPending, 1000);
    }

    // Refresh button (skipped in snapshot mode)
    // If spec.refresh is defined, POST /refresh first (server runs the
    // recipe to re-fetch fresh API data into the canvas's live-data folder),
    // then tick() re-loads those JSON files.
    // If spec.refresh is absent, fall back to the old behavior: just re-read
    // existing JSON files (keeps backward compat for canvases that don't
    // declare a refresh scope).
    const refreshConfig = spec.refresh;
    const btn = document.getElementById('db-refresh');

    // The actual refresh routine — used by both manual click and auto-refresh
    // timer. Returns true on success (so auto-refresh fail counter can track).
    async function runRefresh() {
      let ok = true;
      btn?.classList.add('spinning');
      if (btn) btn.disabled = true;
      const t0 = Date.now();
      try {
        if (refreshConfig?.scope) {
          const baseDir = deriveCanvasDir();
          if (!baseDir) {
            console.warn('Cannot derive canvas output_dir from URL; skipping POST', window.location.pathname);
          } else {
            const ts = (t().status) || {};
            const scopeLabel = ts[`scope_${refreshConfig.scope}`] || `scope=${refreshConfig.scope}`;
            startStatusTicker(scopeLabel, t0);
            const body = {
              scope: refreshConfig.scope,
              ids: refreshConfig.ids || {},
              output_dir: `${baseDir}/live-data`,
            };
            const r = await fetch('/refresh', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              const msg = err.error || r.statusText;
              console.error('Refresh recipe failed:', r.status, msg);
              setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_failed) || 'refresh failed'} · ${msg.replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
              statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
              ok = false;
              return ok;
            }
            const payload = await r.json().catch(() => ({}));
            const seconds = Math.max(1, Math.round((payload.elapsed_ms || 0) / 1000));
            const fileCount = (payload.files_written || []).length;
            const ts2 = (t().status) || {};
            const fileLabel = fileCount === 1 ? (ts2.files_one || 'file') : (ts2.files_many || 'files');
            setStatus('success',
              `<span class="ic">✓</span> ${ts2.refreshed || 'refreshed'} · ${fileCount} ${fileLabel} · ${seconds}s`,
              { autoHideMs: 10000 });
          }
        }
        await tick();
      } catch (e) {
        console.error('Refresh failed (network/other):', e);
        setStatus('error', `<span class="ic">✗</span> ${((t().status||{}).refresh_error) || 'refresh error'} · ${String(e.message || e).replace(/</g,'&lt;')} <button class="db-status-close" type="button" aria-label="dismiss">✕</button>`);
        statusEl?.querySelector('.db-status-close')?.addEventListener('click', clearStatus);
        ok = false;
      } finally {
        if (btn) btn.disabled = false;
        setTimeout(() => btn?.classList.remove('spinning'), 400);
      }
      return ok;
    }

    // Expose so auto-refresh state machine + Settings modal can call it.
    runRefreshFn = runRefresh;

    if (btn && !snapshotMeta) btn.addEventListener('click', async () => {
      await runRefresh();
      resetAutoRefreshTimer();  // manual click pushes next auto-fire from now
    });

    // Deploy button (skipped in snapshot mode)
    const deployBtn = document.getElementById('db-deploy');
    if (deployBtn && !snapshotMeta) {
      deployBtn.addEventListener('click', openDeployModal);
    }

    // Settings button (hidden in snapshot mode — deployed copy can't swap key)
    const settingsBtn = document.getElementById('db-settings');
    if (settingsBtn) {
      if (snapshotMeta) {
        settingsBtn.style.display = 'none';
      } else {
        settingsBtn.addEventListener('click', openSettingsModal);
      }
    }

    // First tick + poll loop (no polling in snapshot mode — data is frozen)
    await tick();
    if (!snapshotMeta) pollHandle = setInterval(tick, 5000);

    // Auto-refresh: read saved preference (off by default), apply if set.
    if (!snapshotMeta) {
      const savedAuto = loadAutoRefreshSetting();
      if (savedAuto > 0) applyAutoRefresh(savedAuto);
    }

    // Pause / resume countdown + scheduler on tab visibility change.
    document.addEventListener('visibilitychange', () => {
      if (!autoRefreshSeconds || autoRefreshPaused) return;
      if (document.visibilityState === 'visible') {
        // Tab returned to foreground. If we missed the scheduled time, push it
        // out by full interval (don't fire backlog of missed refreshes).
        if (Date.now() >= nextRefreshAt) {
          nextRefreshAt = Date.now() + autoRefreshSeconds * 1000;
        }
        showCountdownPill();  // resume display immediately
      }
    });
  }

  return { register, init, dispatch, on, ctx };
})();

</script>

<script>
/* === widget line_chart === */

Dashboard.register('line_chart', ({ el, config, ctx }) => {
  el.classList.add('card');
  el.innerHTML = `
    <div class="card-hdr">
      <h2>${config.title || 'Trend'}</h2>
      <span class="meta" data-bind="meta">—</span>
    </div>
    <div class="w-lc-head"><div class="w-lc-readout" data-role="readout"></div></div>
    <div class="w-lc-plot" data-role="plot">
      <div class="w-lc-canvas"><svg class="w-lc-svg" viewBox="0 0 100 100" preserveAspectRatio="none" data-role="svg"></svg></div>
      <div class="w-lc-ylabels" data-role="ylabels"></div>
      <div class="w-lc-xlabels" data-role="xlabels"></div>
      <div class="w-lc-overlay" data-role="overlay"></div>
      <div class="w-lc-hit" data-role="hit"></div>
    </div>
    <div class="w-lc-legend" data-role="legend"></div>
  `;
  const plot = el.querySelector('[data-role="plot"]');
  const svg = el.querySelector('[data-role="svg"]');
  const yEl = el.querySelector('[data-role="ylabels"]');
  const xEl = el.querySelector('[data-role="xlabels"]');
  const ovEl = el.querySelector('[data-role="overlay"]');
  const hitEl = el.querySelector('[data-role="hit"]');
  const legendEl = el.querySelector('[data-role="legend"]');
  const metaEl = el.querySelector('[data-bind="meta"]');
  const readoutEl = el.querySelector('[data-role="readout"]');

  // Series colors map to design tokens (theme-aware, dark cascades automatically).
  const PALETTE = ['var(--brand)', 'var(--info)', 'var(--success)', 'var(--warning)', 'var(--critical)'];
  const SEV = { critical: 'var(--critical)', warning: 'var(--warning)', success: 'var(--success)', info: 'var(--info)' };

  const num = (v) => (typeof v === 'number' ? v : parseFloat(v));
  function toMs(x) {
    if (typeof x === 'number') return x;
    const t = Date.parse(x);
    return isNaN(t) ? null : t;
  }
  function fmtTime(ms, span) {
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    if (span != null && span > 2 * 86400000) return `${d.getMonth() + 1}/${d.getDate()}`;
    if (span != null && span > 3600000) return `${p(d.getHours())}:${p(d.getMinutes())}`;
    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function niceCeil(v) {
    if (v <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  let lastModel = null;

  function normalize(data) {
    let m;
    if (config.compute && window.computeFns[config.compute]) {
      m = window.computeFns[config.compute](data, config);
    } else if (config.series) {
      m = { series: config.series };
    } else {
      return null;
    }
    if (!m || !Array.isArray(m.series) || m.series.length === 0) return null;
    m.series = m.series.map((s, i) => {
      const pts = (s.points || []).map(p => ({
        x: ('x' in p) ? p.x : p.t,
        y: num('y' in p ? p.y : p.value),
      })).filter(p => p.x != null && !isNaN(p.y));
      // x → ms if it parses as time, else keep index
      const xms = pts.map(p => toMs(p.x));
      const useMs = xms.every(v => v != null);
      pts.forEach((p, j) => { p.xm = useMs ? xms[j] : j; });
      return { name: s.name || `series ${i + 1}`, color: s.color || (s.severity && SEV[s.severity]) || PALETTE[i % PALETTE.length], points: pts, unit: s.unit || m.unit };
    }).filter(s => s.points.length > 0);
    if (m.series.length === 0) return null;
    m.unit = m.unit || '';
    return m;
  }

  function render(data) {
    const m = lastModel = normalize(data) || lastModel;
    if (!m) {
      plot.style.display = 'none';
      readoutEl.innerHTML = `<div class="empty-state" style="padding:18px 0">${(config.empty_text) || 'No trend data yet'}</div>`;
      legendEl.innerHTML = ''; metaEl.textContent = '—';
      return;
    }
    plot.style.display = '';

    const allX = m.series.flatMap(s => s.points.map(p => p.xm));
    const allY = m.series.flatMap(s => s.points.map(p => p.y));
    const xMin = Math.min(...allX), xMax = Math.max(...allX);
    const xSpan = (xMax - xMin) || 1;
    const yMin = config.y_min != null ? config.y_min : Math.min(0, ...allY);
    const yMaxRaw = config.y_max != null ? config.y_max : Math.max(...allY, ...(config.thresholds || []).map(t => t.value));
    const yMax = config.y_max != null ? config.y_max : niceCeil(yMaxRaw * 1.15 || 1);
    const ySpan = (yMax - yMin) || 1;
    const isTime = m.series.every(s => s.points.every(p => p.xm > 1e11)); // ms timestamps

    const px = (xm) => ((xm - xMin) / xSpan) * 100;
    const py = (y) => 100 - ((y - yMin) / ySpan) * 100;

    // ---- SVG: gridlines, threshold, area + line per series ----
    let defs = '', body = '';
    // horizontal gridlines (5 bands)
    const STEPS = 4;
    for (let i = 0; i <= STEPS; i++) {
      const yy = (i / STEPS) * 100;
      body += `<line class="w-lc-grid-line${i === STEPS ? ' base' : ''}" x1="0" y1="${yy.toFixed(2)}" x2="100" y2="${yy.toFixed(2)}"/>`;
    }
    (config.thresholds || []).forEach(th => {
      if (th.value < yMin || th.value > yMax) return;
      const yy = py(th.value);
      body += `<line class="w-lc-thresh" x1="0" y1="${yy.toFixed(2)}" x2="100" y2="${yy.toFixed(2)}" style="stroke:${SEV[th.severity] || 'var(--warning)'}"/>`;
    });
    m.series.forEach((s, si) => {
      const gid = `w-lc-grad-${si}-${Math.random().toString(36).slice(2, 7)}`;
      const line = s.points.map((p, j) => `${j ? 'L' : 'M'}${px(p.xm).toFixed(2)},${py(p.y).toFixed(2)}`).join(' ');
      const area = `${line} L${px(s.points[s.points.length - 1].xm).toFixed(2)},100 L${px(s.points[0].xm).toFixed(2)},100 Z`;
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="${si === 0 ? 0.28 : 0.12}"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      body += `<path d="${area}" fill="url(#${gid})"/>`;
      body += `<path class="w-lc-line draw" d="${line}" style="stroke:${s.color}"/>`;
      s._gid = gid;
    });
    svg.innerHTML = `<defs>${defs}</defs>${body}`;

    // ---- Y labels ----
    let yh = '';
    for (let i = 0; i <= STEPS; i++) {
      const val = yMax - (i / STEPS) * ySpan;
      yh += `<span style="top:${((i / STEPS) * 100).toFixed(1)}%">${(Math.round(val * 10) / 10)}</span>`;
    }
    yEl.innerHTML = yh;

    // ---- X labels (≈5, evenly spaced by the primary series) ----
    const base = m.series[0].points;
    const want = Math.min(5, base.length);
    let xh = '';
    for (let i = 0; i < want; i++) {
      const idx = want === 1 ? 0 : Math.round(i * (base.length - 1) / (want - 1));
      const p = base[idx];
      const lbl = isTime ? fmtTime(p.xm, xSpan) : p.x;
      xh += `<span style="left:${px(p.xm).toFixed(1)}%">${lbl}</span>`;
    }
    xEl.innerHTML = xh;

    // ---- Overlay: last-point dots (pulse on primary) ----
    let ov = `<div class="w-lc-guide" data-role="guide"></div>`;
    m.series.forEach((s, si) => {
      const last = s.points[s.points.length - 1];
      ov += `<div class="w-lc-dot${si === 0 ? ' pulse' : ''}" style="left:${px(last.xm).toFixed(2)}%;top:${py(last.y).toFixed(2)}%;background:${s.color};--dot-color:${s.color}"></div>`;
      ov += `<div class="w-lc-hover-dot" data-hd="${si}" style="background:${s.color}"></div>`;
    });
    ov += `<div class="w-lc-tip" data-role="tip"></div>`;
    ovEl.innerHTML = ov;
    const guide = ovEl.querySelector('[data-role="guide"]');
    const tip = ovEl.querySelector('[data-role="tip"]');
    const hoverDots = [...ovEl.querySelectorAll('[data-hd]')];

    // ---- Readout (current value per series) ----
    readoutEl.innerHTML = m.series.map((s) => {
      const pts = s.points, cur = pts[pts.length - 1].y;
      const prev = pts.length > 1 ? pts[pts.length - 2].y : cur;
      const d = cur - prev;
      const dir = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
      const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '▬';
      const deltaHtml = pts.length > 1
        ? `<span class="w-lc-delta ${dir}">${arrow} ${Math.abs(Math.round(d * 10) / 10)}</span>` : '';
      return `<div class="ro" style="--ro-color:${s.color}">
        <div class="ro-val">${Math.round(cur * 10) / 10}<span class="unit">${s.unit || ''}</span> ${deltaHtml}</div>
        <div class="ro-lbl">${s.name}</div>
      </div>`;
    }).join('');

    // ---- Hover interaction ----
    hitEl.onmousemove = (e) => {
      const r = hitEl.getBoundingClientRect();
      const fx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const targetXm = xMin + fx * xSpan;
      // nearest point on primary series
      let best = base[0], bi = 0;
      base.forEach((p, j) => { if (Math.abs(p.xm - targetXm) < Math.abs(best.xm - targetXm)) { best = p; bi = j; } });
      const lx = px(best.xm);
      guide.style.left = lx + '%'; guide.style.opacity = '1';
      const rows = m.series.map((s, si) => {
        const p = s.points[bi] || s.points[s.points.length - 1];
        const hd = hoverDots[si];
        if (hd && p) { hd.style.left = px(p.xm) + '%'; hd.style.top = py(p.y) + '%'; hd.style.opacity = '1'; }
        return `<div class="tip-row"><span class="sw" style="background:${s.color}"></span>${s.name}<b>${Math.round(p.y * 10) / 10}${s.unit || ''}</b></div>`;
      }).join('');
      tip.innerHTML = `<div class="tip-t">${isTime ? fmtTime(best.xm, xSpan) : best.x}</div>${rows}`;
      tip.style.left = Math.max(8, Math.min(98, lx)) + '%';
      tip.style.top = py(best.y) + '%';
      tip.style.opacity = '1';
    };
    hitEl.onmouseleave = () => {
      guide.style.opacity = '0'; tip.style.opacity = '0';
      hoverDots.forEach(d => d.style.opacity = '0');
    };

    // ---- Legend + meta ----
    const legItems = m.series.map(s => `<span class="item"><span class="sw" style="background:${s.color}"></span>${s.name}</span>`);
    (config.thresholds || []).forEach(th => {
      legItems.push(`<span class="item"><span class="sw dash" style="border-color:${SEV[th.severity] || 'var(--warning)'}"></span>${th.label || `threshold ${th.value}`}</span>`);
    });
    legendEl.innerHTML = legItems.join('');
    const n = base.length;
    metaEl.textContent = isTime
      ? `${n} pts · ${fmtTime(xMin, xSpan)}–${fmtTime(xMax, xSpan)}`
      : `${n} points`;
  }

  return { render };
});

/* === widget sparkline === */

Dashboard.register('sparkline', ({ el, config, ctx }) => {
  el.classList.add('card');
  el.innerHTML = `
    <div class="card-hdr">
      <h2>${config.title || 'Trends'}</h2>
      <span class="meta" data-bind="meta">—</span>
    </div>
    <div class="w-sl-list" data-role="list"></div>
  `;
  const listEl = el.querySelector('[data-role="list"]');
  const metaEl = el.querySelector('[data-bind="meta"]');

  const SEV = { critical: 'var(--critical)', warning: 'var(--warning)', success: 'var(--success)', info: 'var(--info)' };
  const num = (v) => (typeof v === 'number' ? v : parseFloat(v));

  function seriesPoints(raw) {
    return (raw || []).map(p => (typeof p === 'object' ? num('y' in p ? p.y : p.value) : num(p)))
      .filter(v => !isNaN(v));
  }

  function spark(points, color) {
    if (points.length < 2) return { svg: '', dotX: 0, dotY: 50 };
    const min = Math.min(...points), max = Math.max(...points);
    const span = (max - min) || 1;
    const n = points.length;
    const X = (i) => (i / (n - 1)) * 100;
    const Y = (v) => 92 - ((v - min) / span) * 84;  // 8% top / bottom padding
    const line = points.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(2)},${Y(v).toFixed(2)}`).join(' ');
    const area = `${line} L100,100 L0,100 Z`;
    const gid = `w-sl-g-${Math.random().toString(36).slice(2, 7)}`;
    const svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path class="ln" d="${line}" style="stroke:${color}"/>
    </svg>`;
    return { svg, dotX: X(n - 1), dotY: Y(points[n - 1]) };
  }

  function render(data) {
    let m;
    if (config.compute && window.computeFns[config.compute]) {
      m = window.computeFns[config.compute](data, config);
    } else {
      m = { items: config.items || [] };
    }
    const items = (m && m.items) || [];
    if (!items.length) {
      listEl.innerHTML = `<div class="empty-state">${config.empty_text || 'No data'}</div>`;
      metaEl.textContent = '—';
      return;
    }
    listEl.innerHTML = items.map(it => {
      const pts = seriesPoints(it.points);
      const color = it.color || (it.severity && SEV[it.severity]) || 'var(--brand)';
      const cur = it.value != null ? num(it.value) : (pts.length ? pts[pts.length - 1] : 0);
      const prev = pts.length > 1 ? pts[pts.length - 2] : cur;
      const d = cur - prev;
      const higherBetter = it.higher_better != null ? it.higher_better : config.higher_better;
      let cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
      if (higherBetter != null && d !== 0) cls = ((d > 0) === !!higherBetter) ? 'good' : 'bad';
      const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '▬';
      const deltaHtml = pts.length > 1 ? `<span class="w-sl-delta ${cls}">${arrow}${Math.abs(Math.round(d * 10) / 10)}</span>` : '';
      const sp = spark(pts, color);
      const dot = pts.length >= 2
        ? `<div class="dot" style="left:${sp.dotX}%;top:${sp.dotY}%;background:${color}"></div>` : '';
      return `<div class="w-sl-row">
        <div class="w-sl-label">
          <div class="nm">${it.label ?? ''}</div>
          ${it.sublabel ? `<div class="sub">${it.sublabel}</div>` : ''}
        </div>
        <div class="w-sl-spark">${sp.svg}${dot}</div>
        <div class="w-sl-right">
          <span class="w-sl-val">${Math.round(cur * 10) / 10}<span class="u">${it.unit || ''}</span></span>
          ${deltaHtml}
        </div>
      </div>`;
    }).join('');
    metaEl.textContent = `${items.length} ${items.length === 1 ? 'metric' : 'metrics'}`;
  }

  return { render };
});

/* === widget session_timeline === */

Dashboard.register('session_timeline', ({ el, config, ctx }) => {
  el.classList.add('card');
  el.innerHTML = `
    <div class="card-hdr">
      <h2>${config.title || 'Session timeline'}</h2>
      <span class="meta" data-bind="meta">—</span>
    </div>
    <div class="w-st-wrap" data-role="wrap">
      <div class="w-st-axis" data-role="axis"></div>
      <div class="w-st-lanes" data-role="lanes"></div>
    </div>
    <div class="w-st-legend" data-role="legend"></div>
  `;
  const wrap = el.querySelector('[data-role="wrap"]');
  const axisEl = el.querySelector('[data-role="axis"]');
  const lanesEl = el.querySelector('[data-role="lanes"]');
  const legendEl = el.querySelector('[data-role="legend"]');
  const metaEl = el.querySelector('[data-bind="meta"]');

  const LANE_PALETTE = ['var(--brand)', 'var(--info)', 'var(--success)', '#8b5cf6', '#0ea5e9', '#ec4899'];
  const num = (v) => (typeof v === 'number' ? v : parseFloat(v));
  const toMs = (x) => (typeof x === 'number' ? x : Date.parse(x));

  function fmtAxis(ms, span) {
    const d = new Date(ms); const p = (n) => String(n).padStart(2, '0');
    if (span > 3 * 86400000) return `${d.getMonth() + 1}/${d.getDate()}`;
    if (span > 86400000) return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}h`;
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtDur(ms) {
    if (ms == null || isNaN(ms)) return '—';
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.round(s / 60); if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60); return `${h}h ${m % 60}m`;
  }
  function fmtClock(ms) {
    const d = new Date(ms); const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  let tip = null;
  function ensureTip() {
    if (!tip) { tip = document.createElement('div'); tip.className = 'w-st-tip'; document.body.appendChild(tip); }
    return tip;
  }

  function render(data) {
    let m;
    if (config.compute && window.computeFns[config.compute]) {
      m = window.computeFns[config.compute](data, config);
    } else {
      m = { sessions: config.sessions || [], lanes: config.lanes };
    }
    const sessions = ((m && m.sessions) || []).map(s => {
      const start = toMs(s.start_ms != null ? s.start_ms : s.start);
      let end = s.end_ms != null ? toMs(s.end_ms) : (s.end != null ? toMs(s.end) : null);
      if (end == null && s.duration_ms != null) end = start + num(s.duration_ms);
      if (end == null || end < start) end = start + 1;
      return { ...s, _s: start, _e: end, lane: s.lane != null ? String(s.lane) : '—' };
    }).filter(s => !isNaN(s._s));

    if (!sessions.length) {
      lanesEl.innerHTML = `<div class="empty-state">${config.empty_text || 'No session history'}</div>`;
      axisEl.innerHTML = ''; legendEl.innerHTML = ''; metaEl.textContent = '—';
      return;
    }

    const tMin = Math.min(...sessions.map(s => s._s));
    const tMax = Math.max(...sessions.map(s => s._e), ...(m.now_ms ? [toMs(m.now_ms)] : []));
    const span = (tMax - tMin) || 1;
    const pad = span * 0.02;
    const dMin = tMin - pad, dMax = tMax + pad, dSpan = dMax - dMin;
    const px = (t) => ((t - dMin) / dSpan) * 100;

    // lanes: explicit order, else first-appearance
    let lanes = m.lanes && m.lanes.length ? m.lanes.slice() : [];
    if (!lanes.length) sessions.forEach(s => { if (!lanes.includes(s.lane)) lanes.push(s.lane); });
    const laneColor = {};
    lanes.forEach((l, i) => { laneColor[l] = LANE_PALETTE[i % LANE_PALETTE.length]; });

    // axis ticks (~5)
    const TICKS = 5;
    let ax = '';
    for (let i = 0; i < TICKS; i++) {
      const t = dMin + (i / (TICKS - 1)) * dSpan;
      ax += `<span class="tick" style="left:${px(t).toFixed(1)}%">${fmtAxis(t, span)}</span>`;
    }
    axisEl.innerHTML = ax;

    // lanes + bars
    lanesEl.innerHTML = lanes.map(lane => {
      const color = laneColor[lane];
      const bars = sessions.filter(s => s.lane === lane).map((s, i) => {
        const left = px(s._s), w = Math.max(0.6, px(s._e) - px(s._s));
        const sev = (s.status === 'critical' || s.status === 'warning') ? s.status : null;
        const flag = sev ? `<span class="flag sev-${sev}"></span>` : '';
        const payload = encodeURIComponent(JSON.stringify({
          lane, label: s.label || lane, start: s._s, end: s._e,
          dur: s._e - s._s, status: s.status || '', detail: s.detail || s.note || '',
          band: s.band || '', color
        }));
        return `<div class="w-st-bar${sev ? ' sev-' + sev : ''}" data-st="${payload}"
                  style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;background:${color}">${flag}</div>`;
      }).join('');
      const nowMark = m.now_ms ? `<div class="w-st-now" style="left:${px(toMs(m.now_ms)).toFixed(2)}%"></div>` : '';
      return `<div class="w-st-lane">
        <div class="w-st-lane-lbl"><span class="sw" style="background:${color}"></span>${lane}</div>
        <div class="w-st-track">${bars}${nowMark}</div>
      </div>`;
    }).join('');

    // hover tooltip (fixed-positioned, follows pointer)
    const tipEl = ensureTip();
    lanesEl.querySelectorAll('.w-st-bar').forEach(bar => {
      bar.addEventListener('mousemove', (e) => {
        const d = JSON.parse(decodeURIComponent(bar.dataset.st));
        const rows = [
          `<div class="tr"><span>start</span><span>${fmtClock(d.start)}</span></div>`,
          `<div class="tr"><span>duration</span><span>${fmtDur(d.dur)}</span></div>`,
          d.band ? `<div class="tr"><span>band</span><span>${d.band}</span></div>` : '',
          d.detail ? `<div class="tr"><span>info</span><span>${String(d.detail)}</span></div>` : '',
        ].join('');
        tipEl.innerHTML = `<div class="tt"><span class="sw" style="background:${d.color}"></span>${d.label}${d.status ? ` · ${d.status}` : ''}</div>${rows}`;
        tipEl.style.opacity = '1';
        const pad = 14;
        let x = e.clientX + pad, y = e.clientY + pad;
        const r = tipEl.getBoundingClientRect();
        if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
        if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
        tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
      });
      bar.addEventListener('mouseleave', () => { tipEl.style.opacity = '0'; });
    });

    // legend
    const leg = lanes.map(l => `<span class="item"><span class="sw" style="background:${laneColor[l]}"></span>${l}</span>`);
    const hasCrit = sessions.some(s => s.status === 'critical');
    const hasWarn = sessions.some(s => s.status === 'warning');
    if (hasCrit) leg.push(`<span class="item" style="color:var(--critical)"><span class="sw ring"></span><span style="color:var(--text-2)">${config.critical_label || 'issue'}</span></span>`);
    if (hasWarn) leg.push(`<span class="item" style="color:var(--warning)"><span class="sw ring"></span><span style="color:var(--text-2)">${config.warning_label || 'at-risk'}</span></span>`);
    legendEl.innerHTML = leg.join('');

    metaEl.textContent = `${sessions.length} sessions · ${lanes.length} ${lanes.length === 1 ? 'AP' : 'APs'} · ${fmtDur(span)}`;
  }

  return { render };
});

</script>
