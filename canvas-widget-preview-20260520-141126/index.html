<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>新 Widget 預覽 · 趨勢三件組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* === theme/tokens.css === */
:root {
  /* Surfaces & background — warmer cream to align with marketing site */
  --bg: #fbf8f1;
  --bg-gradient: radial-gradient(at 0% 0%, #f3eee2 0%, #fbf8f1 50%);
  --surface: #ffffff;
  --surface-2: #fbf9f3;

  /* Borders */
  --border: rgba(60, 50, 35, 0.10);
  --border-strong: rgba(60, 50, 35, 0.20);

  /* Text */
  --text-1: #1a2332;
  --text-2: #4a5568;
  --text-3: #8b95a4;

  /* Brand — accent orange becomes primary interaction color (EG-aligned) */
  --brand: #ff6b35;
  --brand-2: #c2410c;

  /* Severity */
  --critical: #b91c1c;
  --critical-bg: #fef2f2;
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --success: #047857;
  --success-bg: #ecfdf5;
  --info: #1d4ed8;
  --info-bg: #eff6ff;

  /* Effects — slightly more pronounced shadow + tighter radius */
  --shadow-sm: 0 1px 2px rgba(60,50,35,.05), 0 0 0 1px rgba(60,50,35,.05);
  --shadow-md: 0 6px 18px rgba(60,50,35,.08), 0 2px 4px rgba(60,50,35,.04);
  --radius: 12px;
  --radius-sm: 8px;

  /* Typography */
  --font-sans: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* === theme/base.css === */
/* Base reset + shell layout */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Sticky header — outer container handles sticky + bg, inner constrains width */
.db-hdr {
  position: sticky; top: 0; z-index: 10;
  background: rgba(247,247,245,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.db-hdr-inner {
  max-width: 1320px; margin: 0 auto;
  padding: 18px 32px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px;
}
.db-hdr-left {
  display: flex; align-items: center; gap: 14px;
  min-width: 0;
}
.db-brand-logo {
  width: 57px; height: 57px;
  flex-shrink: 0;
  display: block;
}
.db-hdr-titles { min-width: 0; }
.db-hdr-titles h1 {
  margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em;
}
.db-hdr-titles .crumb {
  font-size: 13px; color: var(--text-3); margin-top: 3px; font-weight: 500;
}
/* Hide the subtitle row entirely when spec didn't provide one — avoids an
   empty 16px-ish line under the title that makes some canvases look
   bottom-heavy vs others. compose.py always renders the div for layout
   stability; this CSS collapses it when empty. */
.db-hdr-titles .crumb:empty { display: none; }

/* Identity chips · soft-tinted pills in the right header column.
   Account = who (info / blue tint), Scope = what is in view (brand / orange).
   Background uses color-mix to blend the accent into surface — visible but
   not loud enough to compete with severity pills inside the dashboard body. */
.db-chips {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.db-chips[hidden] { display: none; }
.db-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
  color: var(--text-1); line-height: 1.2;
  white-space: nowrap; max-width: 380px;
  overflow: hidden; text-overflow: ellipsis;
  cursor: default;
}
.db-chip[hidden] { display: none; }
.db-chip .ic { font-size: 11px; line-height: 1; flex-shrink: 0; opacity: 0.85; }
/* `.lbl` is hidden by default — account chip just shows the email inline.
   Scope chip opts back in with a small uppercase tag (e.g., SCOPE Danny /
   SNAPSHOT 2026-05-19) because the value alone is too ambiguous (a bare
   "Danny" or "5 orgs" doesn't read as "this is the dashboard scope"). */
.db-chip .lbl { display: none; }
.db-chip-scope .lbl {
  display: inline; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-3); margin-right: 4px;
}
.db-chip-account {
  background: color-mix(in srgb, var(--info) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--info) 22%, var(--border));
}
.db-chip-account .ic { color: var(--info); }
.db-chip-scope {
  background: color-mix(in srgb, var(--brand) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--border));
}
.db-chip-scope .ic { color: var(--brand); }
/* legacy selectors kept for old canvases that haven't been recomposed */
.db-hdr-left h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
.db-hdr-left .crumb { font-size: 13px; color: var(--text-3); margin-top: 3px; font-weight: 500; }
/* Right column stacks two rows so the column has visual weight matching
   the left title+subtitle: actions/status on top, identity chips below.
   Each row right-aligns so the visual edge stays clean. */
.db-hdr-right {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 10px; flex-shrink: 0;
}
.db-hdr-right-row {
  display: flex; align-items: center; gap: 14px;
}
.live-dot {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-2); font-weight: 500;
}
.live-dot::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 0 4px var(--success-bg);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.updated { font-size: 13px; color: var(--text-3); font-family: var(--font-mono); }

/* Auto-refresh state · small pill next to Live tag.
   Two modes:
     .countdown — "next: 4:32" while auto is running (text-3 / surface tint)
     .paused    — "⚠ auto paused" after 3 consecutive errors (critical) */
.db-auto-state {
  font-family: var(--font-mono); font-size: 11px;
  padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.db-auto-state.countdown {
  color: var(--text-3);
  background: color-mix(in srgb, var(--text-3) 8%, var(--surface));
}
.db-auto-state.paused {
  color: var(--critical);
  background: color-mix(in srgb, var(--critical) 10%, var(--surface));
}
.db-auto-state .db-auto-state-close {
  background: transparent; border: 0; padding: 0; margin-left: 4px;
  cursor: pointer; color: inherit; font-size: 12px; opacity: 0.6;
}
.db-auto-state .db-auto-state-close:hover { opacity: 1; }

/* Refresh status banner — sits between Deploy and Live, showing live recipe
   state (pending ticker / success summary / error with close button). */
.db-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
  line-height: 1; white-space: nowrap;
  max-width: 360px; overflow: hidden; text-overflow: ellipsis;
}
.db-status[hidden] { display: none; }
.db-status .ic { font-size: 13px; line-height: 1; }
.db-status-pending { background: var(--info-bg);     color: var(--info); }
.db-status-success { background: var(--success-bg);  color: var(--success); }
.db-status-error   { background: var(--critical-bg); color: var(--critical); }
.db-status-close {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  font-size: 13px; line-height: 1; padding: 0 0 0 6px; opacity: 0.7;
}
.db-status-close:hover { opacity: 1; }

/* Main wrap */
.db-wrap { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--text-1); padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all .15s ease; font-family: inherit;
}
.btn:hover { background: var(--surface-2); border-color: var(--brand); color: var(--brand); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text-1); }
.btn.btn-primary {
  background: var(--brand); color: white; border-color: var(--brand);
}
.btn.btn-primary:hover { background: var(--brand); color: white; border-color: var(--brand); filter: brightness(1.08); }
.btn.btn-primary:disabled:hover { background: var(--brand); color: white; }
.btn.spinning .ic { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ic { display: inline-block; line-height: 1; }
.ic.spin { animation: spin 0.7s linear infinite; }
/* Icon-only button (no label) — gear / cog / similar single-glyph actions */
.btn.db-btn-icon { padding: 6px 9px; }
.btn.db-btn-icon .ic { font-size: 14px; }

/* Snapshot tag (replaces live-dot when canvas is a deployed snapshot) */
.snapshot-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
}

/* Deploy modal */
.db-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 24px;
}
.db-modal-backdrop[hidden] { display: none; }
.db-modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  width: 100%; max-width: 560px; max-height: calc(100vh - 48px);
  overflow: hidden; display: flex; flex-direction: column;
}
.db-modal-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.db-modal-hdr h2 {
  margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
}
.db-modal-close {
  background: transparent; border: 0; font-size: 22px; line-height: 1;
  color: var(--text-3); cursor: pointer; padding: 4px 8px; border-radius: 6px;
}
.db-modal-close:hover { color: var(--text-1); background: var(--surface-2); }
.db-modal-body { padding: 18px 22px; overflow-y: auto; font-size: 14px; }
.db-modal-foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 22px 18px; border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.db-modal-meta {
  display: grid; grid-template-columns: 140px 1fr;
  gap: 6px 12px; margin: 0 0 18px;
  font-size: 13px;
}
.db-modal-meta dt { color: var(--text-3); font-weight: 600; }
.db-modal-meta dd { margin: 0; color: var(--text-1); }
.db-modal-pill {
  display: inline-block; margin-left: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--info-bg); color: var(--info);
}
.db-modal-section h3 {
  margin: 0 0 8px; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3);
}

/* Target chooser — Vercel vs GitHub Pages cards at the top of Deploy modal */
.db-modal-targets {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 0 0 18px;
}
.db-modal-target-pick {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.db-modal-target-pick:hover { background: var(--surface-2); }
.db-modal-target-pick:has(input:checked) {
  background: color-mix(in srgb, var(--brand) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--brand) 38%, var(--border));
}
.db-modal-target-pick input[type="radio"] {
  margin-top: 3px; flex-shrink: 0; accent-color: var(--brand);
}
/* Vercel / GitHub brand logos as inline SVG, currentColor so they go orange
   when the card is the active target and stay text-1 otherwise. */
.db-modal-target-logo {
  width: 22px; height: 22px; flex-shrink: 0;
  color: var(--text-1);
  margin-top: 1px;
}
.db-modal-target-pick:has(input:checked) .db-modal-target-logo {
  color: var(--brand);
}
.db-modal-target-body {
  display: flex; flex-direction: column; gap: 3px;
  font-size: 13px; line-height: 1.4;
}
.db-modal-target-body strong { color: var(--text-1); font-weight: 600; }
.db-modal-target-sub { color: var(--text-3); font-size: 11px; }

/* GH Pages live URL preview line — monospace, shows owner/repo/path */
.db-modal-gh-preview {
  font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: 12px;
  margin-top: 4px;
  color: var(--text-2);
}
.db-modal-gh-preview span[data-bind] {
  color: var(--brand); font-weight: 600;
}

/* Hidden sections (toggled by target radio) */
[data-show-target][hidden] { display: none !important; }

/* Custom URL input: prefix + input + suffix on a single rounded line. The
   input fills the middle, prefix/suffix are inline pseudo-buttons. */
.db-modal-url { margin: 0 0 18px; }
.db-modal-url-label {
  display: block; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-3); margin-bottom: 8px;
}
.db-modal-url-input {
  display: flex; align-items: stretch;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: 13px;
  transition: border-color .15s ease;
}
.db-modal-url-input:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.db-modal-url-input:has(.invalid) { border-color: var(--critical); }
.db-modal-url-prefix,
.db-modal-url-suffix {
  padding: 8px 10px; color: var(--text-3); user-select: none;
  background: var(--surface-2); flex-shrink: 0;
}
.db-modal-url-name {
  flex: 1; min-width: 0;
  border: 0; outline: none;
  background: var(--surface); color: var(--text-1);
  padding: 8px 6px;
  font: inherit;
}
.db-modal-url-name.invalid { background: color-mix(in srgb, var(--critical) 6%, var(--surface)); }
.db-modal-url-help {
  font-size: 11px; color: var(--text-3); margin-top: 6px; line-height: 1.5;
}

/* Secret input (Settings modal) — masked password-style field with an eye
   icon to toggle reveal. Reuses .db-modal-url-input structure so the visual
   shape matches the deploy URL row right above it in the family. */
.db-modal-secret { margin: 0 0 18px; }
.db-modal-secret-label {
  display: block; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-3); margin-bottom: 8px;
}
.db-modal-secret-row {
  display: flex; align-items: stretch;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: border-color .15s ease;
}
.db-modal-secret-row:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.db-modal-secret-row.invalid { border-color: var(--critical); }
.db-modal-secret-input {
  flex: 1; min-width: 0;
  border: 0; outline: none;
  background: transparent; color: var(--text-1);
  padding: 9px 12px;
  font: inherit; font-family: var(--font-mono, ui-monospace, Menlo, monospace);
  font-size: 13px;
  letter-spacing: 0.02em;
}
.db-modal-secret-toggle {
  background: var(--surface-2); border: 0; border-left: 1px solid var(--border);
  padding: 0 14px; cursor: pointer; color: var(--text-2);
  font-size: 15px; line-height: 1;
}
.db-modal-secret-toggle:hover { color: var(--text-1); background: var(--surface); }
.db-modal-secret-help {
  font-size: 11px; color: var(--text-3); margin-top: 6px; line-height: 1.5;
}

/* Auto-refresh dropdown · same visual family as .db-modal-secret. */
.db-modal-auto { margin: 0 0 18px; }
.db-modal-auto-select {
  width: 100%; padding: 9px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font: inherit; font-size: 13px;
  color: var(--text-1); cursor: pointer;
  transition: border-color .15s ease;
}
.db-modal-auto-select:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}

/* "Currently using: <email>" line inside Settings modal */
.db-modal-current {
  margin: 0 0 14px; padding: 10px 12px;
  background: color-mix(in srgb, var(--info) 6%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--info) 20%, var(--border));
  border-radius: 8px;
  font-size: 13px; line-height: 1.5;
  display: flex; align-items: center; gap: 8px;
}
.db-modal-current .ic { font-size: 14px; color: var(--info); }
.db-modal-current strong { font-weight: 600; }

.db-modal-scan { font-size: 13px; line-height: 1.55; }
.db-modal-scan p { margin: 0 0 6px; }
.db-modal-ok { color: var(--success); font-weight: 600; }
.db-modal-scan-list {
  list-style: none; padding: 0; margin: 8px 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px 12px;
}
.db-modal-scan-list li {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 6px 10px; background: var(--surface-2); border-radius: 6px;
  font-size: 12px;
}
.db-modal-scan-list li strong {
  font-variant-numeric: tabular-nums; color: var(--text-1); font-size: 14px;
}
.db-modal-hint {
  font-size: 12px; color: var(--text-3); margin: 8px 0 0 !important;
}
.db-modal-check {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 14px 0 0; font-size: 13px; line-height: 1.5;
  padding: 10px 12px; border-radius: 8px; background: var(--surface-2);
  cursor: pointer;
}
.db-modal-check input { margin-top: 3px; flex-shrink: 0; }

/* Purpose radio — two options stacked. The selected one gets a brand tint
   so the user clearly sees which case applies before pressing Deploy. */
.db-modal-radio {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 8px 0 0; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.db-modal-radio:hover { background: var(--surface-2); }
.db-modal-radio:has(input:checked) {
  background: color-mix(in srgb, var(--brand) 5%, var(--surface));
  border-color: color-mix(in srgb, var(--brand) 35%, var(--border));
}
.db-modal-radio input[type="radio"] { margin-top: 3px; flex-shrink: 0; accent-color: var(--brand); }
.db-modal-radio-body {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 13px; line-height: 1.5;
}
.db-modal-radio-body strong { color: var(--text-1); font-weight: 600; }
.db-modal-radio-desc { color: var(--text-3); font-size: 12px; line-height: 1.55; }
.db-modal-status {
  margin-top: 14px; padding: 10px 12px; border-radius: 8px;
  font-size: 13px; line-height: 1.5;
}
.db-modal-status[hidden] { display: none; }
.db-modal-status-info { background: var(--info-bg); color: var(--info); }
.db-modal-status-error { background: var(--critical-bg); color: var(--critical); }
.db-modal-status-success { background: var(--success-bg); color: var(--success); }
.db-modal-success { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.db-modal-success a {
  color: inherit; font-family: var(--font-mono); font-size: 12px;
  text-decoration: underline;
}
.db-modal-success .btn { padding: 4px 10px; font-size: 11px; }

/* Card surface (shared) */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; box-shadow: var(--shadow-sm);
}
.card-hdr {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.card-hdr h2 {
  margin: 0; font-size: 18px; font-weight: 700;
  letter-spacing: -0.01em; white-space: nowrap;
}
.card-hdr .meta {
  font-size: 12px; color: var(--text-3); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.04em; text-align: right;
}

/* Pills (severity) */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  line-height: 1; letter-spacing: 0.02em;
}
.pill-crit { background: var(--critical-bg); color: var(--critical); }
.pill-warn { background: var(--warning-bg); color: var(--warning); }
.pill-ok { background: var(--success-bg); color: var(--success); }
.pill-info { background: var(--info-bg); color: var(--info); }
.pill-muted { background: rgba(15,23,42,0.05); color: var(--text-2); }

/* Chip filters */
.chips {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
}
.chip {
  font-size: 11px; font-weight: 600; padding: 5px 11px;
  border-radius: 999px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); transition: all .15s ease;
  font-family: inherit; letter-spacing: 0.02em;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.active { background: var(--brand); color: white; border-color: var(--brand); }
.chip .count { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: 0.7; font-size: 10px; }

/* Flash highlight (for cross-widget navigation) */
.flash {
  animation: flash-glow 1.2s ease-out 2;
  --flash-color: var(--brand);
}
@keyframes flash-glow {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 40%, transparent); }
  50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--brand) 10%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 0%, transparent); }
}

/* Empty state */
.empty-state { text-align: center; padding: 36px 16px; color: var(--text-3); font-size: 14px; }

/* Footer */
.db-footnote {
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-3);
  display: flex; justify-content: space-between; gap: 16px;
}
.db-footnote .skills { font-family: var(--font-mono); }


/* === widget line_chart === */

/* line_chart — responsive SVG trend. Crisp at any width via 0–100 viewBox +
   non-scaling-stroke for vectors, HTML overlay for text / dots / hover. */
.w-lc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.w-lc-readout { display: flex; gap: 18px; align-items: baseline; }
.w-lc-readout .ro { display: flex; flex-direction: column; gap: 2px; }
.w-lc-readout .ro-val {
  font-size: 26px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.w-lc-readout .ro-val .unit { font-size: 13px; font-weight: 600; color: var(--text-3); margin-left: 2px; }
.w-lc-readout .ro-lbl {
  font-size: 11px; font-weight: 600; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.05em;
  display: flex; align-items: center; gap: 5px;
}
.w-lc-readout .ro-lbl::before {
  content: ''; width: 9px; height: 9px; border-radius: 2px;
  background: var(--ro-color, var(--brand)); flex-shrink: 0;
}
.w-lc-delta { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.w-lc-delta.up { color: var(--critical); }
.w-lc-delta.down { color: var(--success); }
.w-lc-delta.flat { color: var(--text-3); }

.w-lc-plot { position: relative; height: 230px; margin: 18px 0 4px; }
/* plot area box (shared by svg-canvas / overlay / hit) — explicit 4-side offsets
   so the SVG can use width/height:100% reliably (SVG width:auto is unreliable). */
.w-lc-canvas, .w-lc-overlay, .w-lc-hit { position: absolute; top: 8px; left: 46px; right: 12px; bottom: 24px; }
.w-lc-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.w-lc-grid-line { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.w-lc-grid-line.base { stroke: var(--border-strong); }
.w-lc-thresh { stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; opacity: 0.8; }
.w-lc-line { fill: none; stroke-width: 2.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.w-lc-line.draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: w-lc-draw 1.1s ease-out forwards; }
@keyframes w-lc-draw { to { stroke-dashoffset: 0; } }

/* HTML overlay layer — labels, dots, hover. Positioned in plot-area %. */
.w-lc-ylabels, .w-lc-xlabels { position: absolute; }
.w-lc-ylabels { top: 8px; bottom: 24px; left: 0; width: 42px; }
.w-lc-ylabels span {
  position: absolute; right: 6px; transform: translateY(-50%);
  font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 500;
}
.w-lc-xlabels { left: 46px; right: 12px; bottom: 0; height: 20px; }
.w-lc-xlabels span {
  position: absolute; transform: translateX(-50%);
  font-size: 10px; color: var(--text-3); font-family: var(--font-mono); white-space: nowrap;
}
.w-lc-overlay { pointer-events: none; }
.w-lc-dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(15,23,42,0.25);
}
.w-lc-dot.pulse::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  background: var(--dot-color, var(--brand)); opacity: 0.3;
  animation: w-lc-pulse 1.8s ease-out infinite;
}
@keyframes w-lc-pulse { 0% { transform: scale(0.6); opacity: 0.4; } 100% { transform: scale(2.4); opacity: 0; } }
.w-lc-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-strong); opacity: 0; transition: opacity .1s; }
.w-lc-hover-dot {
  position: absolute; width: 11px; height: 11px; border-radius: 50%;
  transform: translate(-50%, -50%); border: 2px solid var(--surface);
  opacity: 0; box-shadow: 0 1px 4px rgba(15,23,42,0.3);
}
.w-lc-tip {
  position: absolute; transform: translate(-50%, calc(-100% - 12px));
  background: var(--text-1); color: #fff; border-radius: 7px;
  padding: 7px 10px; font-size: 11px; white-space: nowrap;
  opacity: 0; transition: opacity .1s; z-index: 5; box-shadow: var(--shadow-md);
}
.w-lc-tip .tip-t { font-family: var(--font-mono); font-size: 9.5px; opacity: 0.65; margin-bottom: 3px; }
.w-lc-tip .tip-row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.w-lc-tip .tip-row .sw { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.w-lc-tip .tip-row b { font-weight: 700; margin-left: auto; padding-left: 12px; }
.w-lc-hit { cursor: crosshair; }
.w-lc-legend {
  display: flex; gap: 16px; flex-wrap: wrap; padding-top: 12px; margin-top: 6px;
  border-top: 1px solid var(--border); font-size: 12px;
}
.w-lc-legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.w-lc-legend .item .sw { width: 11px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.w-lc-legend .item .sw.dash { background: none !important; border-top: 2px dashed; height: 0; }

/* === widget sparkline === */

/* sparkline — compact list of label · mini-trend · current value · delta.
   For "N metrics, each with a live micro-trend" (per-device CPU, per-AP clients…). */
.w-sl-list { display: flex; flex-direction: column; }
.w-sl-row {
  display: grid; grid-template-columns: minmax(110px, 1.4fr) 2fr minmax(86px, auto);
  align-items: center; gap: 14px;
  padding: 11px 8px; border-radius: var(--radius-sm);
  transition: background .12s ease;
}
.w-sl-row + .w-sl-row { border-top: 1px solid var(--border); }
.w-sl-row:hover { background: var(--surface-2); }
.w-sl-label { min-width: 0; }
.w-sl-label .nm {
  font-size: 13.5px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.w-sl-label .sub {
  font-size: 11px; color: var(--text-3); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.w-sl-spark { position: relative; height: 34px; }
.w-sl-spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.w-sl-spark .ln { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.w-sl-spark .dot {
  position: absolute; width: 7px; height: 7px; border-radius: 50%;
  transform: translate(-50%, -50%); border: 1.5px solid var(--surface);
}
.w-sl-right { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; }
.w-sl-val {
  font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--text-1); letter-spacing: -0.01em;
}
.w-sl-val .u { font-size: 11px; font-weight: 600; color: var(--text-3); margin-left: 1px; }
.w-sl-delta {
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; gap: 2px;
}
.w-sl-delta.up { color: var(--critical); }
.w-sl-delta.down { color: var(--success); }
.w-sl-delta.flat { color: var(--text-3); }
/* invert semantics: some metrics are "higher = better" → set config.higher_better */
.w-sl-delta.good { color: var(--success); }
.w-sl-delta.bad { color: var(--critical); }

/* === widget session_timeline === */

/* session_timeline — Gantt-style lanes for a client's connection journey.
   One lane per AP; bars positioned by start time, width = duration. Roaming
   between APs reads as bars alternating across lanes. Problem sessions
   (auth_fail / short / steering) carry a severity accent. */
.w-st-wrap { --st-gutter: 132px; }
.w-st-axis {
  position: relative; height: 18px; margin-left: var(--st-gutter);
  border-bottom: 1px solid var(--border); margin-bottom: 6px;
}
.w-st-axis .tick {
  position: absolute; top: 0; transform: translateX(-50%);
  font-size: 10px; color: var(--text-3); font-family: var(--font-mono); white-space: nowrap;
}
.w-st-axis .tick::after {
  content: ''; position: absolute; left: 50%; top: 15px; height: 5px; width: 1px; background: var(--border-strong);
}
.w-st-lane { display: grid; grid-template-columns: var(--st-gutter) 1fr; align-items: center; min-height: 36px; }
.w-st-lane + .w-st-lane { border-top: 1px solid var(--border); }
.w-st-lane-lbl {
  font-size: 12.5px; font-weight: 600; color: var(--text-2);
  padding-right: 12px; text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
}
.w-st-lane-lbl .sw { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.w-st-track { position: relative; height: 36px; }
.w-st-track::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
  background: var(--border); opacity: 0.6;
}
.w-st-bar {
  position: absolute; top: 50%; transform: translateY(-50%); height: 16px;
  border-radius: 5px; min-width: 4px; cursor: pointer;
  display: flex; align-items: center; overflow: visible;
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.w-st-bar:hover { transform: translateY(-50%) scaleY(1.18); box-shadow: var(--shadow-md); filter: brightness(1.04); z-index: 4; }
.w-st-bar.sev-critical { box-shadow: inset 3px 0 0 var(--critical), inset 0 0 0 1px color-mix(in srgb, var(--critical) 45%, transparent); }
.w-st-bar.sev-warning { box-shadow: inset 3px 0 0 var(--warning), inset 0 0 0 1px color-mix(in srgb, var(--warning) 45%, transparent); }
.w-st-bar .flag {
  position: absolute; top: -5px; right: -4px; width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--surface);
}
.w-st-bar .flag.sev-critical { background: var(--critical); }
.w-st-bar .flag.sev-warning { background: var(--warning); }
.w-st-now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--brand); border-radius: 2px; z-index: 3; }
.w-st-now::after {
  content: 'now'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--brand);
}
.w-st-tip {
  position: fixed; background: var(--text-1); color: #fff; border-radius: 7px;
  padding: 8px 11px; font-size: 11px; pointer-events: none; opacity: 0; z-index: 50;
  box-shadow: var(--shadow-md); max-width: 260px; transition: opacity .1s;
}
.w-st-tip .tt { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.w-st-tip .tt .sw { width: 8px; height: 8px; border-radius: 2px; }
.w-st-tip .tr { display: flex; gap: 10px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.w-st-tip .tr span:first-child { color: rgba(255,255,255,0.6); }
.w-st-legend {
  display: flex; gap: 16px; flex-wrap: wrap; padding-top: 12px; margin-top: 12px;
  border-top: 1px solid var(--border); font-size: 12px;
}
.w-st-legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.w-st-legend .item .sw { width: 14px; height: 8px; border-radius: 3px; flex-shrink: 0; }
.w-st-legend .item .sw.ring { background: none; box-shadow: inset 3px 0 0 currentColor, inset 0 0 0 1px currentColor; }

</style>

<script>
// Dashboard runtime: polls live-data, dispatches to widgets, exposes event bus.
// Widgets self-register via Dashboard.register('<name>', {init, render}).
//
// Each widget receives in init({el, config, bus, state}) and render(data, ctx).
// `data` is a map of alias → JSON. `ctx` exposes helpers (flash, scrollTo, etc).

window.Dashboard = (() => {
  const widgets = new Map(); // name → factory
  const mounted = [];         // [{name, el, config, state, instance}]
  const bus = new EventTarget();
  let currentSpec = null;     // the spec passed to Dashboard.init — used by modal i18n lookup
  let cachedAccount = null;   // /account response, cached after first fetch
  let cachedOrgs = null;      // /user-orgs response, cached after first fetch
  let liveData = {};          // alias → relative path
  let dataSnapshot = {};      // alias → parsed JSON
  let pollHandle = null;
  let snapshotMeta = null;    // truthy when canvas is a deployed snapshot

  // Auto-refresh state — opt-in via Settings modal, persisted per-canvas in
  // localStorage. setTimeout-based (not setInterval) so manual Refresh can
  // cleanly reset "next at" without doubled fires. See applyAutoRefresh().
  let autoRefreshSeconds = 0;     // 0 = off
  let autoRefreshTimer = null;    // setTimeout handle
  let countdownTimer = null;      // 1s setInterval for UI ticker
  let nextRefreshAt = 0;          // ms timestamp
  let autoRefreshFailCount = 0;
  let autoRefreshPaused = false;
  let runRefreshFn = null;        // bound in init() so Settings save can re-trigger

  function register(name, factory) {
    widgets.set(name, factory);
  }

  function dispatch(type, detail) {
    bus.dispatchEvent(new CustomEvent(type, { detail }));
  }

  function on(type, handler) {
    bus.addEventListener(type, handler);
  }

  // Helpers for widgets
  const ctx = {
    flash(el) {
      if (!el) return;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    },
    scrollToWidget(id, opts = {}) {
      const target = document.querySelector(`[data-widget-id="${id}"]`);
      if (target) {
        target.scrollIntoView({behavior:'smooth', block: opts.block || 'start'});
        setTimeout(() => ctx.flash(target), 300);
      }
    },
    fmtDate(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().split('T')[0];
    },
    fmtDateTime(ms) {
      if (!ms) return 'never';
      return new Date(ms).toISOString().replace('T',' ').slice(0,16);
    },
    daysSince(ms) {
      if (!ms) return Infinity;
      return Math.floor((Date.now() - ms) / 86400000);
    },
    getByPath(obj, path) {
      if (!path) return obj;
      // Support: foo.bar.baz, foo.bar.length, foo[0].bar, foo.bar[2]
      // Tokenize by . and [n] (where n is integer)
      const tokens = [];
      path.split('.').forEach(seg => {
        const m = seg.match(/^([^\[]*)((?:\[\d+\])*)$/);
        if (!m) return;
        if (m[1]) tokens.push(m[1]);
        const idxRe = /\[(\d+)\]/g;
        let im;
        while ((im = idxRe.exec(m[2])) !== null) tokens.push(parseInt(im[1], 10));
      });
      return tokens.reduce((o, k) => {
        if (o == null) return undefined;
        if (k === 'length' && Array.isArray(o)) return o.length;
        return o[k];
      }, obj);
    },
  };

  async function fetchAll() {
    const out = {};
    for (const [alias, path] of Object.entries(liveData)) {
      try {
        const r = await fetch(path, { cache: 'no-store' });
        out[alias] = await r.json();
      } catch (e) {
        console.warn('fetch fail', path, e);
        out[alias] = null;
      }
    }
    dataSnapshot = out;
    return out;
  }

  async function tick() {
    await fetchAll();
    for (const m of mounted) {
      try {
        m.instance.render(dataSnapshot, ctx);
      } catch (e) {
        console.error(`[widget ${m.name}] render error`, e);
      }
    }
    // Update header timestamp (skipped in snapshot mode — handled by applySnapshotMode)
    if (snapshotMeta) return;
    const t = new Date();
    const stamp = document.getElementById('db-updated');
    if (stamp) {
      stamp.textContent = `updated ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    }
  }

  // ---------- Snapshot mode ----------
  // A canvas deployed via /deploy ships a _snapshot.json marker. When present
  // we know we're rendering a frozen public copy (e.g. on Vercel) where the
  // /refresh and /deploy endpoints don't exist — hide those buttons and the
  // "Live" indicator and surface the deployed_at timestamp instead.
  async function detectSnapshotMode() {
    try {
      const r = await fetch('_snapshot.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  function applySnapshotMode(meta) {
    const refresh = document.getElementById('db-refresh');
    const deploy = document.getElementById('db-deploy');
    const liveDot = document.getElementById('db-live-dot');
    const updated = document.getElementById('db-updated');
    if (refresh) refresh.style.display = 'none';
    if (deploy) deploy.style.display = 'none';
    if (liveDot) {
      liveDot.classList.remove('live-dot');
      liveDot.classList.add('snapshot-tag');
      liveDot.textContent = meta.redacted ? 'Snapshot · redacted' : 'Snapshot';
    }
    if (updated) {
      const t = new Date(meta.deployed_at);
      updated.textContent = isNaN(t) ? meta.deployed_at : ctx.fmtDateTime(t.getTime());
    }
  }

  // ---------- Identity chips · Account + Scope ----------
  // serve.py proxies these to api-skills (cached server-side). Snapshot mode
  // can't reach the local endpoints, so it falls back to baked-in info from
  // _snapshot.json (TODO: bake account/scope into snapshot at deploy time).
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function fetchJson(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
    return r.json();
  }

  function fillAccountChip(account) {
    const el = document.getElementById('db-chip-account');
    if (!el || !account) return;
    // Email is the canonical identifier — display names can repeat or be
    // missing. Show email inline; full name lives in the hover tooltip for
    // anyone who wants to confirm who that mailbox belongs to.
    const email = account.email || '';
    if (!email) return;
    const name = [account.given_name, account.family_name]
      .filter(Boolean).join(' ').trim();
    el.innerHTML = `<span class="ic">👤</span>${escapeHtml(email)}`;
    el.hidden = false;
    el.title = name ? `${name} · ${email}` : email;
  }

  function fillScopeChip(refresh, orgsPayload) {
    const el = document.getElementById('db-chip-scope');
    if (!el) return;
    // Snapshot canvas (deployed copy): no API access. Prefer baked-in
    // snapshotMeta.scope (PR follow-up that persists identity into the
    // snapshot). Fall back to the deployed_at date when older snapshots
    // don't carry the baked scope.
    if (snapshotMeta) {
      const baked = snapshotMeta.scope;
      if (baked?.name) {
        el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(baked.name)}`;
        el.hidden = false;
        return;
      }
      const date = (snapshotMeta.deployed_at || '').slice(0, 10);
      const tag = snapshotMeta.redacted ? `${date} · redacted` : date;
      el.innerHTML = `<span class="ic">📷</span><span class="lbl">Snapshot</span>${escapeHtml(tag)}`;
      el.hidden = false;
      return;
    }
    if (!refresh || !refresh.scope) {
      // No refresh declared and no snapshot — nothing to show.
      return;
    }
    const orgs = orgsPayload?.org_candidates || [];
    const findOrg = (id) => orgs.find(o => o.org_id === id);
    let value = '';
    let tooltip = '';
    const ids = refresh.ids || {};
    if (refresh.scope === 'all') {
      const count = orgsPayload?.count ?? orgs.length;
      value = `${count} org${count === 1 ? '' : 's'}`;
      tooltip = orgs.map(o => o.name).filter(Boolean).join(', ');
    } else if (refresh.scope === 'org') {
      const o = findOrg(ids.org_id);
      value = o?.name || ids.org_id || '?';
      tooltip = ids.org_id || '';
    } else if (refresh.scope === 'hv') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  hv_id: ${ids.hv_id || '?'}`;
    } else if (refresh.scope === 'network') {
      const o = findOrg(ids.org_id);
      value = `${o?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      tooltip = `org_id: ${ids.org_id || '?'}  network_id: ${ids.network_id || '?'}`;
    } else {
      value = refresh.scope;
    }
    el.innerHTML = `<span class="ic">🎯</span><span class="lbl">Scope</span>${escapeHtml(value)}`;
    if (tooltip) el.title = tooltip;
    el.hidden = false;
  }

  async function renderIdentityChips(refresh) {
    const chipsHost = document.getElementById('db-chips');
    if (!chipsHost) return;
    // Always show the chip row container once we try; chips inside reveal as
    // their data arrives, so a 502 on /user-orgs still lets account chip show.
    chipsHost.hidden = false;
    const tasks = [];
    if (!snapshotMeta) {
      tasks.push(fetchJson('/account').then(d => { cachedAccount = d; fillAccountChip(d); }).catch(e => {
        console.warn('[chip] /account failed:', e);
      }));
      tasks.push(fetchJson('/user-orgs').then(d => { cachedOrgs = d; fillScopeChip(refresh, d); }).catch(e => {
        console.warn('[chip] /user-orgs failed:', e);
        fillScopeChip(refresh, null);  // still render scope from ids without name lookup
      }));
    } else {
      // Snapshot canvas: no live endpoints. Read baked identity out of
      // snapshotMeta — server bakes account.email + scope.{kind,name,ids}
      // into _snapshot.json at deploy time so the deployed copy keeps the
      // same chips a live one would show.
      if (snapshotMeta.account) fillAccountChip(snapshotMeta.account);
      fillScopeChip(refresh, null);  // fillScopeChip inspects snapshotMeta itself
    }
    await Promise.allSettled(tasks);
    // Hide the host if both chips remained hidden (e.g., snapshot with no scope).
    const accVisible = !document.getElementById('db-chip-account')?.hidden;
    const scpVisible = !document.getElementById('db-chip-scope')?.hidden;
    if (!accVisible && !scpVisible) chipsHost.hidden = true;
  }

  // ---------- Deploy modal ----------
  function deriveCanvasDir() {
    // Pattern: /dashboard-builder/canvases/<canvas-id>/{index.html,}
    // Returns repo-relative dashboard-builder/canvases/<id>, or null if canvas
    // isn't served from the expected path (legacy flat canvas / dev server).
    const path = window.location.pathname;
    const m = path.match(/^(.*\/canvases\/[^/]+)\/?(index\.html)?$/);
    if (!m) return null;
    return m[1].replace(/^\//, '');
  }

  // ---------- i18n · UI strings ----------
  // Source of truth lives in dashboard-builder/skill/locales/*.json.
  // compose.py loads the requested locale (with en fallback) and embeds the
  // resolved dict as spec.i18n. Runtime + widgets read from there.
  // Adding a new language = drop a new locales/<lang>.json + zero JS changes.
  //
  // EN_FALLBACK kicks in only for legacy canvases composed before i18n was
  // wired up — those canvases lack spec.i18n. Mirrors locales/en.json so old
  // canvases keep working until they're recomposed.
  const EN_FALLBACK = {"deploy":{"title":"Deploy & share this dashboard","close":"Close","target":"Deploy to","target_vercel":"Vercel","target_vercel_sub":"Public URL · 3–30s · needs vercel login","target_ghpages":"GitHub Pages","target_ghpages_sub":"Public URL · 1–2 min · needs gh login + your repo","eta":"Estimated time","eta_vercel":"3–30 seconds","eta_ghpages":"1–2 minutes","url_label":"URL","url_suffix":".vercel.app","url_help":"Type here → URL updates live. Lowercase letters, digits and -, max 100 chars.","url_invalid":"Only lowercase letters, digits and -","repo_label":"GitHub repo","repo_placeholder":"owner/repo","repo_help":"Pick one of your repos (listed via gh CLI), or type owner/repo manually.","repo_invalid":"Format: owner/repo","repo_loading":"Listing repos…","repo_no_gh":"gh CLI not installed / logged in. Try `brew install gh && gh auth login`.","path_label":"Path","path_placeholder":"canvas-my-dashboard","path_help":"Subdirectory on the gh-pages branch of that repo.","path_invalid":"Only letters / digits / . _ -","scan_title":"Privacy check","scan_pending":"Checking…","scan_clean":"✓ No personal or org identifiers found — safe to share.","scan_has":"This dashboard includes identifying data:","purpose_title":"What's this deploy for?","purpose_keep_label":"Just me or my team","purpose_keep_desc":"Keep real org_id / MAC / IP / email values. The URL is public, so only share it with people who already have access to the raw data.","purpose_share_label":"Sharing with others / external demo","purpose_share_desc":"Auto-replace org_id / MAC / IP / email with demo placeholders (org A → demo-org-1; same input → same placeholder, so charts keep working).","cancel":"Cancel","deploy":"Deploy","deploying":"Deploying to Vercel… usually 3–30 seconds.","deploy_failed":"Deploy failed","deployed":"Deployed ✓","copy":"Copy URL","copied":"Copied!","network_err":"Can't reach the local server. Is `bash scripts/serve.sh` running?","not_a_canvas":"Deploy is only available for canvases served from /dashboard-builder/canvases/<id>/.","fields":{"org":"org_id","mac":"MAC","serial":"serial","ip":"IP","email":"email"}},"settings":{"title":"Settings","close":"Close","current_using":"Currently using","no_account":"No account loaded","key_label":"EnGenius API key","key_placeholder":"Paste a key to override the default…","key_help":"Default comes from .env / built-in value. A key entered here lives only in this server process — server restart reverts.","reveal":"Show","hide":"Hide","reset":"Reset to default","save":"Save & apply","saving":"Validating…","invalid":"Wrong shape (8–200 chars, letters/digits/+/=_-)","api_error":"API rejected this key","saved":"✓ Applied","reset_done":"✓ Reset to default","auto_refresh_label":"Auto-refresh","auto_off":"Off","auto_5min":"Every 5 minutes","auto_10min":"Every 10 minutes","auto_15min":"Every 15 minutes","auto_help":"Re-runs Refresh on a timer while the tab is in foreground. Pauses when the tab is hidden or after 3 consecutive errors."},"status":{"refreshing":"refreshing","refreshed":"refreshed","refresh_failed":"refresh failed","refresh_error":"refresh error","files_one":"file","files_many":"files","scope_all":"scope=all","scope_org":"scope=org","scope_hv":"scope=hv","scope_network":"scope=network","next_in":"next: {time}","auto_paused":"⚠ auto paused ({n} errors)"},"table":{"search_placeholder":"Search...","empty_state":"No rows match this filter","page_first":"« First","page_prev":"← Prev","page_next":"Next →","page_last":"Last »","page_indicator":"Page {n} of {total}","title_first":"First page","title_prev":"Previous page","title_next":"Next page","title_last":"Last page","items_count":"{n} items"}};

  function t() {
    return (currentSpec && currentSpec.i18n) || EN_FALLBACK;
  }
  // Interpolate {placeholder} in a string with values from `vars`.
  function tFmt(str, vars) {
    if (!str) return '';
    return String(str).replace(/\{(\w+)\}/g, (_, k) => (vars && k in vars ? vars[k] : `{${k}}`));
  }


  // Vercel project name rules: lowercase alphanumeric + dash, ≤ 100 chars.
  // We normalise as user types: dash-separate invalid chunks, collapse runs.
  // Crucially the edge-dash strip ONLY runs on submit — stripping while the
  // user is mid-edit eats the dash they just typed and prevents them from
  // continuing (e.g. typing "abc-" → field becomes "abc" → can't add "-d").
  const PROJECT_NAME_RE = /^[a-z0-9-]+$/;
  function sanitizeProjectName(raw, { trimEdges = false } = {}) {
    let s = String(raw || '')
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, '-')
      .replace(/-+/g, '-')
      .slice(0, 100);
    if (trimEdges) s = s.replace(/^-+|-+$/g, '');
    return s;
  }
  function deriveDefaultProjectName(canvasDir) {
    // canvasDir is dashboard-builder/canvases/<id>/. Use the trailing <id>.
    const m = String(canvasDir || '').match(/canvases\/([^/]+)\/?$/);
    return sanitizeProjectName(m ? m[1] : 'canvas-snapshot');
  }

  // Build the identity payload to bake into _snapshot.json so the deployed
  // copy keeps Account + Scope chips populated even without live endpoints.
  // Reads from the in-memory caches populated by renderIdentityChips.
  function buildSnapshotMetaForDeploy(refresh) {
    const out = {};
    if (cachedAccount?.email) {
      out.account = { email: cachedAccount.email };
    }
    if (refresh?.scope) {
      const orgs = cachedOrgs?.org_candidates || [];
      const findOrg = (id) => orgs.find(o => o.org_id === id);
      const ids = refresh.ids || {};
      let name = '';
      if (refresh.scope === 'all') {
        const count = cachedOrgs?.count ?? orgs.length;
        name = `${count} org${count === 1 ? '' : 's'}`;
      } else if (refresh.scope === 'org') {
        name = findOrg(ids.org_id)?.name || ids.org_id || '?';
      } else if (refresh.scope === 'hv') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › HV ${ids.hv_id?.slice(-6) || '?'}`;
      } else if (refresh.scope === 'network') {
        name = `${findOrg(ids.org_id)?.name || ids.org_id} › Net ${ids.network_id?.slice(-6) || '?'}`;
      }
      if (name) out.scope = { kind: refresh.scope, name, ids };
    }
    return Object.keys(out).length ? out : null;
  }

  function ensureModal(t) {

    if (host) return host;

    host.hidden = true;
    host.innerHTML = `
      <div class="db-modal" role="dialog" aria-labelledby="db-modal-title">
        <div class="db-modal-hdr">
          <h2 id="db-modal-title">${escapeHtml(t.title)}</h2>
          <button class="db-modal-close" type="button" aria-label="${escapeHtml(t.close)}">×</button>
        </div>
        <div class="db-modal-body">
          <div class="db-modal-targets" data-section="targets">
            <label class="db-modal-target-pick">
              <input type="radio" name="db-modal-target" value="vercel" checked />
              <svg class="db-modal-target-logo" viewBox="0 0 76 65" aria-hidden="true">
                <path fill="currentColor" d="M37.5274 0L75.0548 65H0z"/>
              </svg>
              <span class="db-modal-target-body">
                <strong>${escapeHtml(t.target_vercel)}</strong>
                <span class="db-modal-target-sub">${escapeHtml(t.target_vercel_sub)}</span>
              </span>
            </label>
            <label class="db-modal-target-pick">
              <input type="radio" name="db-modal-target" value="gh-pages" />
              <svg class="db-modal-target-logo" viewBox="0 0 16 16" aria-hidden="true">
                <!-- Invertocat: filled circle + cat cutout. Circle takes
                     currentColor (brand when selected, text-1 otherwise);
                     cat uses --surface so it always reads as contrast. -->
                <circle cx="8" cy="8" r="8" fill="currentColor"/>
                <path fill="var(--surface)" d="M8 1.5C4.69 1.5 2 4.19 2 7.5c0 2.66 1.72 4.91 4.1 5.7.3.06.41-.13.41-.28v-.99c-1.51.27-1.9-.37-2.02-.71-.07-.17-.36-.71-.61-.85-.21-.11-.51-.39-.01-.4.47 0 .81.43.92.61.54.91 1.4.65 1.75.5.05-.39.21-.65.39-.8-1.34-.15-2.74-.67-2.74-2.96 0-.65.23-1.2.61-1.61-.06-.15-.27-.77.06-1.59 0 0 .51-.16 1.65.61.48-.13.99-.2 1.5-.2.51 0 1.02.07 1.5.2 1.15-.78 1.65-.61 1.65-.61.33.82.12 1.44.06 1.59.38.42.61.96.61 1.61 0 2.3-1.4 2.81-2.73 2.96.22.19.4.55.4 1.11v1.65c0 .16.11.35.41.28a6.011 6.011 0 0 0 4.1-5.7c0-3.31-2.69-6-6-6z"/>
              </svg>

  function setModalScan(host, payload, t) {
    const scanEl = host.querySelector('[data-section="identifiers"] .db-modal-scan');
    const total = payload.identifiers?.total || 0;
    const counts = payload.identifiers?.counts || {};
    const conditional = host.querySelectorAll('[data-show="if-identifiers"]');
    const go = host.querySelector('.db-modal-go');
    if (!total) {
      // No identifiers at all → safe path: skip the purpose chooser.
      scanEl.innerHTML = `<span class="db-modal-ok">${escapeHtml(t.scan_clean)}</span>`;
      conditional.forEach(el => el.style.display = 'none');
      go.disabled = false;
      return;
    }
    const items = Object.entries(counts)
      .map(([k, n]) => `<li><span>${escapeHtml(t.fields[k] || k)}</span><strong>${n}</strong></li>`)
      .join('');
    scanEl.innerHTML = `
      <p>${escapeHtml(t.scan_has)}</p>
      <ul class="db-modal-scan-list">${items}</ul>
    `;
    conditional.forEach(el => el.style.display = '');
    // Reset purpose radio to default = keep (no redact). Both options always
    // selectable; Deploy is enabled unconditionally since the radio has a
    // default value, and either choice is a valid deploy.
    const keepRadio = host.querySelector('input[name="db-modal-purpose"][value="keep"]');
    if (keepRadio) keepRadio.checked = true;
    go.disabled = false;
  }

  function setModalStatus(host, msg, kind = 'info') {
    const el = host.querySelector('.db-modal-status');
    el.hidden = false;
    el.className = `db-modal-status db-modal-status-${kind}`;
    el.innerHTML = msg;
  }

            <select id="db-settings-auto" class="db-modal-auto-select">
              <option value="0">${escapeHtml(t.auto_off || 'Off')}</option>
              <option value="300">${escapeHtml(t.auto_5min || 'Every 5 minutes')}</option>
              <option value="600">${escapeHtml(t.auto_10min || 'Every 10 minutes')}</option>

    host.querySelector('.db-modal-close').addEventListener('click', close);
